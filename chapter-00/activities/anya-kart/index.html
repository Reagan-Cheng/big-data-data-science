<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="安妮亞賽車">
<meta name="theme-color" content="#ffb6c9">
<link rel="apple-touch-icon" href="img/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>安妮亞 3D 賽車</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="c"></canvas>

<div id="loading" class="screen"><div class="loader">賽道建造中…</div></div>

<div id="title" class="screen hidden">
  <div class="logo">
    <span class="logo-sub">ANYA KART 3D</span>
    <h1>安妮亞<br>3D 賽車</h1>
  </div>
  <button id="btnStart" class="big-btn">開始遊戲</button>
  <p class="hint">建議把 iPad 橫放遊玩 · 電腦：方向鍵開車、E 鍵用道具</p>
  <button id="updateNote" class="update-note hidden"></button>
  <div class="version-tag" id="verTitle"></div>
</div>

<div id="select" class="screen hidden">
  <h2 class="sel-title">選擇你的選手</h2>
  <div class="sel-bottom">
    <div class="track-row">
      <div class="seg" id="trackSel"><span>賽道</span></div>
      <div id="trackDesc" class="track-desc"></div>
    </div>
    <div id="cards" class="cards"></div>
    <div class="options">
      <div class="seg" id="diff">
        <span>難度</span>
        <button data-v="0">簡單</button>
        <button data-v="1" class="on">普通</button>
        <button data-v="2">困難</button>
      </div>
      <div class="seg" id="speedSel">
        <span>車速</span>
        <button data-v="0" class="on">標準</button>
        <button data-v="1">慢一點</button>
        <button data-v="2">更慢</button>
      </div>
      <label class="toggle"><input type="checkbox" id="autoGas" checked> 自動油門</label>
    </div>
    <div class="row-btns">
      <button id="btnBack" class="small-btn">← 返回</button>
      <button id="btnGo" class="big-btn">出發！</button>
    </div>
  </div>
</div>

<div id="hud" class="hidden">
  <div class="hud-tl">
    <div id="hudPos" class="pos">4<small>/4</small></div>
    <div id="hudLap" class="lap">圈數 1/3</div>
    <div id="hudTime" class="time">00:00.00</div>
  </div>
  <canvas id="minimap" width="320" height="320"></canvas>
  <div class="hud-bc">
    <div id="hudSpeed" class="speed">0<small> km/h</small></div>
    <div id="peanutPop" class="peanut-pop"></div>
    <div id="hudPeanut" class="peanut">🥜 × 0</div>
  </div>
  <button id="btnPause" class="pause-btn" aria-label="暫停">II</button>
  <div id="banner" class="banner"></div>
</div>

<div id="controls" class="hidden">
  <div class="ctl-left">
    <button class="ctl" data-k="left" aria-label="左轉">◀</button>
    <button class="ctl" data-k="right" aria-label="右轉">▶</button>
  </div>
  <button id="btnItem" class="item-btn" aria-label="使用道具"><small>道具</small></button>
  <div class="ctl-right">
    <button class="ctl brake" data-k="brake">煞車</button>
    <button class="ctl gas" data-k="gas" id="btnGas">油門</button>
  </div>
</div>

<div id="countdown" class="countdown hidden"></div>

<div id="pause" class="screen dim hidden">
  <h2>暫停</h2>
  <button id="btnResume" class="big-btn">繼續</button>
  <button id="btnRestart" class="small-btn">重新開始</button>
  <button id="btnMenu" class="small-btn">回選手選擇</button>
  <div class="version-tag pause-ver" id="verPause"></div>
</div>

<div id="result" class="screen dim hidden">
  <h2 id="resultTitle">比賽結束</h2>
  <ol id="resultList" class="result-list"></ol>
  <div class="row-btns">
    <button id="btnSelect" class="small-btn">換選手</button>
    <button id="btnAgain" class="big-btn">再玩一次</button>
  </div>
</div>

<button id="btnMute" class="mute-btn" aria-label="音效">🔊</button>

<script src="version.js"></script>
<script type="module" src="main.js?v=1.9"></script>
</body>
</html>
