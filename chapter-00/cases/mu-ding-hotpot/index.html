<style>
:root{
  --bg:#f4f2ed; --panel:#fff; --ink:#1b2433; --ink2:#4d5869; --ink3:#7a8494; --line:#dcd8cf; --line2:#ebe8e1;
  --navy:#102a56; --blue:#1f5fb8; --blue2:#3f84d6; --blue-wash:#e8f0fc;
  --good:#127a3d; --good-wash:#e3f4e9; --bad:#c0282f; --bad-wash:#fcebeb; --gold:#e8a317; --mark:#ffe58a;
  --teal:#0f766e; --dcard:#e07a1f;
  --k:1;
  --fs:calc(clamp(17px, 0.5vw + 13.5px, 21px) * var(--k));
  --bar:52px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",Arial,sans-serif;line-height:1.6}
button,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}

/* ---------- top bar ---------- */
.top{position:fixed;inset:0 0 auto 0;z-index:50;height:calc(var(--bar) + env(safe-area-inset-top));padding:env(safe-area-inset-top) 12px 0;background:var(--navy);color:#fff;display:flex;align-items:center;gap:10px}
.top a.home{color:#fff;text-decoration:none;font-weight:700;font-size:14px;opacity:.85;white-space:nowrap}
.top .ttl{flex:1;min-width:0;font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;gap:6px;align-items:center}
.tools button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:9px;height:34px;min-width:34px;padding:0 10px;font-weight:800;font-size:14px;cursor:pointer}
.tools button[aria-pressed="true"]{background:#fff;color:var(--navy)}
.langsw{display:flex;border:1px solid rgba(255,255,255,.35);border-radius:9px;overflow:hidden}
.tools .langsw button{border:0;border-radius:0;background:transparent;min-width:40px}
.tools .langsw button[aria-pressed="true"]{background:#fff;color:var(--navy)}
.progress{position:absolute;left:0;bottom:0;height:3px;background:var(--gold);width:0}

/* ---------- hero ---------- */
.hero{min-height:100svh;display:flex;align-items:center;padding:calc(var(--bar) + 40px) 20px 60px;background:radial-gradient(1100px 600px at 85% 15%,#1f5fb8 0,transparent 60%),linear-gradient(160deg,#0c2148,#102a56 55%,#163a75);color:#fff;position:relative;overflow:hidden}
.hero .in{max-width:1100px;margin:0 auto;width:100%;display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center}
.kicker{display:inline-block;font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);padding:5px 12px;border-radius:999px}
.hero h1{font-family:Georgia,"Iowan Old Style","Times New Roman",serif;font-size:clamp(38px,6vw,70px);line-height:1.05;margin:18px 0 14px;letter-spacing:-.01em}
.hero p.sub{font-size:17px;opacity:.88;margin:0 0 26px;max-width:34em}
.hero .meta{display:flex;flex-wrap:wrap;gap:10px;font-size:14px;opacity:.9;margin-bottom:28px}
.hero .meta span{border-left:3px solid var(--gold);padding-left:9px}
.btn{display:inline-flex;align-items:center;gap:10px;background:var(--gold);color:#1b2433;font-weight:900;border:0;border-radius:12px;padding:14px 22px;font-size:17px;cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.45);margin-left:8px}
.keys{margin-top:18px;font-size:13px;opacity:.75}
.keys kbd{display:inline-block;border:1px solid rgba(255,255,255,.45);border-radius:5px;padding:0 6px;font-family:inherit;font-size:12px;margin:0 2px}
.hero-art{width:100%;max-width:420px;justify-self:center}
.hero-art .bob{animation:bob 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes bob{50%{transform:translateY(-8px)}}

/* ---------- parts ---------- */
.part{max-width:1180px;margin:0 auto;padding:0 20px;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:56px;position:relative}
.part + .part{border-top:1px dashed var(--line)}
.figwrap{position:sticky;top:calc(var(--bar) + 20px);height:calc(100svh - var(--bar) - 40px);display:flex;flex-direction:column;justify-content:center;gap:10px}
.fig{position:relative;width:100%;aspect-ratio:4/3;background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:0 18px 40px -22px rgba(16,42,86,.35);overflow:hidden}
.fig svg{display:block;width:100%;height:100%}
.chip{position:absolute;top:10px;right:12px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);background:#f6f5f1;border:1px solid var(--line2);border-radius:999px;padding:2px 9px}
.pips{display:flex;gap:6px;justify-content:center}
.pips i{width:8px;height:8px;border-radius:50%;background:var(--line);transition:background .3s,transform .3s}
.pips i.on{background:var(--blue)}
.pips i.cur{transform:scale(1.35);background:var(--navy)}
.text{padding:34svh 0 44svh}
.plabel{display:flex;align-items:baseline;gap:12px;margin-bottom:14px;color:var(--blue);font-weight:900;letter-spacing:.05em;text-transform:uppercase;font-size:13px}
.plabel b{font-family:Georgia,serif;font-size:44px;line-height:1;color:var(--navy);letter-spacing:0}
.plabel span{color:var(--ink3)}
.plabel em{font-style:normal}
.case-title{font-family:Georgia,"Iowan Old Style",serif;font-size:calc(var(--fs) * 1.25);color:var(--navy);margin:0 0 18px;font-weight:700}
.text p{font-family:Georgia,"Iowan Old Style","Times New Roman",serif;font-size:var(--fs);line-height:1.75;margin:0 0 1.1em;color:var(--ink)}
.s{transition:opacity .35s,background-color .35s;border-radius:4px;-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:1px 2px;margin:0 -2px;cursor:pointer}
.s.cur{background-color:rgba(31,95,184,.08)}
body.spot .s{opacity:.25}
body.spot .s.cur{opacity:1;background-color:transparent}
mark{background:linear-gradient(transparent 58%,var(--mark) 58%) no-repeat 0 0/0% 100%;color:inherit;transition:background-size .9s cubic-bezier(.3,.7,.2,1) .15s;padding:0 1px}
.s.seen mark{background-size:100% 100%}
html[lang="zh-Hant"] body{font-family:system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
html[lang="zh-Hant"] .text p,html[lang="zh-Hant"] .jr-intro p,html[lang="zh-Hant"] .disc li{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.95;letter-spacing:.02em}
html[lang="zh-Hant"] .hero h1,html[lang="zh-Hant"] .case-title,html[lang="zh-Hant"] .sec-title{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-weight:900;letter-spacing:.02em}
html[lang="zh-Hant"] .hero h1{line-height:1.18}

/* ---------- journey map activity ---------- */
.journey{max-width:1120px;margin:0 auto;padding:14svh 20px 8svh;border-top:1px dashed var(--line)}
.sec-title{font-family:Georgia,serif;font-size:clamp(28px,3.4vw,40px);color:var(--navy);margin:8px 0 16px}
.jr-intro{max-width:820px}
.jr-intro p{font-family:Georgia,"Iowan Old Style",serif;font-size:var(--fs);line-height:1.7;margin:0 0 .8em}
.jr-how{background:#fff;border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:12px;padding:12px 16px;margin:18px 0 22px;font-size:15px;color:var(--ink2)}
.jr-board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;position:relative}
.stage{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:10px;position:relative}
.stage .no{width:30px;height:30px;border-radius:8px;background:var(--navy);color:#fff;font-weight:900;display:grid;place-items:center}
.stage h3{margin:0;font-size:16px;line-height:1.35;color:var(--navy)}
.stage ol{margin:0;padding-left:20px;font-size:13.5px;color:var(--ink2)}
.faces{display:flex;justify-content:space-between;gap:2px}
.faces button{flex:1;min-width:0;border:1px solid var(--line);background:#faf9f6;border-radius:10px;padding:6px 0 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;transition:transform .15s,background .15s,border-color .15s}
.faces button .e{font-size:22px;line-height:1.1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.faces button .v{font-size:11px;font-weight:800;color:var(--ink3)}
.faces button[aria-pressed="true"]{background:var(--blue-wash);border-color:var(--blue);transform:translateY(-2px)}
.faces button[aria-pressed="true"] .v{color:var(--blue)}
.stage .lbl{font-size:12.5px;color:var(--ink3);min-height:1.2em}
.stage textarea{width:100%;min-height:62px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:8px;font-size:14px;background:#fcfbf8}
.jr-result{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,.6fr);gap:16px;margin-top:18px}
.curve,.score{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.curve svg{width:100%;height:auto;display:block}
.score .big{font-size:56px;font-weight:950;color:var(--navy);line-height:1;margin:8px 0}
.score .scale{list-style:none;padding:0;margin:10px 0 0;font-size:14px;color:var(--ink2)}
.score .scale li{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line2);padding:3px 0}
.score .reset{margin-top:12px;border:1px solid var(--line);background:#faf9f6;border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:700}
.disc{max-width:900px;margin:0 auto;padding:6svh 20px 16svh}
.disc ol{margin:0;padding:0;list-style:none;counter-reset:q}
.disc li{counter-increment:q;background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 22px 20px 70px;margin-bottom:14px;position:relative;font-size:var(--fs);line-height:1.6}
.disc li::before{content:counter(q);position:absolute;left:20px;top:18px;width:34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;font-weight:900;display:grid;place-items:center;font-size:16px}
.disc li .s{cursor:default}
.disc li b{color:var(--blue)}
footer{border-top:1px solid var(--line);padding:22px 20px 40px;text-align:center;font-size:13px;color:var(--ink3)}
footer p{margin:4px 0}

/* ---------- floating step controls ---------- */
.step{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:45;display:flex;flex-direction:column;gap:8px}
.step button{width:48px;height:48px;border-radius:50%;border:0;background:var(--navy);color:#fff;font-size:20px;font-weight:900;box-shadow:0 8px 20px rgba(16,42,86,.35);cursor:pointer}
.step button:disabled{opacity:.35;cursor:default}

/* ---------- SVG animation system ----------
   [data-s="a"] visible from stage a;  [data-s="a-b"] visible for stages a..b;  [data-m="a"] gets .mv from stage a
   .d1–.d4 delay on entering */
.fig [data-s]{opacity:0;transition:opacity .55s ease,transform .8s cubic-bezier(.2,.8,.2,1);transition-delay:0s}
.fig [data-s].on{opacity:1}
.fig .on.d1{transition-delay:.6s}.fig .on.d2{transition-delay:1.3s}.fig .on.d3{transition-delay:2.1s}.fig .on.d4{transition-delay:2.9s}
.fig *{transform-box:fill-box}
.up{transform:translateY(14px)} .up.on{transform:none}
.pop{transform:scale(.6);transform-origin:center} .pop.on{transform:scale(1)}
.slide-l{transform:translateX(-30px)} .slide-l.on{transform:none}
.slide-r{transform:translateX(30px)} .slide-r.on{transform:none}
/* children without their own data-s animate in with their parent */
.fig .up:not([data-s]),.fig .pop:not([data-s]),.fig .slide-l:not([data-s]),.fig .slide-r:not([data-s]){transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.fig .on > .up:not([data-s]),.fig .on > .pop:not([data-s]),.fig .on > .slide-l:not([data-s]),.fig .on > .slide-r:not([data-s]){transform:none}
.fig .on > .d1:not([data-s]){transition-delay:.6s}.fig .on > .d2:not([data-s]){transition-delay:1.3s}.fig .on > .d3:not([data-s]){transition-delay:2.1s}
.gx{transform:scaleX(0);transform-origin:left center;transition:transform 1.1s cubic-bezier(.3,.7,.2,1)!important}
.on .gx{transform:scaleX(1)}
.on .gx.d1{transition-delay:.7s!important}
.dot{opacity:0;transform:scale(.3);transform-origin:center;transition:opacity .3s,transform .45s cubic-bezier(.3,1.6,.5,1)}
.on .dot{opacity:1;transform:scale(1)}
.fade-mv{transition:opacity .8s}.fade-mv.mv{opacity:.25}
.expire{transition:opacity 2.4s ease 2.2s}.on .expire{opacity:.15}
.slide-mv{transition:transform 1.4s cubic-bezier(.45,.05,.3,1)}
.hand.mv{transform:translateX(120px)}
.spin{animation:spin 7s linear infinite;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.ring{animation:ring 1s ease-in-out infinite;transform-origin:center}
@keyframes ring{0%,40%,100%{transform:rotate(0)}10%,30%{transform:rotate(-14deg)}20%{transform:rotate(14deg)}}
.flow{animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-24}}
.blink{animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-origin:center}
@keyframes pulse{50%{transform:scale(1.08)}}
.shake{animation:shake .5s ease-in-out infinite;transform-origin:center}
@keyframes shake{25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
.drain{animation:drain 6s linear infinite;transform-origin:left center}
@keyframes drain{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.stamp{transform:scale(1.6) rotate(-12deg);transform-origin:center;opacity:0;transition:transform .35s cubic-bezier(.3,1.5,.5,1),opacity .2s!important}
.on .stamp,.stamp.on{transform:scale(1) rotate(-12deg);opacity:1}
.on .stamp.d2,.stamp.on.d2{transition-delay:1.3s!important}
.travel{animation:travel 3.2s ease-in-out infinite}
@keyframes travel{0%{transform:translateX(0);opacity:0}15%{opacity:1}80%{opacity:1}100%{transform:translateX(34px);opacity:0}}

@media (max-width:860px){

}
@media (min-width:861px) and (max-width:1100px){.jr-board{grid-template-columns:repeat(3,minmax(0,1fr))}}

@media print{
  .top,.step,.figwrap,.hero-art{display:none}

}

.paras p{margin:0 0 1.1em}
.fig text{font-family:system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
.hero h1{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-weight:900;line-height:1.18}

.steam{animation:steam 2.6s ease-in-out infinite;transform-origin:center bottom}
@keyframes steam{0%{opacity:0;transform:translateY(6px)}40%{opacity:.8}100%{opacity:0;transform:translateY(-14px)}}
.tick{animation:tick 4s linear infinite;transform-origin:240px 50px}

}
</style>

五分鐘"]], [1, "林志遠必須決定：未來三年是否最高投入4.8億元，以及要走哪一條路。", ["最高投入4.8億元"]]]}, {"bullet": true, "s": [[2, "方案A 穩健資料化（2.1億）：鼎雲平台擴及全部門市，先補資料品質與店長訓練，營運長陳柏翰支持。", ["方案A 穩健資料化（2.1億）"]]]}, {"bullet": true, "s": [[3, "方案B 智慧門市升級（4.8億）：25家高營收店導入智慧廚房、平板點餐與機器人，資訊長許雅雯支持。", ["方案B 智慧門市升級（4.8億）"]]]}, {"bullet": true, "s": [[4, "方案C 體驗生態圈（3.6億）：以會員資料串起雲桌共餐、企業團餐與10家旗艦店情境服務，行銷長蔡宜庭支持。", ["方案C 體驗生態圈（3.6億）"]]]}, {"s": [[5, "財務長黃珮瑜沒有表態，只建議任何方案都要有停止點與階段指標。", ["停止點與階段指標"]], [6, "董事長周美玲則認為，公司須先釐清哪些環節該科技化、哪些必須保留人的判斷。", ["哪些必須保留人的判斷"]]]}]}];
const QUESTIONS = ["建議選擇哪一套方案，原因為何?", "按照前面說明過的六大關鍵，沐鼎鮮鍋應該做哪些事情?"];
(function(){
  "use strict";
  var NS="http://www.w3.org/2000/svg";
  function el(tag,attrs,parent){var e=document.createElementNS(NS,tag);for(var k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
  function esc(t){return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
  function marked(text,marks){var h=esc(text);(marks||[]).forEach(function(m){var e=esc(m),i=h.indexOf(e);if(i>=0)h=h.slice(0,i)+"<mark>"+e+"</mark>"+h.slice(i+e.length);});return h;}

  var sections=[].slice.call(document.querySelectorAll(".part"));
  sections.forEach(function(sec,i){
    var P=CASE[i],box=sec.querySelector(".paras");
    sec.querySelector(".case-title").textContent=P.title;
    P.paras.forEach(function(par){
      var p=document.createElement("p");if(par.bullet)p.className="bullet";
      par.s.forEach(function(q){var s=document.createElement("span");s.className="s";s.dataset.st=q[0];s.innerHTML=(par.bullet&&q===par.s[0]?"• ":"")+marked(q[1],q[2]);p.appendChild(s);});
      box.appendChild(p);
    });
  });
  var dl=document.getElementById("discList");
  QUESTIONS.forEach(function(q){var li=document.createElement("li");li.textContent=q;dl.appendChild(li);});

  document.querySelectorAll('[data-gen="stores"]').forEach(function(g){
    var x=+g.dataset.x,y=+g.dataset.y;
    for(var i=0;i<52;i++){var u=el("use",{href:"#store",x:x+(i%13)*28,y:y+Math.floor(i/13)*40,width:24,height:22,"class":"dot"},g);u.style.transitionDelay=(i*35)+"ms";}
  });

  function range(v){var a=v.split("-");return [+a[0],a.length>1?+a[1]:Infinity];}
  function setStage(fig,n){
    if(fig._st===n)return;fig._st=n;
    fig.querySelectorAll("[data-s]").forEach(function(e){var r=range(e.dataset.s);e.classList.toggle("on",n>=r[0]&&n<=r[1]);});
  }
  var parts=sections.map(function(p){
    var ss=[].slice.call(p.querySelectorAll(".s")),pips=p.querySelector(".pips");
    ss.forEach(function(){pips.appendChild(document.createElement("i"));});
    return {fig:p.querySelector(".fig"),ss:ss,pips:[].slice.call(pips.children)};
  });
  var allS=[].slice.call(document.querySelectorAll(".part .s"));
  function pos(s){var r=s.getClientRects()[0];if(!r)return Infinity;var p=s.parentElement.getBoundingClientRect();return r.top+(r.left-p.left)/Math.max(1,p.width)*r.height;}
  function trigger(){return window.innerHeight*(window.innerWidth<=860?0.70:0.52);}
  var curEl=null;
  function update(){
    var T=trigger(),last=null;
    allS.forEach(function(s){if(pos(s)<T){last=s;s.classList.add("seen");}});
    if(last!==curEl){if(curEl)curEl.classList.remove("cur");curEl=last;if(curEl)curEl.classList.add("cur");}
    parts.forEach(function(P){
      var idx=-1;P.ss.forEach(function(s,i){if(pos(s)<T)idx=i;});
      setStage(P.fig,idx<0?0:+P.ss[idx].dataset.st);
      P.pips.forEach(function(d,i){d.classList.toggle("on",i<=idx);d.classList.toggle("cur",i===idx);});
    });
    var h=document.documentElement.scrollHeight-window.innerHeight;
    document.getElementById("progress").style.width=(h>0?window.scrollY/h*100:0)+"%";
    document.getElementById("prev").disabled=!curEl;
    document.getElementById("next").disabled=curEl===allS[allS.length-1];
  }
  var ticking=false;
  function onScroll(){if(!ticking){ticking=true;requestAnimationFrame(function(){ticking=false;update();});}}
  window.addEventListener("scroll",onScroll,{passive:true});
  window.addEventListener("resize",onScroll);
  function goTo(s){if(!s){window.scrollTo({top:0});return;}window.scrollTo({top:Math.max(0,window.scrollY+pos(s)-(trigger()-3))});}
  function move(d){var i=curEl?allS.indexOf(curEl):-1,j=Math.max(-1,Math.min(allS.length-1,i+d));goTo(j<0?null:allS[j]);}
  document.getElementById("next").onclick=function(){move(1);};
  document.getElementById("prev").onclick=function(){move(-1);};
  document.getElementById("start").onclick=function(){goTo(allS[0]);};
  allS.forEach(function(s){s.addEventListener("click",function(){goTo(s);});});
  document.addEventListener("keydown",function(e){
    if(e.altKey||e.ctrlKey||e.metaKey)return;
    var k=e.key;
    if(k==="ArrowDown"||k==="ArrowRight"||k==="PageDown"||(k===" "&&!e.shiftKey)){e.preventDefault();move(1);}
    else if(k==="ArrowUp"||k==="ArrowLeft"||k==="PageUp"||(k===" "&&e.shiftKey)){e.preventDefault();move(-1);}
    else if(k==="Home"){e.preventDefault();goTo(null);}
    else if(k==="s"||k==="S"){toggleSpot();}
  });
  var KEY="mudin-case:";
  var store={get:function(k){try{return localStorage.getItem(KEY+k);}catch(e){return null;}},set:function(k,v){try{localStorage.setItem(KEY+k,v);}catch(e){}}};
  var spotBtn=document.getElementById("spot");
  function toggleSpot(force){var on=typeof force==="boolean"?force:!document.body.classList.contains("spot");document.body.classList.toggle("spot",on);spotBtn.setAttribute("aria-pressed",on);store.set("spot",on?"1":"0");}
  spotBtn.onclick=function(){toggleSpot();};
  if(store.get("spot")==="1")toggleSpot(true);
  var small=window.matchMedia("(max-width:860px)").matches;
  var k=parseFloat(store.get("k"))||(small?1.08:1);
  function setK(v){k=Math.max(.85,Math.min(1.8,Math.round(v*100)/100));document.documentElement.style.setProperty("--k",k);store.set("k",k);onScroll();}
  document.getElementById("aPlus").onclick=function(){setK(k+.1);};
  document.getElementById("aMinus").onclick=function(){setK(k-.1);};
  setK(k);
  update();
})();
</script>
