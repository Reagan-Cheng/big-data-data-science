<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Big Data Decision Lab</title>
<style>
  :root{
    --bg:#f6f8fb; --card:#ffffff; --ink:#15233b; --muted:#64748b;
    --line:#dbe3ef; --accent:#2563eb; --accent2:#0f766e;
    --good:#15803d; --bad:#b91c1c; --warn:#b45309; --soft:#eef4ff;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
  header{background:linear-gradient(135deg,#102a56,#1f4fa3);color:#fff;padding:24px 20px}
  .wrap{max-width:1120px;margin:0 auto}
  h1{margin:0 0 6px;font-size:clamp(28px,4vw,44px)}
  h2{margin-top:0}
  h3{margin-bottom:8px}
  .sub{opacity:.92}
  .toprow{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;flex-wrap:wrap}
  .topbar{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:18px}
  .pill{background:rgba(255,255,255,.12);padding:8px 12px;border-radius:999px;font-size:14px}
  .langswitch{display:flex;gap:8px;align-items:center;background:rgba(255,255,255,.12);padding:8px;border-radius:14px}
  .langswitch button{padding:8px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff}
  .langswitch button.active{background:#fff;color:#16305f}
  main{padding:24px 16px 64px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin:18px 0;box-shadow:0 8px 22px rgba(15,23,42,.05)}
  .stage{display:none}
  .stage.active{display:block}
  .progress{height:12px;background:#e7edf6;border-radius:999px;overflow:hidden;margin:18px 0}
  .progress > div{height:100%;width:0;background:linear-gradient(90deg,#2563eb,#0ea5e9);transition:width .35s}
  button{border:none;border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer}
  .primary{background:var(--accent);color:#fff}
  .secondary{background:#e8eef9;color:#16305f}
  .ghost{background:#fff;border:1px solid var(--line)}
  button:disabled{opacity:.5;cursor:not-allowed}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  @media(max-width:900px){.grid2,.grid3{grid-template-columns:1fr}.toprow{display:block}}
  .option{border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;background:#fff}
  .option:hover{border-color:#98b7ee}
  .option.selected{outline:3px solid #93b4ef;border-color:#2563eb;background:#f5f9ff}
  .option.disabled{opacity:.8}
  .question{padding:16px;border:1px solid var(--line);border-radius:14px;margin:14px 0;background:#fbfdff}
  .feedback{margin-top:10px;padding:10px 12px;border-radius:10px;display:none}
  .feedback.show{display:block}
  .good{background:#ecfdf3;color:#166534;border:1px solid #bbf7d0}
  .bad{background:#fff1f2;color:#9f1239;border:1px solid #fecdd3}
  .info{background:#eff6ff;color:#1e3a8a;border:1px solid #bfdbfe}
  table{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}
  th,td{border-bottom:1px solid var(--line);padding:10px;text-align:left;vertical-align:top}
  th{background:#f8fafc}
  select, input{padding:8px;border:1px solid var(--line);border-radius:8px;background:white}
  input[type="checkbox"]{margin-right:4px}
  .metric{padding:16px;border-radius:14px;background:#f8fafc;border:1px solid var(--line)}
  .metric .num{font-size:28px;font-weight:800}
  .tiny{font-size:13px;color:var(--muted)}
  .scorebox{display:flex;gap:12px;flex-wrap:wrap}
  .scorecard{flex:1;min-width:180px;background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:14px}
  .scorecard b{font-size:24px}
  .accentbox{border-left:5px solid var(--accent);background:#f5f9ff;padding:14px 16px;border-radius:10px}
  .scenario{border-left:5px solid #0f766e;background:#f0fdf9;padding:14px 16px;border-radius:10px;margin-bottom:14px}
  .center{text-align:center}
  .hiddenAnswer{color:#94a3b8;font-style:italic}
  .answerCell{font-weight:700}
  .logtable td,.logtable th{font-size:13px}
  .label{display:block;font-weight:700;margin-bottom:6px}
  footer{color:#64748b;text-align:center;padding:24px 0}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="toprow">
      <div>
        <h1 id="pageTitle">Big Data Decision Lab</h1>
        <div class="sub" id="pageSub">From raw data to business decision — an interactive 60-minute classroom activity</div>
      </div>
      <div class="langswitch">
        <span id="langLabel" style="font-weight:700">Language</span>
        <button id="btnEN" class="active" onclick="setLanguage('en')">English</button>
        <button id="btnZH" onclick="setLanguage('zh')">繁體中文</button>
      </div>
    </div>
    <div class="topbar">
      <div class="pill" id="pill1">Stage 1: 3V</div>
      <div class="pill" id="pill2">Stage 2: Data Prep</div>
      <div class="pill" id="pill3">Stage 3: Recommendation</div>
      <div class="pill" id="pill4">Stage 4: Review Mining</div>
      <div class="pill" id="pill5">Stage 5: Campaign Decision</div>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="card">
    <div class="grid2">
      <div>
        <label class="label" id="studentLabel">Group / Student Name</label>
        <input id="studentName" placeholder="e.g., Group 3" style="width:100%;margin-top:6px"/>
      </div>
      <div>
        <label class="label" id="useLabel">How to use this lab</label>
        <div class="tiny" id="useText" style="margin-top:6px"></div>
      </div>
    </div>
    <div class="progress"><div id="progressBar"></div></div>
    <div class="scorebox">
      <div class="scorecard"><span class="tiny" id="scoreLabel">Current score</span><br/><b id="scoreNow">0</b> / 40</div>
      <div class="scorecard"><span class="tiny" id="stageLabel">Current stage</span><br/><b id="stageNow">1 / 5</b></div>
    </div>
  </div>

  <section id="stage1" class="card stage active">
    <h2 id="s1Title"></h2>
    <p id="s1Intro"></p>
    <div id="vQuestions"></div>
    <button class="primary" id="s1SubmitBtn" onclick="checkV()"></button>
    <button class="secondary" id="to2" onclick="goStage(2)" disabled></button>
  </section>

  <section id="stage2" class="card stage">
    <h2 id="s2Title"></h2>
    <div class="scenario" id="s2Scenario"></div>
    <p id="s2Task"></p>
    <div class="accentbox" id="s2Meaning"></div>
    <table>
      <thead><tr id="cleanHead"></tr></thead>
      <tbody id="cleanTable"></tbody>
    </table>
    <div style="margin-top:16px">
      <button class="primary" id="s2SubmitBtn" onclick="checkCleaning()"></button>
      <button class="secondary" id="to3" onclick="goStage(3)" disabled></button>
    </div>
    <div id="cleanSummary" class="feedback info"></div>
  </section>

  <section id="stage3" class="card stage">
    <h2 id="s3Title"></h2>
    <div class="scenario" id="s3Scenario"></div>
    <div class="grid2">
      <div class="metric">
        <h3 id="purchaseTitle"></h3>
        <table class="logtable">
          <thead><tr id="purchaseHead"></tr></thead>
          <tbody id="purchaseBody"></tbody>
        </table>
      </div>
      <div class="metric">
        <h3 id="browseTitle"></h3>
        <table class="logtable">
          <thead><tr id="browseHead"></tr></thead>
          <tbody id="browseBody"></tbody>
        </table>
      </div>
    </div>
    <div class="question">
      <b id="recPrompt"></b>
      <div id="recOptions" style="margin-top:12px"></div>
    </div>
    <div style="margin-top:16px">
      <button class="primary" id="s3RunBtn" onclick="revealAlgorithm()"></button>
    </div>
    <div id="algoResult" class="feedback info"></div>
    <div id="contextReveal" style="display:none;margin-top:18px">
      <div class="accentbox" id="contextBox"></div>
      <p><b id="contextQuestion"></b></p>
      <div id="contextOptions" class="grid2"></div>
      <button class="primary" style="margin-top:14px" id="s3SubmitBtn" onclick="checkContext()"></button>
      <button class="secondary" id="to4" onclick="goStage(4)" disabled></button>
      <div id="contextFeedback" class="feedback info"></div>
    </div>
  </section>

  <section id="stage4" class="card stage">
    <h2 id="s4Title"></h2>
    <div class="scenario" id="s4Scenario"></div>
    <p id="s4Intro"></p>
    <div id="sentimentList"></div>
    <button class="primary" id="s4RunBtn" onclick="checkSentiment()"></button>
    <button class="secondary" id="to5" onclick="goStage(5)" disabled></button>
    <div id="sentimentSummary" class="feedback info"></div>
  </section>

  <section id="stage5" class="card stage">
    <h2 id="s5Title"></h2>
    <div class="scenario" id="s5Scenario"></div>
    <div class="accentbox" id="s5Reminder"></div>

    <div class="question">
      <b id="decisionPrompt"></b>
      <div id="decisionOptions" style="margin-top:12px"></div>
      <div id="decisionFeedback" class="feedback info"></div>
    </div>

    <div class="question">
      <b id="modPrompt"></b>
      <div class="tiny" id="modHint" style="margin-top:6px"></div>
      <div id="modOptions" style="margin-top:12px"></div>
      <div id="modFeedback" class="feedback info"></div>
    </div>

    <button class="primary" id="s5SubmitBtn" onclick="checkDecision()"></button>
    <div id="finalAdvance" style="display:none;margin-top:16px">
      <button class="secondary" id="toFinalBtn" onclick="enterFinalResults()"></button>
      <div class="tiny" id="finalLockNote" style="margin-top:8px"></div>
    </div>
  </section>

  <section id="finalStage" class="card stage">
    <h2 id="finalTitle"></h2>
    <div class="center">
      <div class="tiny" id="finalScoreLabel"></div>
      <div style="font-size:64px;font-weight:900" id="finalScore">0 / 40</div>
      <div id="performanceText"></div>
    </div>
    <hr style="border:0;border-top:1px solid var(--line);margin:24px 0"/>
    <h3 id="takeawayTitle"></h3>
    <ol id="takeawayList"></ol>
    <div class="accentbox" id="reflectionBox"></div>
    <div class="feedback show info" id="finalPageLock" style="margin-top:16px"></div>
    <div style="margin-top:16px">
<button class="secondary" id="restartBtn" onclick="resetLab()"></button>
    </div>
  </section>

  <div id="bottomNav" class="wrap" style="margin-top:8px;display:none">
    <button class="ghost" id="prevStageBtn" onclick="goPreviousStage()"></button>
    <span class="tiny" id="prevStageNote" style="margin-left:10px"></span>
  </div>

</main>

<footer id="footerText"></footer>

<script>
const i18n = {
  en: {
    meta:{
      pageTitle:"Big Data Decision Lab",
      pageSub:"From raw data to business decision — an interactive 60-minute classroom activity",
      langLabel:"Language",
      pills:["Stage 1: 3V","Stage 2: Data Prep","Stage 3: Recommendation","Stage 4: Review Mining","Stage 5: Campaign Decision"],
      studentLabel:"Group / Student Name",
      studentPlaceholder:"e.g., Group 3",
      useLabel:"How to use this lab",
      useText:"Stage 1 is a quick concept check. Stages 2–5 follow one connected storyline: <b>you are a data analyst supporting a wearable-device marketing campaign</b>.",
      scoreLabel:"Current score",
      stageLabel:"Current stage",
      footer:"Big Data Decision Lab — bilingual version",
      prevStage:"← Previous Stage",
      prevStageNote:"You can review completed stages. Previously submitted scores remain locked."
    },
    common:{
      submit:"Submit",
      next2:"Next: Data Preparation",
      next3:"Next: Recommendation Task",
      next4:"Next: Review Mining",
      next5:"Next: Campaign Decision",
      hidden:"Hidden until submission",
      choose:"Choose...",
      keep:"Keep Data",
      delete:"Delete Data",
      handle:"Handle with data",
      yes:"Yes",
      no:"No",
      positive:"Positive",
      neutral:"Neutral",
      negative:"Negative",
      pleaseChoose:"Please choose an option first."
    },
    stage1:{
      title:"Stage 1 — Big Data 3V Quick Challenge",
      intro:"For each scenario, choose the <b>single best answer</b> among Volume, Velocity, and Variety.",
      submit:"Submit Stage 1",
      questions:[
        {text:"A retailer stores more than 500 million transaction records for analysis.", ans:"volume"},
        {text:"A factory receives new sensor readings every 0.1 second and must process them continuously.", ans:"velocity"},
        {text:"A customer-analysis system combines transaction records, text reviews, product images, and GPS locations.", ans:"variety"}
      ],
      optionLabels:{volume:"Volume",velocity:"Velocity",variety:"Variety"},
      correct:"Correct.",
      suggested:"Suggested answer: <b>{ans}</b>"
    },
    stage2:{
      title:"Stage 2 — Data Preparation for the Weekend Campaign",
      scenario:"<b>Scenario:</b> You are a junior analyst at <b>MoveFit</b>, a Taiwan-based e-commerce platform selling sports and wearable products. On Friday afternoon, the marketing team plans a <b>weekend personalized campaign</b> for wearable-device shoppers. Before any model is run, you need to clean a small batch of customer data that has just been extracted from the CRM system.",
      task:"<b>Your task:</b> Review each record and decide how the data should be treated before the campaign model uses it.",
      meaning:"<b>What do the three actions mean?</b><br/><b>Keep Data</b> = the record is usable as it is.<br/><b>Delete Data</b> = the record should be removed because it is clearly duplicated or unusable.<br/><b>Handle with data</b> = do not delete immediately; the record needs checking, fixing, flagging, or special treatment before analysis.",
      head:["Record ID","Customer Type","Age","Item","Purchase (NT$)","Rating (1–5)","Correct Answer","Your Action"],
      rows:[
        {record:"R001",ctype:"Retail",age:"22",item:"Running shoes",purchase:"1,280",rating:"5",answer:"keep",why:"The record appears internally consistent and usable."},
        {record:"R002",ctype:"Retail",age:"24",item:"Smart watch band",purchase:"980",rating:"4",answer:"keep",why:"Nothing in the record clearly indicates an error."},
        {record:"R003",ctype:"Retail",age:"240",item:"Heart-rate strap",purchase:"1,100",rating:"5",answer:"handle",why:"The age is implausible and should be checked or corrected, rather than blindly used."},
        {record:"R004",ctype:"Corporate",age:"—",item:"20 wearable starter kits",purchase:"89,000",rating:"1",answer:"handle",why:"This could be a legitimate corporate purchase, but the missing age and unusual transaction profile require special handling."},
        {record:"R004",ctype:"Corporate",age:"—",item:"20 wearable starter kits",purchase:"89,000",rating:"1",answer:"delete",why:"This row is an exact duplicate of the previous record and should be removed."},
        {record:"R006",ctype:"Retail",age:"31",item:"GPS running watch",purchase:"750",rating:"9",answer:"handle",why:"The rating violates the 1–5 scale and must be corrected, recoded, or excluded from rating analysis."}
      ],
      submit:"Submit Stage 2",
      noAnswer:"No answer. {why}",
      after:"{mark} {why}",
      summary:"You are seeing why data preparation matters. Not all “strange” records should be deleted; some should be <b>handled carefully</b> because they may represent a real but special case."
    },
    stage3:{
      title:"Stage 3 — Recommendation for One Focal Member",
      scenario:"<b>Story continuation:</b> The campaign team now asks you to inspect one focal member, <b>P017</b>. The system wants to recommend a wearable-related product to this member during the weekend campaign. You will first make a human judgment, then compare it with a baseline algorithm.",
      purchaseTitle:"Purchase history — Member P017",
      browseTitle:"Recent browsing log — last 7 days",
      purchaseHead:["Date","Category","Item","Amount"],
      browseHead:["Date-Time","Action","Page / Content"],
      purchases:[
        ["2026-06-02","Running","Running shoes","NT$2,380"],
        ["2026-06-02","Running","Sports socks","NT$290"],
        ["2026-06-18","Nutrition","Protein bar bundle","NT$450"],
        ["2026-07-03","Accessory","Running cap","NT$520"],
        ["2026-07-25","Audio","Wireless earphones","NT$1,990"],
        ["2026-08-11","Wearable accessory","Sports watch charging cable","NT$390"],
        ["2026-08-29","Nutrition","Energy gel set","NT$360"]
      ],
      browses:[
        ["2026-09-10 20:12","View","Smart Watch Pro product page"],
        ["2026-09-10 20:15","Compare","Smart Watch Pro vs. Smart Watch Lite"],
        ["2026-09-10 20:19","View","Battery-life FAQ for Smart Watch Pro"],
        ["2026-09-11 09:20","View","GPS running watch reviews"],
        ["2026-09-11 09:33","Add to cart","Smart Watch Pro"],
        ["2026-09-11 09:40","Remove from cart","Smart Watch Pro"],
        ["2026-09-11 22:05","View","Wireless earphones product page"]
      ],
      prompt:"Your decision: Based on the records above, which product would you recommend to Member P017?",
      recOptions:["Smart Watch Pro","Wireless Earphones","Running Shoes","Nutrition Bundle"],
      run:"Run Baseline Algorithm",
      algo:`<b>How the baseline algorithm works</b><br/>
      It estimates an <b>intent score</b> for each candidate product using:
      <br/>• <b>60%</b> recent browsing intensity (views, comparisons, add-to-cart)
      <br/>• <b>25%</b> category similarity to past purchases
      <br/>• <b>15%</b> recent related purchase signal
      <br/><br/>
      <b>Algorithm output</b><br/>
      Smart Watch Pro = <b>78</b><br/>
      Wireless Earphones = 41<br/>
      Running Shoes = 36<br/>
      Nutrition Bundle = 19
      <br/><br/>
      {choice}
      The model favors <b>Smart Watch Pro</b> because P017 repeatedly viewed watch pages, added one to cart, and previously bought a sports-watch charging cable (which the model interprets as category affinity).`,
      yourChoice:"Your choice: <b>{val}</b>.",
      contextBox:"<b>New information from the same member:</b><br/>In an open-ended survey response, P017 wrote: <i>“I already use a sports watch. I was comparing models because my colleague asked me for advice.”</i>",
      contextQuestion:"Should the recommendation change after reading this text?",
      contextOptionYes:"The text changes how we interpret the behavior log.",
      contextOptionNo:"The repeated page views are still enough to recommend a smart watch.",
      submit:"Submit Stage 3",
      contextCorrect:"Correct. The text suggests the browsing behavior may not reflect P017’s own buying intent. This is a practical example of why <b>behavioral data alone can mislead the model</b>.",
      contextWrong:"The stronger interpretation is <b>Yes</b>. The new text changes the meaning of the behavioral pattern and should affect the recommendation."
    },
    stage4:{
      title:"Stage 4 — Review Mining for the Same Product Category",
      scenario:"<b>Story continuation:</b> Because the baseline model initially favored the <b>smart watch</b> category, the product team asks one more question: <b>What are similar customers saying about this product line?</b> You now review open-text comments from recent shoppers and classify their sentiment.",
      intro:"Classify each review as <b>Positive</b>, <b>Neutral</b>, or <b>Negative</b>. Then compare your judgment with a simple keyword-based model.",
      reviews:[
        {t:"The fitness tracking is accurate, but the battery drains too fast during long runs.",a:"negative"},
        {t:"Setup was easy and the watch looks great. I use it almost every day.",a:"positive"},
        {t:"The watch is okay overall, but I wish the strap were more comfortable.",a:"neutral"},
        {t:"Too expensive for what it offers. I returned it after three days.",a:"negative"},
        {t:"I like the display and step counter. The app sync could be smoother.",a:"neutral"},
        {t:"Excellent for beginner runners. The heart-rate function works well.",a:"positive"},
        {t:"Notifications are useful, but the screen is hard to read outdoors.",a:"negative"},
        {t:"I expected a better battery life and more stable GPS performance.",a:"negative"}
      ],
      run:"Run Sentiment Model",
      model:"Simple model: <b>{val}</b>",
      accepted:"Human classification accepted.",
      suggested:"Suggested human label: <b>{val}</b>.",
      summary:"Review summary for the smart-watch line: <b>{pos} positive</b>, <b>{neu} neutral</b>, and <b>{neg} negative</b>. The open-text comments reveal recurring concerns about <b>battery life, comfort, readability, and price</b>."
    },
    stage5:{
      title:"Stage 5 — Final Campaign Decision",
      scenario:"<b>Story continuation:</b> It is now Friday evening. You have cleaned the campaign file, examined Member P017, and reviewed open-text comments for the smart-watch category. The marketing manager must decide how to execute the wearable-device marketing campaign for the <b>active runner segment</b>.",
      reminder:"<b>Decision basis:</b> For both questions below, return to the data and analysis results from the previous stages. This page intentionally does not repeat the evidence summary.",
      prompt:"Question 1. Based on the results shown by the data, what should you do next?",
      options:[
        {v:"A",txt:"Immediately send a Smart Watch Pro promotion to all active runners because P017 repeatedly viewed the product and added it to the cart."},
        {v:"B",txt:"First clean and properly handle the CRM records, then refine the recommendation targeting by checking whether smart-watch browsing reflects the customer’s own purchase intent before sending the offer."},
        {v:"C",txt:"Delete every record with missing or unusual values, and use only completely clean records for the campaign."},
        {v:"D",txt:"Stop using browsing behavior and make recommendations only from customers’ past purchase records."}
      ],
      modPrompt:"Question 2. If the product itself is to be modified, which areas should be prioritized?",
      modHint:"Select all items that are supported by the data from the earlier stages.",
      modOptions:[
        {v:"A",txt:"Improve battery life"},
        {v:"B",txt:"Improve strap comfort"},
        {v:"C",txt:"Improve outdoor screen readability"},
        {v:"D",txt:"Improve GPS stability"},
        {v:"E",txt:"Improve app synchronization"},
        {v:"F",txt:"Add more social-media sharing features"},
        {v:"G",txt:"Redesign the logo and packaging"}
      ],
      correctMods:["A","B","C","D","E"],
      submit:"Submit Stage 5",
      best:"Best answer: <b>B</b>. Stage 2 shows that the CRM data must be cleaned and handled carefully before analysis, while Stage 3 shows that browsing behavior does not always equal the customer’s own purchase intent. The next step is therefore to improve data quality and refine targeting before sending the offer.",
      mid:"This option responds to part of the evidence, but it either overreacts to data-quality problems or discards useful behavioral data. The stronger decision is to clean the data and refine how browsing behavior is interpreted.",
      bad:"This choice relies too heavily on one type of evidence and does not adequately integrate the data-quality issue from Stage 2 with the intent-interpretation issue from Stage 3.",
      modCorrect:"Correct. The earlier reviews support improvements to <b>battery life, strap comfort, outdoor screen readability, GPS stability, and app synchronization</b>.",
      modPartial:"Review the earlier customer comments again. The data-supported product modifications are: <b>battery life, strap comfort, outdoor screen readability, GPS stability, and app synchronization</b>. The other options are not supported by the available data.",
      answerBoth:"Please answer both questions before submitting.",
      toFinal:"Next: View Final Results",
      finalLockNote:"After entering the final-results page, you cannot return to earlier stages."
    },
    final:{
      title:"Lab Complete",
      scoreLabel:"Final score",
      takeTitle:"Five takeaways",
      takeaways:[
        "<b>Volume, velocity, and variety</b> describe different kinds of data challenge.",
        "Before any model runs, data often needs <b>cleaning, checking, and special handling</b>.",
        "A recommendation algorithm can be useful, but its assumptions should be understood.",
        "<b>Unstructured text</b> can change how we interpret numerical or behavioral data.",
        "Business value comes from connecting <b>data quality + analysis + context + action</b>."
      ],
      reflection:"<b>Final reflection:</b> In this storyline, which stage changed the decision the most — data cleaning, recommendation logic, text feedback, or campaign judgment?",
      teacherBtn:"Teacher Guide",
      restartBtn:"Restart Lab",
      teacherTitle:"Teacher Guide — 60-minute facilitation plan",
      teacherHead:["Time","Activity","Teaching point","Suggested prompt"],
      teacherRows:[
        ["0–8 min","3V Quick Challenge","Students distinguish volume, velocity, and variety.","“Which V creates the core difficulty here?”"],
        ["8–22 min","Stage 2: Data Preparation","Data is not automatically usable.","“When is a strange value a problem, and when is it just a special case?”"],
        ["22–37 min","Stage 3: Recommendation","Show how a baseline model converts behavior into a score.","“What assumption is the model making about repeated page views?”"],
        ["37–50 min","Stage 4: Review Mining","Text data helps explain intent, risk, and friction.","“What are the most common themes the reviews reveal?”"],
        ["50–58 min","Stage 5: Campaign Decision","Data becomes valuable only when connected to action.","“What should management do differently, not just what product to choose?”"],
        ["58–60 min","Debrief","Reconnect the pipeline.","“Collect → Clean → Analyze → Interpret → Decide.”"]
      ],
      algoTitle:"How the baseline algorithm works",
      algoText:`Intent Score = 0.60 × recent browsing intensity

  if(key==='delete') return c.delete;
  if(key==='handle') return c.handle;
  if(key==='positive') return c.positive;
  if(key==='neutral') return c.neutral;
  if(key==='negative') return c.negative;
  return key;
}
function setLanguage(lang){
  currentLang = lang;
  document.documentElement.lang = lang==='zh' ? 'zh-Hant' : 'en';
  document.getElementById('btnEN').classList.toggle('active', lang==='en');
  document.getElementById('btnZH').classList.toggle('active', lang==='zh');
  renderAll();
}
function updateScore(){
  totalScore = Object.values(stageScores).reduce((a,b)=>a+b,0);
  setText('scoreNow', totalScore);
}
function updateProgress(){
  setText('stageNow', currentStage===6 ? (currentLang==='zh' ? '完成' : 'Complete') : `${currentStage} / 5`);
  document.getElementById('progressBar').style.width = `${currentStage===6 ? 100 : ((currentStage-1)/5*100)}%`;
}
function goStage(n){
  currentStage = n;
  document.querySelectorAll('.stage').forEach(s=>s.classList.remove('active'));
  const target = document.getElementById(n===6 ? 'finalStage' : `stage${n}`);
  if(target) target.classList.add('active');
  updateProgress();
  updateBottomNav();
  window.scrollTo({top:0,behavior:'smooth'});
}
function goPreviousStage(){
  if(currentStage>1 && currentStage<6) goStage(currentStage-1);
}
function enterFinalResults(){
  if(submitted[5]){
    updateScore();
    renderFinal();
    goStage(6);
  }
}
function updateBottomNav(){
  const nav=document.getElementById('bottomNav');
  if(!nav) return;
  nav.style.display = (currentStage>1 && currentStage<6) ? 'block' : 'none';
  setText('prevStageBtn', L().meta.prevStage);
  setText('prevStageNote', L().meta.prevStageNote);
}
function selectV(i,opt){
  state.vSelections[i] = opt;
}
function selectClean(i,val){ state.cleanSelections[i]=val; }
function selectRec(val){ state.recChoice=val; renderRecOptions(); }
function selectContext(val){ state.contextChoice=val; renderContextOptions(); }
function selectSent(i,val){ state.sentSelections[i]=val; }
function selectDecision(val){ state.decisionChoice=val; renderDecisionOptions(); }
function toggleModification(val){
  if(state.modChoices.includes(val)){
    state.modChoices = state.modChoices.filter(x=>x!==val);
  }else{
    state.modChoices.push(val);
  }
  renderModificationOptions();
}
function resetLab(){ location.reload(); }

  setText('stageLabel', T.stageLabel);

function renderStage1(){
  const T=L().stage1;
  setText('s1Title', T.title);
  setText('s1Intro', T.intro);
  setText('s1SubmitBtn', T.submit);
  setText('to2', L().common.next2);
  document.getElementById('to2').disabled = !submitted[1];
  const root=document.getElementById('vQuestions');
  root.innerHTML='';
  T.questions.forEach((q,i)=>{
    const div=document.createElement('div');
    div.className='question';
    const opts = ['volume','velocity','variety'].map(v=>{
      const checked = state.vSelections[i]===v ? 'checked' : '';
      const disabled = submitted[1] ? 'disabled' : '';
      return `<label style="margin-right:16px"><input type="radio" name="v${i}" ${checked} ${disabled} onchange="selectV(${i},'${v}')"> ${T.optionLabels[v]}</label>`;
    }).join('');

      const ok=state.vSelections[i]===q.ans;
      const msg= ok ? T.correct : fmt(T.suggested,{ans:T.optionLabels[q.ans]});
      fb=`<div class="feedback show ${ok?'good':'bad'}">${msg}</div>`;

function renderStage2(){
  const T=L().stage2, C=L().common;
  setText('s2Title', T.title);
  setHTML('s2Scenario', T.scenario);
  setHTML('s2Task', T.task);
  setHTML('s2Meaning', T.meaning);
  document.getElementById('cleanHead').innerHTML = T.head.map(h=>`<th>${h}</th>`).join('');
  const tb=document.getElementById('cleanTable');
  tb.innerHTML='';
  T.rows.forEach((r,i)=>{
    const chosen = state.cleanSelections[i];
    const options = [['keep',C.keep],['delete',C.delete],['handle',C.handle]].map(([v,label])=>`<option value="${v}" ${chosen===v?'selected':''}>${label}</option>`).join('');
    let ansDisplay = `<span class="hiddenAnswer">${C.hidden}</span>`;
    let note = '';
    if(submitted[2]){
      ansDisplay = displayLabelForKey(r.answer);
      const ok = chosen===r.answer;
      note = chosen
        ? `<div class="tiny" style="color:${ok?'#166534':'#9f1239'}">${fmt(T.after,{mark:ok?'✓':'✗',why:r.why})}</div>`
        : `<div class="tiny" style="color:#9f1239">${fmt(T.noAnswer,{why:r.why})}</div>`;
    }
    const tr=document.createElement('tr');
    tr.innerHTML=`<td>${r.record}</td><td>${r.ctype}</td><td>${r.age}</td><td>${r.item}</td><td>${r.purchase}</td><td>${r.rating}</td>
    <td class="answerCell">${ansDisplay}</td>
    <td><select ${submitted[2]?'disabled':''} onchange="selectClean(${i},this.value)"><option value="">${C.choose}</option>${options}</select>${note}</td>`;
    tb.appendChild(tr);
  });
  setText('s2SubmitBtn', T.submit);
  setText('to3', C.next3);
  document.getElementById('to3').disabled = !submitted[2];
  const box=document.getElementById('cleanSummary');
  if(submitted[2]){ box.className='feedback show info'; box.innerHTML=T.summary; }
  else { box.className='feedback info'; box.innerHTML=''; }
}

  const T=L().stage3;

function renderStage4(){
  const T=L().stage4, C=L().common;
  setText('s4Title', T.title);
  setHTML('s4Scenario', T.scenario);
  setHTML('s4Intro', T.intro);
  const root=document.getElementById('sentimentList');
  root.innerHTML='';
  T.reviews.forEach((x,i)=>{
    const sel=state.sentSelections[i];
    const options=[['positive',C.positive],['neutral',C.neutral],['negative',C.negative]]
      .map(([v,label])=>`<option value="${v}" ${sel===v?'selected':''}>${label}</option>`).join('');
    let model='', fb='';
    if(submitted[4]){
      const modelVal = displayLabelForKey(simpleModel(x.t));
      model = fmt(T.model,{val:modelVal});
      const ok = sel===x.a;
      fb = `<div class="feedback show ${ok?'good':'bad'}">${ok ? T.accepted : fmt(T.suggested,{val:displayLabelForKey(x.a)})}</div>`;
    }
    const div=document.createElement('div');
    div.className='question';
    div.innerHTML=`<b>${i+1}. “${x.t}”</b><div style="margin-top:10px">
      <select ${submitted[4]?'disabled':''} onchange="selectSent(${i},this.value)">
        <option value="">${C.choose}</option>${options}
      </select>
      <span class="tiny" style="margin-left:10px">${model}</span>
      </div>${fb}`;
    root.appendChild(div);
  });
  setText('s4RunBtn', T.run);
  setText('to5', C.next5);
  document.getElementById('to5').disabled = !submitted[4];
  const box=document.getElementById('sentimentSummary');
  if(submitted[4]){
    const ans = T.reviews.map(r=>r.a);
    const pos = ans.filter(x=>x==='positive').length;
    const neu = ans.filter(x=>x==='neutral').length;
    const neg = ans.filter(x=>x==='negative').length;
    box.className='feedback show info';
    box.innerHTML = fmt(T.summary,{pos,neu,neg});
  }else{
    box.className='feedback info';
    box.innerHTML='';
  }
}

function renderStage5(){
  const T=L().stage5;
  setText('s5Title', T.title);
  setHTML('s5Scenario', T.scenario);
  setHTML('s5Reminder', T.reminder);
  setText('decisionPrompt', T.prompt);
  renderDecisionOptions();
  setText('modPrompt', T.modPrompt);
  setText('modHint', T.modHint);
  renderModificationOptions();
  setText('s5SubmitBtn', T.submit);
  const advance=document.getElementById('finalAdvance');
  setText('toFinalBtn', T.toFinal);
  setText('finalLockNote', T.finalLockNote);
  advance.style.display = submitted[5] ? 'block' : 'none';
  document.getElementById('s5SubmitBtn').style.display = submitted[5] ? 'none' : 'inline-block';

  const f=document.getElementById('decisionFeedback');
  const mf=document.getElementById('modFeedback');

  if(submitted[5]){
    f.className='feedback show ' + (state.decisionChoice==='B'?'good': (state.decisionChoice==='C' || state.decisionChoice==='D')?'info':'bad');
    f.innerHTML = state.decisionChoice==='B' ? T.best : (state.decisionChoice==='C' || state.decisionChoice==='D') ? T.mid : T.bad;

    const correct=[...T.correctMods].sort();
    const chosen=[...state.modChoices].sort();
    const exact = JSON.stringify(correct)===JSON.stringify(chosen);
    mf.className='feedback show ' + (exact ? 'good':'bad');
    mf.innerHTML = exact ? T.modCorrect : T.modPartial;
  } else {
    f.className='feedback info';
    f.innerHTML='';
    mf.className='feedback info';
    mf.innerHTML='';
  }
}

  renderStage4();
  renderStage5();

function checkV(){
  if(submitted[1]) return;
  let s=0;
  L().stage1.questions.forEach((q,i)=>{
    if(state.vSelections[i]===q.ans) s+=2;
  });
  stageScores[1]=s; submitted[1]=true; updateScore(); renderStage1();
}
function checkCleaning(){
  if(submitted[2]) return;
  let s=0;
  L().stage2.rows.forEach((r,i)=>{ if(state.cleanSelections[i]===r.answer) s+=2; });
  stageScores[2]=s; submitted[2]=true; updateScore(); renderStage2();
}
function revealAlgorithm(){
  if(!submitted['3a']){
    if(state.recChoice===L().stage3.recOptions[0]) stageScores[3]+=2;
    submitted['3a']=true;
    updateScore();
  }
  renderStage3();
}
function checkContext(){
  if(submitted['3b']) return;
  if(state.contextChoice==='yes') stageScores[3]+=2;
  submitted['3b']=true; submitted[3]=true; updateScore(); renderStage3();
}
function simpleModel(text){
  const t=text.toLowerCase();
  const pos=["easy","great","almost every day","excellent","works well","like the display","簡單","很好看","幾乎每天","適合","不錯","喜歡顯示"];
  const neg=["drains too fast","too expensive","returned","hard to read","better battery life","more stable gps","耗電太快","太貴","退貨","不太容易閱讀","更好的電池續航","更穩定的 gps"];
  let ps=pos.filter(w=>t.includes(w)).length, ns=neg.filter(w=>t.includes(w)).length;
  if(ps>ns) return "positive";
  if(ns>ps) return "negative";
  return "neutral";
}
function checkSentiment(){
  if(submitted[4]) return;
  let s=0;
  L().stage4.reviews.forEach((x,i)=>{ if(state.sentSelections[i]===x.a) s+=1; });
  stageScores[4]=s; submitted[4]=true; updateScore(); renderStage4();
}
function checkDecision(){
  if(submitted[5]) return;
  const T=L().stage5;
  if(!state.decisionChoice || state.modChoices.length===0){
    const f=document.getElementById('decisionFeedback');
    f.className='feedback show info';
    f.innerHTML=T.answerBoth;
    const mf=document.getElementById('modFeedback');
    mf.className='feedback show info';
    mf.innerHTML=T.answerBoth;
    return;
  }

  let q1=0;
  if(state.decisionChoice==='B') q1=5;
  else if(state.decisionChoice==='C' || state.decisionChoice==='D') q1=2;
  else q1=1;

  let q2=0;
  const correct = new Set(T.correctMods);
  state.modChoices.forEach(v=>{
    q2 += correct.has(v) ? 1 : -1;
  });
  q2 = Math.max(0, Math.min(5, q2));

  stageScores[5]=q1+q2;
  submitted[5]=true;
  updateScore();
  renderStage5();
  updateBottomNav();
}

document.getElementById('studentName').addEventListener('input', e => state.studentName = e.target.value);

setLanguage('en');
</script>
