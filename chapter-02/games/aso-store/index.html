<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">

<title>店長的一天：RFM 足測鞋店 | Store Manager for a Day</title>

<!-- ============================================================
     店長的一天：RFM 足測鞋店 · Store Manager for a Day  (v2)
     大數據與資料科學 第二章（講義 p.34–37：阿瘦個案與 RFM）

     One file, no external resources. All words live in T below.
     ============================================================ -->
<style>
:root{
  --bg:#f3f1ec; --panel:#fff; --ink:#1b2433; --ink2:#4d5869; --ink3:#6f7988; --line:#dcd8cf; --line2:#ebe8e1;
  --navy:#102a56; --blue:#1f5fb8; --blue-wash:#e8f0fc;
  --good:#127a3d; --good-wash:#e6f5ec; --bad:#b4232c; --bad-wash:#fcebeb; --warn:#a15c00; --warn-wash:#fff4e0;
  --floor:#ead9bf; --wall:#cdb894;
  --c1:#e6effc; --c2:#c4d9f6; --c3:#86b6ef; --c4:#3f84d6; --c5:#184f95;
  --tap:48px;
}
*{box-sizing:border-box}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",Arial,sans-serif;line-height:1.6;font-size:18px;overscroll-behavior:none}
html[lang="zh-Hant"] body{line-height:1.7}
button{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
:focus-visible{outline:3px solid #f2b705;outline-offset:2px;border-radius:6px}
.hide{display:none!important}

/* ---------- top bar ---------- */
.top{position:fixed;top:0;left:0;right:0;z-index:40;background:var(--navy);color:#fff;height:calc(52px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 12px 0;display:flex;align-items:center;gap:10px}
.top .name{font-weight:800;font-size:17px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .clock{font-variant-numeric:tabular-nums;font-weight:800;background:rgba(255,255,255,.16);border-radius:8px;padding:2px 9px;font-size:17px}
.lang{display:flex;border:1px solid rgba(255,255,255,.5);border-radius:999px;overflow:hidden;flex-shrink:0}
.lang button{border:0;background:transparent;color:#fff;padding:4px 12px;font-size:15px;cursor:pointer;min-height:36px}
.lang button[aria-pressed="true"]{background:#fff;color:var(--navy);font-weight:700}

/* ---------- pages ---------- */
.page{max-width:880px;margin:0 auto;padding:calc(70px + env(safe-area-inset-top)) 16px 44px}
.kicker{font-size:15px;font-weight:800;color:var(--blue)}
.title{font-size:clamp(30px,7vw,44px);font-weight:900;margin:4px 0 10px;line-height:1.15}
.lead{color:var(--ink2);max-width:62ch;font-size:19px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
.stack>*+*{margin-top:12px}
.small{font-size:15px;color:var(--ink3)}
.btn{border:0;border-radius:12px;background:var(--blue);color:#fff;font-weight:800;padding:12px 22px;min-height:var(--tap);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;font-size:18px}
.btn:hover{background:var(--navy)}
.btn.ghost{background:transparent;color:var(--blue);border:2px solid var(--blue)}
.btn.ghost:hover{background:var(--blue-wash)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hero{display:grid;grid-template-columns:minmax(0,1fr) 180px;gap:18px;align-items:center}
.hero svg{width:100%;max-width:180px;justify-self:center}
.slide h2{font-size:24px;margin-bottom:12px;line-height:1.3}
.goals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.goal{border-radius:14px;padding:14px;background:var(--blue-wash)}
.goal .gk{font-size:15px;font-weight:800;color:var(--blue)}
.goal b{display:block;font-size:24px;font-weight:900;color:var(--navy);line-height:1.3;margin:2px 0 6px}
.goal p{font-size:17px;color:var(--ink2)}
.flow{margin:0;padding:0;list-style:none;display:grid;gap:8px;counter-reset:f}
.flow li{display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px;align-items:start;background:var(--bg);border-radius:12px;padding:10px 12px;counter-increment:f}
.flow li::before{content:counter(f);display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--blue);color:#fff;font-weight:900}
.flow b{display:block}
.flow span{color:var(--ink2);font-size:17px}
.ul{margin:0;padding-left:1.2em}
.ul li{margin:6px 0}
.satdemo{display:flex;gap:14px;align-items:center;background:var(--bg);border-radius:12px;padding:12px;margin-bottom:12px;flex-wrap:wrap}
.satdemo .sat{position:static;transform:none;width:120px;height:14px}
.rfm3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.rfm3 div{border-radius:12px;padding:12px;color:#fff}
.rfm3 b{display:block;font-size:28px;font-weight:900;line-height:1}
.rfm3 span{font-size:16px}
.bigmap{display:grid;grid-template-columns:auto repeat(3,minmax(0,1fr));gap:4px;margin-top:12px;font-size:15px;max-width:520px}
.bigmap .cell{border-radius:8px;padding:8px 4px;text-align:center;font-weight:700;min-height:52px;display:grid;place-items:center;line-height:1.25}
.bigmap .cell.loyalc{outline:3px solid #f2b705;outline-offset:-3px}
.bigmap .ax{font-size:13px;color:var(--ink3);display:grid;place-items:center;text-align:center}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px}
.pdots{display:flex;gap:6px}
.pdots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.pdots i.on{background:var(--blue)}
.ctrl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ctrl div{background:var(--bg);border-radius:12px;padding:12px}
.ctrl kbd{display:inline-block;border:1px solid var(--ink3);border-bottom-width:3px;border-radius:5px;padding:0 6px;font-size:15px;font-family:inherit;background:#fff;margin:0 1px}
.note{font-size:14px;color:var(--ink3);margin-top:16px}

/* ---------- game ---------- */
#game{position:fixed;inset:0;top:calc(52px + env(safe-area-inset-top));display:grid;grid-template-rows:auto minmax(0,1fr)}
#game.wide{grid-template-columns:minmax(0,1fr) 400px}
#game.wide .stats{grid-column:1/-1}
.stats{background:#fff;border-bottom:1px solid var(--line);padding:6px 12px;display:flex;gap:10px;align-items:center}
.sbox{min-width:0}
.sbox .lab{display:block;white-space:nowrap;font-size:13px;color:var(--ink3);font-weight:700;line-height:1.2}
.sbox .val{font-size:20px;font-weight:900;color:var(--navy);font-variant-numeric:tabular-nums;line-height:1.25;white-space:nowrap}
.sbox .val small{font-size:14px;font-weight:700;color:var(--ink3)}
.sales{flex:1;padding-right:6px}
.prog{display:block;height:8px;border-radius:4px;background:var(--line2);overflow:hidden;margin-top:3px;max-width:340px}
.prog u{display:block;height:100%;background:var(--blue);text-decoration:none;transition:width .4s}
.prog u.met{background:var(--good)}
.loyal .val.up{color:var(--good)} .loyal .val.down{color:var(--bad)}
.goBtn{border:0;border-radius:10px;background:var(--navy);color:#fff;font-weight:800;padding:8px 12px;min-height:44px;cursor:pointer;font-size:16px;line-height:1.2;max-width:150px}
.goBtn[disabled]{background:#b8c0cc;cursor:default}
.stagewrap{position:relative;overflow:hidden;background:#d9c7a8;touch-action:none}
.stage{position:absolute;left:0;top:0;transform-origin:0 0;transition:transform .35s ease}
.stage svg.floor{position:absolute;left:0;top:0}
.ent{position:absolute;left:0;top:0;pointer-events:none}
.person{width:60px;height:70px;margin-left:-30px;margin-top:-68px;position:relative}
.person svg{width:60px;height:66px;display:block}
.person .tag{position:absolute;left:50%;top:66px;transform:translateX(-50%);background:rgba(16,42,86,.9);color:#fff;font-size:17px;font-weight:700;border-radius:6px;padding:0 7px;white-space:nowrap;line-height:1.4}
.person.me .tag{background:var(--blue)}
.carry{position:absolute;right:-16px;top:26px;width:30px;height:20px;border-radius:3px;background:#c98a3b;border:2px solid #fff;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.sat{position:absolute;left:50%;top:-20px;transform:translateX(-50%);width:66px;height:11px;border-radius:6px;background:rgba(0,0,0,.25);overflow:hidden;border:2px solid #fff;box-sizing:content-box}
.sat u{display:block;height:100%;background:#2fa35a;text-decoration:none}
.sat.mid u{background:#e0a020}.sat.low u{background:#d23a3a}
.chip{position:absolute;left:50%;top:-56px;transform:translateX(-50%);font-size:18px;font-weight:800;border-radius:9px;padding:0 9px;background:#fff;color:var(--ink);border:2px solid rgba(16,42,86,.5);white-space:nowrap;line-height:1.5}
.chip.act{background:#f2b705;border-color:#1b2433;animation:bob 1s ease-in-out infinite}
.chip.angry{background:var(--bad);color:#fff;border-color:#fff}
.chip.happy{background:var(--good);color:#fff;border-color:#fff}
@keyframes bob{50%{transform:translate(-50%,-5px)}}
.marker{position:absolute;left:0;top:0;pointer-events:none}
.marker .bang{position:absolute;left:0;top:-58px;transform:translateX(-50%);width:34px;height:34px;border-radius:50%;background:#f2b705;color:#1b2433;font-weight:900;display:grid;place-items:center;font-size:22px;box-shadow:0 2px 6px rgba(0,0,0,.25);animation:bob 1s ease-in-out infinite}
.ring{position:absolute;left:-42px;top:-42px;width:84px;height:84px;border-radius:50%;border:4px dashed #f2b705;animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tapdot{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;border:3px solid var(--navy);opacity:.8;pointer-events:none;animation:ping .5s ease-out forwards}
@keyframes ping{to{transform:scale(2.2);opacity:0}}
.pausebadge{position:absolute;right:10px;top:10px;background:rgba(16,42,86,.85);color:#fff;font-weight:800;font-size:15px;border-radius:999px;padding:3px 12px;pointer-events:none}

/* side panel / bottom sheet */
.side{background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
#game.tall .side{position:fixed;left:0;right:0;bottom:0;max-height:64vh;border-left:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -8px 24px rgba(0,0,0,.14);padding:10px 16px calc(16px + env(safe-area-inset-bottom));z-index:30}
#game.tall .side.idle{display:none}
.grab{display:none;width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
#game.tall .grab{display:block}
.side h2{font-size:21px;line-height:1.35}
.hint{font-size:16px;color:var(--ink2);background:var(--bg);border-radius:12px;padding:10px 12px}
.clist{display:grid;gap:8px}
.crow{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:4px 10px;align-items:center;border:2px solid var(--line);border-radius:12px;padding:8px 10px;background:#fff;cursor:pointer;text-align:left;width:100%}
.crow:hover{border-color:var(--blue)}
.crow.act{border-color:#f2b705;background:#fffbea}
.crow b{font-size:17px}
.crow .st{grid-column:1/-1;font-size:15px;color:var(--ink2)}
.crow .sat{position:static;transform:none;width:88px;height:10px}
.crm{border:1px solid var(--line);border-radius:14px;padding:12px}
.crm-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.crm-h b{font-size:20px}
.seglabel{font-size:14px;font-weight:800;border-radius:999px;padding:2px 10px;color:#fff;background:var(--c5)}
.seglabel.v1,.seglabel.v2,.seglabel.v3{color:var(--ink)}
.crm-grid{display:grid;grid-template-columns:minmax(0,1fr) 96px;gap:10px;margin-top:8px;align-items:center}
.crm dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:17px}
.crm dt{color:var(--blue);font-weight:800}
.crm dd{margin:0;font-variant-numeric:tabular-nums}
.crm .memo{margin-top:8px;font-size:16px;color:var(--ink2);background:var(--bg);border-radius:8px;padding:6px 10px}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;width:96px}
.mini i{aspect-ratio:1;border-radius:3px;position:relative}
.mini i.on::after{content:"";position:absolute;inset:25%;border-radius:50%;background:#f2b705;border:2px solid #fff}
.mini i.from::after{content:"";position:absolute;inset:30%;border-radius:50%;background:transparent;border:2px dashed #fff}
.say{background:var(--bg);border-radius:14px 14px 14px 4px;padding:10px 12px;font-size:18px}
.say b{display:block;font-size:14px;color:var(--ink3)}
.q{font-weight:800;font-size:19px}
.opts{display:grid;gap:8px}
.opt{border:2px solid var(--line);background:#fff;border-radius:12px;padding:11px 13px;text-align:left;cursor:pointer;min-height:var(--tap);font-size:18px;line-height:1.5}
.opt:hover:not([disabled]){border-color:var(--blue)}
.opt[disabled]{cursor:default;color:var(--ink2)}
.opt.picked.good{border-color:var(--good);background:var(--good-wash);color:var(--ink)}
.opt.picked.bad{border-color:var(--bad);background:var(--bad-wash);color:var(--ink)}
.opt.picked.ok{border-color:var(--warn);background:var(--warn-wash);color:var(--ink)}
.opt.right{border-color:var(--good);border-style:dashed;color:var(--ink)}
.fb{border-radius:12px;padding:11px 13px;font-size:18px;background:var(--blue-wash)}
.fb .d{display:inline-block;font-weight:900;border-radius:999px;padding:0 10px;margin-right:6px;font-size:16px;color:#fff;background:var(--blue)}
.fb.good{background:var(--good-wash)} .fb.good .d{background:var(--good)}
.fb.bad{background:var(--bad-wash)} .fb.bad .d{background:var(--bad)}
.fb.ok{background:var(--warn-wash)} .fb.ok .d{background:var(--warn)}
.fix{border:2px solid var(--good);border-radius:12px;padding:11px 13px;font-size:18px;background:#fff}
.fix b{color:var(--good)}
.fix p+p{margin-top:6px}
.orders{display:grid;gap:8px}
.shelf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.box{border:0;border-radius:10px;background:#c98a3b;color:#fff;padding:10px 12px;min-height:72px;cursor:pointer;text-align:left;box-shadow:inset 0 -6px 0 rgba(0,0,0,.15)}
.box b{display:block;font-size:16px}
.box span{display:block;font-size:24px;font-weight:900;font-variant-numeric:tabular-nums}
.box:hover{background:#b9782b}
.need{background:var(--warn-wash);border-radius:10px;padding:8px 12px;font-size:18px}
.scanfx{display:grid;grid-template-columns:110px minmax(0,1fr);gap:14px;align-items:center}
.scanfx svg{width:110px;height:auto}
.scanline{animation:scan 1.2s ease-in-out 2}
@keyframes scan{0%{transform:translateY(0)}50%{transform:translateY(150px)}100%{transform:translateY(0)}}
.toast{position:fixed;left:50%;top:calc(132px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--navy);color:#fff;border-radius:12px;padding:9px 16px;font-size:17px;z-index:50;box-shadow:0 6px 18px rgba(0,0,0,.2);max-width:92vw;text-align:center}
.toast.bad{background:var(--bad)}

/* ---------- report ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.kpi span{display:block;font-size:15px;color:var(--ink2)}
.kpi b{display:block;font-size:clamp(22px,4.8vw,30px);font-weight:900;color:var(--navy);white-space:nowrap;font-variant-numeric:tabular-nums}
.kpi em{display:block;font-style:normal;font-size:15px;font-weight:800}
.kpi em.y{color:var(--good)} .kpi em.n{color:var(--bad)}
.verdict{font-size:20px;font-weight:800;margin-top:12px}
.rep{margin:0;padding:0;list-style:none}
.rep li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:12px 0;border-top:1px solid var(--line2)}
.rep li:first-child{border-top:0}
.rep .who{font-weight:800;font-size:19px}
.rep .satn{font-weight:800;font-variant-numeric:tabular-nums}
.rep .mv{grid-column:1/-1;display:flex;align-items:center;gap:12px;font-size:17px;color:var(--ink2);flex-wrap:wrap}
.rep .mv .mini{width:70px}
ol.qs{margin:8px 0 0;padding-left:1.4em}
ol.qs li{margin:14px 0;font-size:19px}
ol.qs small{display:block;color:var(--ink3);font-size:14px}

/* ---------- device adaptation ---------- */
@media (max-width:640px){
  .hero{grid-template-columns:minmax(0,1fr) 92px;gap:10px}
  .hero svg{max-width:92px}
  .goals,.rfm3,.ctrl{grid-template-columns:minmax(0,1fr)}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .top .name{font-size:15px}
  .sbox .val{font-size:18px}
  .goBtn{font-size:15px;padding:6px 10px;max-width:112px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="name" id="appname"></div>
  <div class="clock hide" id="clock"></div>
  <div class="lang" role="group" aria-label="Language 語言">
    <button type="button" data-lang="zh">中文</button>
    <button type="button" data-lang="en">EN</button>
  </div>
</header>
<div id="page"></div>
<div id="game" class="hide">
  <div class="stats" id="stats">
    <div class="sbox sales"><span class="lab" id="sLab"></span><span class="val" id="sVal"></span><i class="prog"><u id="sBar"></u></i></div>
    <div class="sbox loyal"><span class="lab" id="lLab"></span><span class="val" id="lVal"></span></div>
    <button type="button" class="goBtn" id="goBtn"></button>
  </div>
  <div class="stagewrap" id="wrap"><div class="stage" id="stage"></div><div class="pausebadge hide" id="pause"></div></div>
  <aside class="side" id="side" aria-live="polite"></aside>
</div>

<script>
(() => {
'use strict';
const TOUCH = window.matchMedia ? window.matchMedia('(pointer:coarse)').matches : false;

/* ============================================================
   COPY — every word on screen, 繁體中文 and English
   ============================================================ */
const T = {
  zh: {
    app: '店長的一天：RFM 足測鞋店',
    kicker: '大數據行銷 · RFM 模擬遊戲 · 約 12 分鐘',
    title: '店長的一天',
    lead: '今天由你擔任足測鞋店的店長。客人會一位、兩位、三位地走進來，你要親自招呼、帶去足測、到倉庫拿鞋、試穿、結帳。系統會顯示每位會員的 RFM 資料，用它決定怎麼服務。',
    begin: '看遊戲說明', skip: '已經會玩，直接開店',
    pages: [
      { h: '你的角色與今天的兩個目標', goals: true },
      { h: '服務一位客人的流程', flow: [
        ['招呼', '走到客人旁邊，看 CRM 上的 RFM 資料，選一句最適合的開場白。'],
        ['足測（需要時）', '沒有足測資料，或資料太舊，就帶去足壓測試機重新測量。'],
        ['到倉庫拿鞋', '走進倉庫，從四個鞋盒裡拿出款式和尺寸都對的那一盒。'],
        ['試穿', '把鞋盒拿到試穿區，交給正在等的客人。'],
        ['結帳＋安排回店', '到結帳櫃台結帳，替客人安排下一次回來的理由，CRM 會即時更新。']

/* ============================================================

    ${lab(px + 30, py + 60, X.st.pos)}

function meHtml() {
  return `<div class="ent" id="eMe"><div class="person me">${figure('#e7eef9', true)}<span class="tag">${esc(t().me)}</span><span class="carry hide" id="carry"></span></div></div>
    <div class="marker hide" id="mkStock"><div class="ring"></div><div class="bang">!</div></div>
    <div class="marker hide" id="mkPos"><div class="ring"></div><div class="bang">!</div></div>`;

function custEl(c) {
  const d = document.createElement('div');
  d.className = 'ent'; d.id = 'c-' + c.id;
  d.innerHTML = `<div class="person"><span class="chip"></span>${satBar(c.sat)}${figure(c.def.color)}<span class="tag">${esc(nm(c.id))}</span></div>`;

/* ============================================================
   LAYOUT — choose landscape or portrait, scale the stage to fit
   ============================================================ */
function chooseLayout() { return (innerWidth >= 900 && innerWidth >= innerHeight * 1.05) ? 'wide' : 'tall'; }
function applyLayout() {
  const prev = L, name = chooseLayout();
  const game = $('game');
  game.classList.toggle('wide', name === 'wide'); game.classList.toggle('tall', name === 'tall');
  layoutName = name; L = LAYOUT[name];
  if (G && prev !== L) {   // carry everyone across layouts
    G.me.x = G.me.x / prev.W * L.W; G.me.y = G.me.y / prev.H * L.H; G.me.tx = null; G.me.goal = null;
    for (const c of G.custs) { c.x = c.x / prev.W * L.W; c.y = c.y / prev.H * L.H; retarget(c); }
  }
  const stage = $('stage');
  stage.style.width = L.W + 'px'; stage.style.height = L.H + 'px';
  stage.innerHTML = storeSvg() + meHtml();
  if (G) { for (const c of G.custs) custEl(c); if (G.me.carry) $('carry').classList.remove('hide'); }
  fit();
  if (G) drawEntities();
}
function fit() {
  const wrap = $('wrap'), r = wrap.getBoundingClientRect(), side = $('side');
  const avH = layoutName === 'tall' ? Math.max(200, innerHeight - r.top) : r.height;
  scale = Math.min(r.width / L.W, avH / L.H);
  const ox = (r.width - L.W * scale) / 2;
  let oy = Math.max(0, (avH - L.H * scale) / 2);
  // phones: when the bottom sheet is up, slide the store so the action stays in view
  if (layoutName === 'tall' && G && G.panel && !side.classList.contains('idle')) {
    const vis = side.getBoundingClientRect().top - r.top;
    const fy = G.me.y - 40;
    if (vis < L.H * scale) oy = Math.min(0, Math.max(vis - L.H * scale, vis / 2 - fy * scale));
  }
  const st = $('stage');
  st.style.transform = `translate(${ox}px, ${oy}px) scale(${scale})`;
  st.dataset.ox = ox; st.dataset.oy = oy;
}

/* ============================================================
   THE DAY — customers, spots, waves
   ============================================================ */
function openStore() {
  G = newDay(); view = 'game';
  G.me.x = LAYOUT.wide.start[0]; G.me.y = LAYOUT.wide.start[1];
  L = LAYOUT.wide;
  render();
  G.me.x = L.start[0]; G.me.y = L.start[1];
  startWave();
  loop();
}
function startWave() {
  G.wave++; G.waveT = 0;
  const ids = WAVES[G.wave];
  ids.forEach((id, i) => G.pending.push({ id, at: G.time + i * 2.5 }));
  if (ids.length > 1) toast(t().wave(ids.length));
}
function spotTaken(kind, i) { return G.custs.some(c => c.spot && c.spot.kind === kind && c.spot.i === i); }
function freeSpot(kind) { for (let i = 0; i < SPOTS_N[kind]; i++) if (!spotTaken(kind, i)) return i; return -1; }
function retarget(c) {
  if (c.state === 'leaving') { c.tx = L.door[0]; c.ty = L.door[1] + 20; return; }
  if (!c.spot) return;
  const p = spots(c.spot.kind)[c.spot.i]; c.tx = p[0]; c.ty = p[1];
}
function sendTo(c, kind) {
  const i = freeSpot(kind);
  c.spot = { kind, i: i < 0 ? SPOTS_N[kind] - 1 : i }; c.arrived = false; retarget(c);
}
// queues: scanner and checkout serve spot 0; others step forward when it frees up
function reflow() {
  for (const kind of ['scan', 'pay']) {
    for (let i = 1; i < SPOTS_N[kind]; i++) {
      if (!spotTaken(kind, i - 1)) {
        const c = G.custs.find(x => x.spot && x.spot.kind === kind && x.spot.i === i);
        if (c) { c.spot.i = i - 1; c.arrived = false; retarget(c); }
      }
    }
  }
}
function spawn(id) {
  const def = BYID[id];
  const c = { id, def, x: L.door[0], y: L.door[1] + 20, state: 'greet', spot: null, arrived: false, sat: def.sat,
    know: def.known ? Object.assign({}, def.known) : null, scanned: false, approach: null, tries: 0, errs: 0, firstFit: false, price: 0 };
  G.custs.push(c); sendTo(c, 'browse'); custEl(c);
  if (WAVES[G.wave].length === 1) toast(t().arrive(nm(id)));
}
function setState(c, st) {
  c.state = st; c.spot = null;
  if (st === 'scan') sendTo(c, 'scan');
  else if (st === 'bench') sendTo(c, 'bench');
  else if (st === 'pay') sendTo(c, 'pay');
  else if (st === 'leaving') { c.arrived = false; retarget(c); }
  reflow();
}
function changeSat(c, d) { c.sat = Math.max(0, Math.min(100, c.sat + d)); return d; }
function record(c) {
  if (G.res.find(x => x.id === c.id)) return;
  G.res.push({ id: c.id, sat: Math.max(0, Math.round(c.sat)), angry: !!c.angry, price: c.price, follow: c.follow || null, after: c.after || c.def.seg, errs: c.errs });
}
function leave(c, angry, why) {
  c.angry = angry; if (angry) c.sat = 0;
  if (G.me.carry && G.me.carry.id === c.id) { G.me.carry = null; $('carry').classList.add('hide'); }
  if (G.me.goal && G.me.goal.indexOf(c.id) >= 0) G.me.goal = null;
  record(c);
  setState(c, 'leaving');
  if (angry && why) toast(why === 'wait' ? t().angryWait(nm(c.id)) : t().angryErr(nm(c.id)), true);
  updateStats();
}

/* ---------- what can the manager do right now? ---------- */
function targets() {
  if (!G) return [];
  const out = [];
  const carry = G.me.carry;
  for (const c of G.custs) {
    if (!c.arrived || c.state === 'leaving') continue;
    const beside = [c.x + (c.x > L.W / 2 ? -54 : 54), c.y + 12];
    if (c.state === 'greet') out.push({ key: 'greet:' + c.id, kind: 'greet', c, pos: [c.x, c.y], stand: beside, urg: c.sat });
    if (c.state === 'scan' && c.spot.i === 0) out.push({ key: 'scan:' + c.id, kind: 'scan', c, pos: [c.x, c.y], stand: [c.x + 92, c.y + 20], urg: c.sat });
    if (c.state === 'bench' && carry && carry.id === c.id) out.push({ key: 'try:' + c.id, kind: 'try', c, pos: [c.x, c.y], stand: [c.x, c.y + 66], urg: c.sat });
    if (c.state === 'pay' && c.spot.i === 0) out.push({ key: 'pay', kind: 'pay', c, pos: [L.pos[0], L.pos[1] - 44], stand: [L.pos[0], L.pos[1] - 44], urg: c.sat });
  }
  const orders = G.custs.filter(c => c.state === 'bench');
  if (!carry && orders.length) out.push({ key: 'stock', kind: 'stock', pos: [L.stock[0], L.stock[1] + 30], stand: [L.stock[0], L.stock[1] + 30], urg: Math.min(...orders.map(c => c.sat)) });
  return out;
}
function mostUrgent() { const ts = targets(); return ts.sort((a, b) => a.urg - b.urg)[0] || null; }
function goTo(key) { const tg = targets().find(x => x.key === key); if (!tg || G.panel) return; G.me.goal = key; G.me.tx = tg.stand[0]; G.me.ty = tg.stand[1]; keys.clear(); }
function openTarget(tg) {
  G.me.tx = null; G.me.goal = null; keys.clear();
  if (tg.kind === 'stock') { const o = G.custs.filter(c => c.state === 'bench'); G.panel = { kind: 'stock', sel: o.length === 1 ? o[0].id : null }; }
  else if (tg.kind === 'scan') { G.panel = { kind: 'scan', id: tg.c.id, done: false }; setTimeout(() => { if (G && G.panel && G.panel.kind === 'scan' && G.panel.id === tg.c.id) { finishScan(tg.c); } }, matchMedia('(prefers-reduced-motion:reduce)').matches ? 60 : 1300); }
  else if (tg.kind === 'try') { tryOn(tg.c); }
  else G.panel = { kind: tg.kind, id: tg.c.id };
  panel(); drawEntities();
}
function closePanel() { G.panel = null; G.me.moved = false; panel(); updateStats(); drawEntities(); }
const cOf = id => G.custs.find(c => c.id === id);

/* ---------- step actions ---------- */
function chooseApproach(k) {
  const P = G.panel, c = cOf(P.id), d = c.def;
  if (c.approach) return;
  c.approach = k;
  if (k === d.good) P.delta = changeSat(c, D.goodGreet);
  else { c.errs++; P.delta = d.leaveOn.includes(k) ? -Math.round(c.sat) : changeSat(c, D.badGreet); if (d.leaveOn.includes(k)) c.sat = 0; }
  panel(true); updateStats();
}
function afterApproach() {
  const c = cOf(G.panel.id), d = c.def;
  if (c.sat <= 0) { closePanel(); leave(c, true, 'err'); return; }
  setState(c, c.approach === d.good && d.scanNeeded ? 'scan' : 'bench');
  closePanel();
}
function finishScan(c) {
  const d = c.def;
  c.scanned = true; G.data++;
  c.know = { size: d.scanned ? d.scanned.size : d.known.size, age: 0, arch: d.scanned ? d.scanned.arch : d.known.arch };
  G.panel.done = true; G.panel.delta = changeSat(c, D.scan);
  panel(true);
}
function afterScan() { const c = cOf(G.panel.id); setState(c, 'bench'); closePanel(); }
function pickBox(id, i) {
  const c = cOf(id); if (!c) return;
  G.me.carry = { id, box: c.def.shelf[i] };
  $('carry').classList.remove('hide');
  closePanel();
  toast(t().took(nm(id)));
}
function tryOn(c) {
  const d = c.def, box = G.me.carry.box, ok = box[0] === d.need.shoe && box[1] === d.need.size;
  G.me.carry = null; $('carry').classList.add('hide');
  c.tries++;
  const P = { kind: 'try', id: c.id };
  if (ok) { P.result = 'ok'; if (c.tries === 1) { c.firstFit = true; P.delta = changeSat(c, D.fitFirst); } else P.delta = 0; }
  else if (d.scanNeeded && !c.scanned) { P.result = 'stale'; c.errs++; P.delta = changeSat(c, D.stale); }
  else { P.result = 'wrong'; c.errs++; P.delta = changeSat(c, D.badBox); }
  G.panel = P;
}
function afterTry() {
  const P = G.panel, c = cOf(P.id);
  if (c.sat <= 0) { closePanel(); leave(c, true, 'err'); return; }
  if (P.result === 'ok') setState(c, 'pay');
  else if (P.result === 'stale') setState(c, 'scan');
  else { c.arrived = true; }      // stays on the bench, waiting for the right box
  closePanel();
}
function chooseFollow(k) {
  const P = G.panel, c = cOf(P.id), d = c.def;
  if (c.follow) return;
  c.follow = k;
  if (k === d.best) P.delta = changeSat(c, D.bestFollow);
  else if (k === 'coupon') { c.errs++; P.delta = Math.max(1, c.sat + D.coupon) - c.sat; c.sat = Math.max(1, c.sat + D.coupon); }
  else P.delta = 0;
  c.price = Math.round(PRICE[d.need.shoe] * (d.disc[c.approach] || 1));
  G.sales += c.price;
  c.after = segOf(0, d.f + 1, d.m + c.price);
  panel(true); updateStats();
}
function afterPay() { const c = cOf(G.panel.id); closePanel(); leave(c, false); }

/* ============================================================
   SIDE PANEL / BOTTOM SHEET
   ============================================================ */
function crmCard(c) {
  const X = t(), d = c.def, k = c.know;
  return `<div class="crm"><div class="crm-h"><b>${esc(nm(c.id))}</b><span class="seglabel v${VALUE[d.seg]}" style="background:var(--c${VALUE[d.seg]})">${X.seg[d.seg]}</span><span class="small">${X.crmH}</span></div>
    <div class="crm-grid"><dl><dt>R</dt><dd>${X.rDays(d.r)}</dd><dt>F</dt><dd>${X.fTimes(d.f)}</dd><dt>M</dt><dd>${X.mAmt(nf(d.m))}</dd>
      <dt>${X.sizeL}</dt><dd>${k ? X.sizeKnown(k.size, k.age) : X.sizeNone}</dd></dl>${mini(null, d.seg)}</div>
    <p class="memo"><b>${X.memoH}：</b>${t().cust[c.id].memo}</p></div>`;
}
const fbBox = (cls, delta, html) => `<div class="fb ${cls}">${delta ? `<span class="d">${t().satD(delta)}</span>` : ''}${html}</div>`;
const fixBox = (fix, why) => `<div class="fix"><p><b>${t().fixH}：</b>${fix}</p><p><b>${t().whyH}：</b>${why}</p></div>`;
function custStatus(c) {
  const X = t(), S = X.status;
  if (!c.arrived && c.state !== 'bench') return c.state === 'greet' ? S.enter : S.walk;
  if (c.state === 'greet') return S.greet;
  if (c.state === 'scan') return c.spot.i === 0 ? S.scan : S.scanq;
  if (c.state === 'bench') return G.me.carry && G.me.carry.id === c.id ? S.benchHave : S.bench(X.shoe[c.def.need.shoe], c.know ? c.know.size : X.sizeUnknown);
  if (c.state === 'pay') return c.spot.i === 0 ? S.pay : S.payq;
  return '';
}
function idleBody() {
  const X = t(), act = new Set(targets().map(x => x.c && x.c.id));
  const list = G.custs.filter(c => c.state !== 'leaving');
  if (!list.length) return `<h2>${X.idleH}</h2><p class="hint">${X.idleEmpty}</p>`;
  return `<h2>${X.idleH}</h2><div class="clist">${list.map(c => `<button type="button" class="crow ${act.has(c.id) ? 'act' : ''}" data-act="who" data-v="${c.id}"><b>${esc(nm(c.id))} <span class="seglabel v${VALUE[c.def.seg]}" style="background:var(--c${VALUE[c.def.seg]})">${X.seg[c.def.seg]}</span></b>${satBar(c.sat)}<span class="st">${custStatus(c)}</span></button>`).join('')}</div>
    <p class="hint">${X.idleHint}</p>`;
}
function panel(toEnd) {
  const X = t(), side = $('side');
  if (view !== 'game' || !G) return;
  const P = G.panel;
  let body = '';
  if (G.closed) {
    body = `<h2>${X.closeH}</h2><p>${X.closeP}</p><button type="button" class="btn" data-act="report">${X.toReport}</button>`;
  } else if (!P) {
    body = layoutName === 'wide' ? idleBody() : '';
  } else if (P.kind === 'greet') {
    const c = cOf(P.id), d = c.def, cx = X.cust[c.id];
    body = crmCard(c) + `<div class="say"><b>${esc(cx.name)}</b>${cx.say}</div><p class="q">${X.howGreet}</p>
      <div class="opts">${d.opts.map(k => `<button type="button" class="opt ${c.approach === k ? 'picked ' + (k === d.good ? 'good' : 'bad') : ''} ${c.approach && c.approach !== d.good && k === d.good ? 'right' : ''}" data-act="appr" data-v="${k}" ${c.approach ? 'disabled' : ''}>${cx.opts[k]}</button>`).join('')}</div>`;
    if (c.approach) {
      const good = c.approach === d.good;
      body += fbBox(good ? 'good' : 'bad', P.delta, cx.fb[c.approach]);
      if (!good) body += fixBox(`「${cx.opts[d.good]}」`, cx.fb[d.good]);
      body += `<button type="button" class="btn" data-act="afterAppr">${c.sat <= 0 ? X.seeOut : good && d.scanNeeded ? X.goScan : X.goBench}</button>`;
    }
  } else if (P.kind === 'scan') {
    const c = cOf(P.id), k = c.know;
    body = `<div class="scanfx">${FOOT_SVG(P.done ? k.arch : 'normal')}<div><p class="q">${esc(nm(c.id))}</p><p style="font-weight:800;font-size:20px">${P.done ? X.scanDone(k.size, X.arch[k.arch]) : X.scanH}</p>${P.done ? `<p class="small" style="margin-top:6px">${X.scanNote}</p>` : ''}</div></div>
      ${P.done ? fbBox('good', P.delta, '') + `<button type="button" class="btn" data-act="afterScan">${X.goBench}</button>` : ''}`;
  } else if (P.kind === 'stock') {
    const orders = G.custs.filter(c => c.state === 'bench');
    body = `<h2>${X.stockH}</h2>`;
    if (orders.length > 1) body += `<p class="q">${X.whichOrder}</p><div class="orders">${orders.map(c => `<button type="button" class="opt ${P.sel === c.id ? 'picked ok' : ''}" data-act="order" data-v="${c.id}"><b>${esc(nm(c.id))}</b>：${X.shoe[c.def.need.shoe]} ${c.know ? c.know.size : X.sizeUnknown}</button>`).join('')}</div>`;
    const c = P.sel ? cOf(P.sel) : null;
    if (c && c.state === 'bench') {
      body += `<div class="need">${X.needLine(esc(nm(c.id)), X.shoe[c.def.need.shoe], c.know ? c.know.size : X.sizeUnknown)}</div><p class="q">${X.shelfH}</p>
        <div class="shelf">${c.def.shelf.map((b, i) => `<button type="button" class="box" data-act="box" data-v="${i}"><b>${X.shoe[b[0]]}</b><span>${b[1]}</span></button>`).join('')}</div>`;
    }
    body += `<button type="button" class="btn ghost" data-act="close">${X.cancel}</button>`;
  } else if (P.kind === 'try') {
    const c = cOf(P.id), d = c.def;
    if (P.result === 'ok') body = `<p class="q">${esc(nm(c.id))}</p>` + fbBox('good', P.delta, c.tries === 1 ? X.tryOk : X.tryOk2) + `<button type="button" class="btn" data-act="afterTry">${X.toPay}</button>`;
    else if (P.result === 'stale') body = `<p class="q">${esc(nm(c.id))}</p>` + fbBox('bad', P.delta, X.tryBad) + fixBox(X.fixStale, X.whyStale(d.known.age)) + `<button type="button" class="btn" data-act="afterTry">${c.sat <= 0 ? X.seeOut : X.rescan}</button>`;
    else body = `<p class="q">${esc(nm(c.id))}</p>` + fbBox('bad', P.delta, X.tryBad) + fixBox(X.fixBox(X.shoe[d.need.shoe], d.need.size), X.whyBox) + `<button type="button" class="btn" data-act="afterTry">${c.sat <= 0 ? X.seeOut : X.refetch}</button>`;
  } else if (P.kind === 'pay') {
    const c = cOf(P.id), d = c.def, cx = X.cust[c.id], dsc = d.disc[c.approach];
    const price = Math.round(PRICE[d.need.shoe] * (dsc || 1));
    body = `<h2>${X.payH(esc(cx.name))}</h2><p style="font-variant-numeric:tabular-nums;font-size:20px;font-weight:800">${X.price(X.shoe[d.need.shoe], nf(price))}${dsc ? X.discountNote(dsc * 10) : ''}</p>
      <p class="q">${X.followH}</p>
      <div class="opts">${FOLLOW.map(k => `<button type="button" class="opt ${c.follow === k ? 'picked ' + (k === d.best ? 'good' : k === 'coupon' ? 'bad' : 'ok') : ''} ${c.follow && c.follow !== d.best && k === d.best ? 'right' : ''}" data-act="follow" data-v="${k}" ${c.follow ? 'disabled' : ''}>${X.follow[k]}</button>`).join('')}</div>`;
    if (c.follow) {
      const best = c.follow === d.best;
      body += best ? fbBox('good', P.delta, cx.followWhy) : fbBox(c.follow === 'coupon' ? 'bad' : 'ok', P.delta, c.follow === 'coupon' ? X.followCoupon : X.followOk) + fixBox(X.follow[d.best], cx.followWhy);
      body += `<div class="crm" style="display:flex;gap:12px;align-items:center">${mini(d.seg, c.after)}<div><p style="font-size:16px">${X.crmUpd(nf(c.price))}</p><p style="font-weight:800">${X.segMove(X.seg[d.seg], X.seg[c.after])}</p></div></div>
        <button type="button" class="btn" data-act="afterPay">${X.seeOut}</button>`;
    }
  }
  const idle = !P && !G.closed;
  side.classList.toggle('idle', idle);
  const sig = idle ? 'idle|' + LANG + '|' + body.replace(/<span class="sat[^]*?<\/span>/g, '') : null;
  if (sig && sig === side.dataset.sig) {
    G.custs.forEach(c => { const row = side.querySelector(`.crow[data-v="${c.id}"] .sat`); if (row) { const f = Math.max(0, Math.min(100, c.sat)); row.firstChild.style.width = f + '%'; row.className = 'sat ' + (f < 30 ? 'low' : f < 60 ? 'mid' : ''); } });
    return;
  }
  side.dataset.sig = sig || '';
  side.innerHTML = `<div class="grab"></div>${body}`;
  $('pause').classList.toggle('hide', !P);
  if (toEnd) requestAnimationFrame(() => { const last = side.lastElementChild; if (last) last.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); });
  else if (P) side.scrollTop = 0;
  if (layoutName === 'tall') requestAnimationFrame(fit);
}
function updateStats() {
  if (!G) return;
  const X = t(), lo = loyalNow();
  $('sLab').textContent = X.sales;
  $('sVal').innerHTML = `NT$${nf(G.sales)}<small>${X.target(nf(TARGET))}</small>`;
  const bar = $('sBar'); bar.style.width = Math.min(100, G.sales / TARGET * 100) + '%'; bar.classList.toggle('met', G.sales >= TARGET);
  $('lLab').textContent = X.loyal;
  const lv = $('lVal'); lv.innerHTML = `${lo} <small>${X.loyalOpen(LOYAL0)}</small>`; lv.classList.toggle('up', lo > LOYAL0); lv.classList.toggle('down', lo < LOYAL0);
  const go = $('goBtn'); go.textContent = X.go; go.disabled = !!G.panel || !targets().length;
  $('pause').textContent = X.paused;
  $('clock').textContent = clockText(600 + G.time * 2);
}
function toast(msg, bad) {
  document.querySelectorAll('.toast').forEach(el => el.remove());
  const el = document.createElement('div'); el.className = 'toast' + (bad ? ' bad' : ''); el.textContent = msg; el.setAttribute('role', 'status');
  document.body.appendChild(el); setTimeout(() => el.remove(), 2400);
}

/* ============================================================
   MOVEMENT LOOP
   ============================================================ */
function chipOf(c) {
  const C = t().chip, act = targets().some(x => x.c === c);
  if (c.state === 'leaving') return [c.angry ? C.angry : C.happy, c.angry ? 'angry' : 'happy'];
  if (!c.arrived) return [c.state === 'greet' ? C.enter : c.state === 'bench' ? C.benchwalk : c.state === 'pay' ? C.payWalk : C.enter, ''];
  if (c.state === 'greet') return [C.greet, 'act'];
  if (c.state === 'scan') return c.spot.i === 0 ? [C.scan, 'act'] : [C.scanq, ''];
  if (c.state === 'bench') return act ? [C.benchgo, 'act'] : [C.bench, ''];
  if (c.state === 'pay') return c.spot.i === 0 ? [C.pay, 'act'] : [C.payq, ''];
  return ['', ''];
}
function drawEntities() {
  if (!G) return;
  const me = $('eMe'); if (me) me.style.transform = `translate(${G.me.x}px, ${G.me.y}px)`;
  for (const c of G.custs) {
    if (!c.el) continue;
    c.el.style.transform = `translate(${c.x}px, ${c.y}px)`;
    const [txt, cls] = chipOf(c), chip = c.el.querySelector('.chip');
    if (chip.textContent !== txt) chip.textContent = txt;
    chip.className = 'chip ' + cls;
    const s = c.el.querySelector('.sat'), f = Math.max(0, Math.min(100, c.sat));
    s.firstChild.style.width = f + '%'; s.className = 'sat ' + (f < 30 ? 'low' : f < 60 ? 'mid' : '');
    s.classList.toggle('hide', c.state === 'leaving');
  }
  const ts = targets(), ms = $('mkStock'), mp = $('mkPos');
  const st = ts.find(x => x.kind === 'stock'), pp = ts.find(x => x.kind === 'pay');
  if (ms) { ms.classList.toggle('hide', !st || !!G.panel); if (st) ms.style.transform = `translate(${st.pos[0]}px, ${st.pos[1]}px)`; }
  if (mp) { mp.classList.toggle('hide', !pp || !!G.panel); if (pp) mp.style.transform = `translate(${L.pos[0]}px, ${L.pos[1] - 20}px)`; }
}
let sideTick = 0;
function step(dt) {
  if (!G || G.closed) return;
  const paused = !!G.panel;
  // you
  if (!paused) {
    const me = G.me, ox = me.x, oy = me.y;
    if (keys.size) {
      let vx = 0, vy = 0;
      if (keys.has('left')) vx -= 1; if (keys.has('right')) vx += 1; if (keys.has('up')) vy -= 1; if (keys.has('down')) vy += 1;
      const n = Math.hypot(vx, vy) || 1;
      me.x += vx / n * SPEED * dt; me.y += vy / n * SPEED * dt; me.tx = null; me.goal = null;
    } else if (me.tx != null) {
      if (me.goal) { const tg = targets().find(x => x.key === me.goal); if (tg) { me.tx = tg.stand[0]; me.ty = tg.stand[1]; } else me.goal = null; }
      const dx = me.tx - me.x, dy = me.ty - me.y, d = Math.hypot(dx, dy);
      if (d < 4) { me.tx = null; } else { const s = Math.min(d, SPEED * dt); me.x += dx / d * s; me.y += dy / d * s; }
    }
    me.x = Math.max(24, Math.min(L.W - 24, me.x)); me.y = Math.max(72, Math.min(L.H - 12, me.y));
    if (Math.hypot(me.x - ox, me.y - oy) > 0.5) me.moved = true;
  }
  // customers walk (also while paused, so they finish their steps)
  for (const c of [...G.custs]) {
    const dx = c.tx - c.x, dy = c.ty - c.y, d = Math.hypot(dx, dy);
    if (d > 2) { const s = Math.min(d, CSPEED * dt); c.x += dx / d * s; c.y += dy / d * s; }
    else if (!c.arrived) { c.arrived = true; if (c.state === 'leaving') { c.el && c.el.remove(); G.custs.splice(G.custs.indexOf(c), 1); reflow(); } }
  }
  if (!paused) {
    G.time += dt; G.waveT += dt;
    for (const c of [...G.custs]) {
      if (c.state === 'leaving') continue;
      c.sat -= DECAY * dt;
      if (c.sat <= 0) leave(c, true, 'wait');
    }
    // arrivals
    for (const p of [...G.pending]) if (G.time >= p.at && freeSpot('browse') >= 0) { G.pending.splice(G.pending.indexOf(p), 1); spawn(p.id); }
    const active = G.custs.filter(c => c.state !== 'leaving').length;
    if (G.wave < WAVES.length - 1 && !G.pending.length && (active === 0 || G.waveT >= WAVE_GAP)) startWave();
    if (G.wave === WAVES.length - 1 && !G.pending.length && G.custs.length === 0) { G.closed = true; G.me.carry = null; panel(); updateStats(); }
    // interact
    const me = G.me, ts = targets();
    if (me.goal) {
      const tg = ts.find(x => x.key === me.goal);
      if (tg && (Math.hypot(me.x - tg.stand[0], me.y - tg.stand[1]) < 10 || Math.hypot(me.x - tg.pos[0], me.y - tg.pos[1]) < REACH)) openTarget(tg);
    } else if (me.tx == null && !keys.size && me.moved) {
      let best = null, bd = REACH;
      for (const tg of ts) { const dd = Math.hypot(me.x - tg.pos[0], me.y - tg.pos[1]); if (dd < bd) { bd = dd; best = tg; } }
      if (best) openTarget(best);
    }
  }
  drawEntities();
  if ((sideTick += dt) > 0.25) { sideTick = 0; updateStats(); if (!G.panel && layoutName === 'wide' && !G.closed) panel(); }
}
function loop() {
  cancelAnimationFrame(raf);
  lastT = performance.now();
  const tick = now => { const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now; if (view === 'game') { step(dt); raf = requestAnimationFrame(tick); } };
  raf = requestAnimationFrame(tick);
}

/* ============================================================
   RENDER + INPUT
   ============================================================ */
function render() {
  const X = t();
  document.documentElement.lang = LANG === 'zh' ? 'zh-Hant' : 'en';
  document.title = X.app; $('appname').textContent = X.app;
  document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === LANG)));
  const inGame = view === 'game';
  $('game').classList.toggle('hide', !inGame); $('page').classList.toggle('hide', inGame); $('clock').classList.toggle('hide', !inGame);
  if (inGame) { applyLayout(); panel(); updateStats(); }
  else {
    document.querySelectorAll('.toast').forEach(el => el.remove());
    $('page').innerHTML = view === 'intro' ? vIntro() : view === 'ctrl' ? vControls() : view === 'report' ? vReport() : vTalk();
    window.scrollTo(0, 0);
    const h = document.querySelector('#page h1, #page h2'); if (h) h.focus({ preventScroll: true });
  }
}
function summary() {
  const X = t(), k = totals();
  const lines = [X.app, `${X.kSales} NT$${nf(k.sales)} / ${nf(TARGET)} | ${X.kLoyal} ${X.loyalFromTo(LOYAL0, k.loyal)} | ${X.kSat} ${k.sat} | ${X.kAngry} ${k.angry}`];
  for (const c of CUSTOMERS) { const x = G.res.find(r => r.id === c.id); if (!x) continue; lines.push(`${nm(x.id)}: ${X.satL} ${x.sat}, ${x.angry ? X.angryL : X.boughtL(nf(x.price)) + ', ' + X.segMove(X.seg[c.seg], X.seg[x.after])}, ${X.errsL(x.errs)}`); }
  return lines.join('\n');
}
document.addEventListener('click', e => {
  const lb = e.target.closest('[data-lang]');
  if (lb) { LANG = lb.dataset.lang; try { localStorage.setItem('aso-store.lang', LANG); } catch (er) { /* no storage */ } render(); return; }
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const a = el.dataset.act, v = el.dataset.v;
  if (a === 'slide') { slide = +v; view = 'intro'; render(); return; }
  if (a === 'ctrl') { view = 'ctrl'; render(); return; }
  if (a === 'open') { openStore(); return; }
  if (a === 'report') { view = 'report'; render(); return; }
  if (a === 'talk') { view = 'talk'; render(); return; }
  if (a === 'again') { G = null; view = 'ctrl'; render(); return; }
  if (a === 'copy') { const m = $('copymsg'); (navigator.clipboard ? navigator.clipboard.writeText(summary()) : Promise.reject()).then(() => { m.textContent = t().copied; }, () => { m.textContent = summary(); }); return; }
  if (!G) return;
  if (a === 'who') { tapCustomer(cOf(v)); return; }
  if (a === 'appr') return chooseApproach(v);
  if (a === 'afterAppr') return afterApproach();
  if (a === 'afterScan') return afterScan();
  if (a === 'order') { G.panel.sel = v; panel(true); return; }
  if (a === 'box') return pickBox(G.panel.sel, +v);
  if (a === 'close') return closePanel();
  if (a === 'afterTry') return afterTry();
  if (a === 'follow') return chooseFollow(v);
  if (a === 'afterPay') return afterPay();
});
$('goBtn').addEventListener('click', () => { if (!G || G.panel) return; const tg = mostUrgent(); if (tg) goTo(tg.key); });
function tapCustomer(c) {
  if (!c || G.panel) return;
  const tg = targets().find(x => x.c === c);
  if (tg) { goTo(tg.key); return; }
  if (c.state === 'bench' && c.arrived) {
    if (G.me.carry) toast(t().handsFull(nm(G.me.carry.id)));
    else { toast(t().needShoes(nm(c.id), t().shoe[c.def.need.shoe], c.know ? c.know.size : t().sizeUnknown)); goTo('stock'); }
  }
}
// tap or click: a customer, a station, or the floor
$('wrap').addEventListener('pointerdown', e => {
  if (!G || G.panel || view !== 'game' || G.closed) return;
  const st = $('stage'), r = $('wrap').getBoundingClientRect();
  const x = (e.clientX - r.left - (+st.dataset.ox || 0)) / scale, y = (e.clientY - r.top - (+st.dataset.oy || 0)) / scale;
  if (x < 0 || y < 0 || x > L.W || y > L.H) return;
  const dot = document.createElement('div'); dot.className = 'tapdot'; dot.style.left = (e.clientX - r.left) + 'px'; dot.style.top = (e.clientY - r.top) + 'px';
  $('wrap').appendChild(dot); setTimeout(() => dot.remove(), 520);
  const hit = G.custs.find(c => c.state !== 'leaving' && Math.abs(x - c.x) < 38 && y > c.y - 90 && y < c.y + 30);
  if (hit && (targets().some(tg => tg.c === hit) || hit.state === 'bench')) { tapCustomer(hit); if (G.me.goal) return; }
  const [kx, ky] = L.stock, [px, py] = L.pos;
  if (x > kx - 120 && x < kx + 120 && y > ky - 115 && y < ky + 75 && targets().some(tg => tg.key === 'stock')) { goTo('stock'); return; }
  if (x > px - 90 && x < px + 90 && y > py - 50 && y < py + 40 && targets().some(tg => tg.key === 'pay')) { goTo('pay'); return; }
  if (G.me.goal) return;
  G.me.tx = x; G.me.ty = y; G.me.goal = null;
});
const KEYMAP = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down', a: 'left', d: 'right', w: 'up', s: 'down', A: 'left', D: 'right', W: 'up', S: 'down' };
addEventListener('keydown', e => {
  if (view !== 'game' || !G || G.panel) return;
  const k = KEYMAP[e.key];
  if (k) { keys.add(k); e.preventDefault(); return; }
  if (e.key === 'e' || e.key === 'E' || e.key === ' ') {
    e.preventDefault();
    let best = null, bd = REACH;
    for (const tg of targets()) { const dd = Math.hypot(G.me.x - tg.pos[0], G.me.y - tg.pos[1]); if (dd < bd) { bd = dd; best = tg; } }
    if (best) openTarget(best); else { const tg = mostUrgent(); if (tg) goTo(tg.key); }
  }
});
addEventListener('keyup', e => { const k = KEYMAP[e.key]; if (k) keys.delete(k); });
addEventListener('blur', () => keys.clear());
let rz = 0;
addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (view === 'game') { applyLayout(); panel(); } }, 120); });
render();
window.__store = { get G() { return G; }, get view() { return view; }, get layout() { return layoutName; }, targets, mostUrgent, CUSTOMERS, segOf, TARGET, LOYAL0 };
})();
</script>
