<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102a56">
<title>店長的一天：RFM 足測鞋店 | Store Manager for a Day</title>
<meta name="description" content="扮演足測鞋店店長經營一天，用 RFM 決定怎麼服務每位會員。改編自阿瘦數位轉型個案。Play a shoe-store manager for a day and use RFM to serve each member.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%227%22%20fill%3D%22%23102a56%22/%3E%3Cpath%20d%3D%22M8%2024V17h4v7zm6%200V11h4v13zm6%200V6h4v18z%22%20fill%3D%22%23ffffff%22/%3E%3C/svg%3E">
<!-- ============================================================
     店長的一天：RFM 足測鞋店 · Store Manager for a Day
     大數據與資料科學 第二章（講義 p.33–37：阿瘦個案與 RFM）
     單一檔案、無外部資源。寬螢幕是橫向門市＋側欄；手機與直向螢幕
     改用直向門市＋底部面板；觸控裝置用點地板走路，電腦也可用方向鍵。
     One file, no external resources. Wide screens get a landscape
     store with a side panel; phones and portrait screens get a
     portrait store with a bottom sheet. All words live in T below.
     ============================================================ -->
<style>
:root{
  --bg:#f3f1ec; --panel:#fff; --ink:#1b2433; --ink2:#4d5869; --ink3:#7a8494; --line:#dcd8cf; --line2:#ebe8e1;
  --navy:#102a56; --blue:#1f5fb8; --blue-wash:#e8f0fc;
  --good:#127a3d; --good-wash:#e6f5ec; --bad:#b4232c; --bad-wash:#fcebeb; --warn:#a15c00;
  --floor:#ead9bf; --floor2:#e2cdae; --wall:#cdb894;
  --c1:#e6effc; --c2:#c4d9f6; --c3:#86b6ef; --c4:#3f84d6; --c5:#184f95;
  --tap:44px;
}
*{box-sizing:border-box}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",Arial,sans-serif;line-height:1.55;font-size:16px;overscroll-behavior:none}
html[lang="zh-Hant"] body{line-height:1.7}
button{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
:focus-visible{outline:3px solid #f2b705;outline-offset:2px;border-radius:6px}
.hide{display:none!important}

/* ---------- top bar ---------- */
.top{position:fixed;top:0;left:0;right:0;z-index:40;background:var(--navy);color:#fff;height:calc(48px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 12px 0;display:flex;align-items:center;gap:10px}
.top .name{font-weight:800;font-size:15px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .clock{font-variant-numeric:tabular-nums;font-weight:800;background:rgba(255,255,255,.14);border-radius:8px;padding:2px 8px;font-size:14px}
.lang{display:flex;border:1px solid rgba(255,255,255,.5);border-radius:999px;overflow:hidden;flex-shrink:0}
.lang button{border:0;background:transparent;color:#fff;padding:4px 11px;font-size:13px;cursor:pointer;min-height:32px}
.lang button[aria-pressed="true"]{background:#fff;color:var(--navy);font-weight:700}

/* ---------- pages (intro, report, discussion) ---------- */
.page{max-width:860px;margin:0 auto;padding:calc(64px + env(safe-area-inset-top)) 16px 40px}
.kicker{font-size:13px;font-weight:800;color:var(--blue)}
.title{font-size:clamp(26px,6vw,40px);font-weight:900;margin:4px 0 8px;line-height:1.15}
.lead{color:var(--ink2);max-width:60ch;font-size:17px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.stack>*+*{margin-top:12px}
.small{font-size:13px;color:var(--ink3)}
.btn{border:0;border-radius:12px;background:var(--blue);color:#fff;font-weight:800;padding:12px 20px;min-height:var(--tap);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn:hover{background:var(--navy)}
.btn.ghost{background:transparent;color:var(--blue);border:2px solid var(--blue)}
.btn.ghost:hover{background:var(--blue-wash)}
.btn[disabled]{background:#b8c0cc;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.intro-hero{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:18px;align-items:center}
.intro-hero svg{width:100%;max-width:190px;justify-self:center}
.slides{margin-top:18px}
.slide h2{font-size:20px;margin-bottom:8px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.fact{background:var(--bg);border-radius:12px;padding:12px}
.fact b{display:block;font-size:24px;color:var(--navy);font-weight:900}
.fact span{font-size:14px;color:var(--ink2)}
.journey{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:10px 0 0;padding:0;list-style:none;counter-reset:j}
.journey li{background:var(--blue-wash);border-radius:12px;padding:10px;font-size:14px;counter-increment:j}
.journey li::before{content:counter(j);display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--blue);color:#fff;font-size:12px;font-weight:800;margin-right:6px}
.rfm3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.rfm3 div{border-radius:12px;padding:12px;color:#fff}
.rfm3 b{display:block;font-size:26px;font-weight:900;line-height:1}
.rfm3 span{font-size:14px}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}
.pdots{display:flex;gap:6px}
.pdots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.pdots i.on{background:var(--blue)}
.ctrl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ctrl div{background:var(--bg);border-radius:12px;padding:12px;font-size:15px}
.ctrl kbd{display:inline-block;border:1px solid var(--ink3);border-bottom-width:3px;border-radius:5px;padding:0 6px;font-size:13px;font-family:inherit;background:#fff;margin:0 1px}
.note{font-size:12px;color:var(--ink3);margin-top:14px}

/* ---------- game screen ---------- */
#game{position:fixed;inset:0;top:calc(48px + env(safe-area-inset-top));display:grid}
#game.wide{grid-template-columns:minmax(0,1fr) 360px}
#game.tall{grid-template-rows:auto minmax(0,1fr)}
.hud{background:#fff;border-bottom:1px solid var(--line);padding:8px 12px;display:flex;gap:8px;align-items:center}
#game.wide .hud{display:none}
.obj{flex:1;min-width:0;font-weight:800;font-size:15px;line-height:1.35}
.obj small{display:block;font-weight:400;color:var(--ink3);font-size:12px}
.goBtn{border:0;border-radius:10px;background:var(--navy);color:#fff;font-weight:800;padding:8px 12px;min-height:40px;cursor:pointer;white-space:nowrap}
.goBtn[disabled]{background:#b8c0cc}
.stagewrap{position:relative;overflow:hidden;background:#d9c7a8;touch-action:none}
.stage{position:absolute;left:0;top:0;transform-origin:0 0;transition:transform .35s ease}
.stage svg.floor{position:absolute;left:0;top:0}
.ent{position:absolute;left:0;top:0;will-change:transform;pointer-events:none}
.person{width:56px;height:76px;margin-left:-28px;margin-top:-66px;position:relative}
.person svg{width:56px;height:62px;display:block}
.person .tag{position:absolute;left:50%;top:60px;transform:translateX(-50%);background:rgba(16,42,86,.88);color:#fff;font-size:12px;font-weight:700;border-radius:6px;padding:0 6px;white-space:nowrap}
.person.me .tag{background:var(--blue)}
.carry{position:absolute;right:-12px;top:22px;width:24px;height:16px;border-radius:3px;background:#c98a3b;border:2px solid #fff;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.bang{position:absolute;left:50%;top:-34px;transform:translateX(-50%);width:28px;height:28px;border-radius:50%;background:#f2b705;color:#1b2433;font-weight:900;display:grid;place-items:center;font-size:18px;box-shadow:0 2px 6px rgba(0,0,0,.25);animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translate(-50%,-5px)}}
.patience{position:absolute;left:50%;top:-8px;transform:translateX(-50%);width:44px;height:6px;border-radius:3px;background:rgba(0,0,0,.18);overflow:hidden}
.patience u{display:block;height:100%;background:#2fa35a;text-decoration:none}
.patience.low u{background:#d9822b}
.marker{position:absolute;left:0;top:0;pointer-events:none}
.marker .bang{top:-46px}
.ring{position:absolute;left:-40px;top:-40px;width:80px;height:80px;border-radius:50%;border:3px dashed #f2b705;animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tapdot{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;border:3px solid var(--navy);opacity:.8;pointer-events:none;animation:ping .5s ease-out forwards}
@keyframes ping{to{transform:scale(2.2);opacity:0}}

/* side panel / bottom sheet */
.side{background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
#game.tall .side{position:fixed;left:0;right:0;bottom:0;max-height:62vh;border-left:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -8px 24px rgba(0,0,0,.12);padding:12px 14px calc(14px + env(safe-area-inset-bottom));z-index:30}
#game.tall .side.idle{max-height:none}
#game.tall .side.idle .sidebody{display:none}
#game.tall .side .objbox{display:none}
.grab{display:none;width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 2px}
#game.tall .grab{display:block}
.objbox{background:var(--bg);border-radius:12px;padding:10px 12px}
.objbox .obj{font-size:16px}
.objbox .goBtn{margin-top:8px;width:100%}
.ctl-hint{font-size:12px;color:var(--ink3)}
.crm{border:1px solid var(--line);border-radius:14px;padding:12px}
.crm-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.crm-h b{font-size:17px}
.seglabel{font-size:12px;font-weight:800;border-radius:999px;padding:2px 9px;color:#fff;background:var(--c5)}
.seglabel.v1,.seglabel.v2,.seglabel.v3{color:var(--ink)}
.crm-grid{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:10px;margin-top:8px;align-items:center}
.crm dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 8px;font-size:14px}
.crm dt{color:var(--blue);font-weight:800}
.crm dd{margin:0;font-variant-numeric:tabular-nums}
.crm .memo{margin-top:8px;font-size:13px;color:var(--ink2);background:var(--bg);border-radius:8px;padding:6px 8px}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;width:92px}
.mini i{aspect-ratio:1;border-radius:3px;position:relative}
.mini i.on::after{content:"";position:absolute;inset:25%;border-radius:50%;background:#f2b705;border:2px solid #fff}
.mini i.from::after{content:"";position:absolute;inset:30%;border-radius:50%;background:transparent;border:2px dashed #fff}
.say{background:var(--bg);border-radius:14px 14px 14px 4px;padding:10px 12px;font-size:15px}
.say b{display:block;font-size:12px;color:var(--ink3)}
.opts{display:grid;gap:8px}
.opt{border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;text-align:left;cursor:pointer;min-height:var(--tap);font-size:15px}
.opt:hover{border-color:var(--blue)}
.opt.picked.good{border-color:var(--good);background:var(--good-wash)}
.opt.picked.bad{border-color:var(--bad);background:var(--bad-wash)}
.opt.picked.ok{border-color:var(--warn);background:#fff6e6}
.fb{border-radius:12px;padding:10px 12px;font-size:15px;background:var(--blue-wash)}
.fb.good{background:var(--good-wash)}
.fb.bad{background:var(--bad-wash)}
.fb.ok{background:#fff6e6}
.shelf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.box{border:0;border-radius:10px;background:#c98a3b;color:#fff;padding:10px;min-height:64px;cursor:pointer;text-align:left;box-shadow:inset 0 -6px 0 rgba(0,0,0,.15)}
.box b{display:block;font-size:14px}
.box span{display:block;font-size:20px;font-weight:900;font-variant-numeric:tabular-nums}
.box:hover{background:#b9782b}
.need{background:#fff6e6;border-radius:10px;padding:8px 10px;font-size:14px}
.need b{font-weight:900}
.scanfx{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;align-items:center}
.scanfx svg{width:110px;height:auto}
.scanline{animation:scan 1.2s ease-in-out 2}
@keyframes scan{0%{transform:translateY(0)}50%{transform:translateY(150px)}100%{transform:translateY(0)}}
.stars{color:#e0a800;font-size:18px;letter-spacing:2px}
.stars s{color:#d3cfc6;text-decoration:none}
.toast{position:fixed;left:50%;top:calc(124px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--navy);color:#fff;border-radius:12px;padding:8px 14px;font-size:14px;z-index:50;box-shadow:0 6px 18px rgba(0,0,0,.2);max-width:92vw}

/* ---------- report ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.kpi span{display:block;font-size:13px;color:var(--ink2)}
.kpi b{display:block;font-size:clamp(22px,4.6vw,28px);font-weight:900;color:var(--navy);white-space:nowrap}
.rep{margin:0;padding:0;list-style:none}
.rep li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:12px 0;border-top:1px solid var(--line2)}
.rep li:first-child{border-top:0}
.rep .who{font-weight:800}
.rep .mv{grid-column:1/-1;display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink2);flex-wrap:wrap}
.rep .mv .mini{width:66px}
ol.qs{margin:8px 0 0;padding-left:1.3em}
ol.qs li{margin:12px 0}
ol.qs small{display:block;color:var(--ink3);font-size:12px}

/* ---------- device adaptation ---------- */
@media (pointer:coarse){:root{--tap:48px}}
@media (max-width:640px){
  .intro-hero{grid-template-columns:minmax(0,1fr) 96px;gap:10px}
  .intro-hero svg{max-width:96px}
  .facts,.rfm3{grid-template-columns:minmax(0,1fr)}
  .journey{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ctrl{grid-template-columns:minmax(0,1fr)}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .top .name{font-size:14px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="name" id="appname"></div>
  <div class="clock hide" id="clock"></div>
  <div class="lang" role="group" aria-label="Language 語言">
    <button type="button" data-lang="zh">中文</button>
    <button type="button" data-lang="en">EN</button>
  </div>
</header>
<div id="page"></div>
<div id="game" class="hide">
  <div class="hud"><div class="obj" id="hudObj"></div><button type="button" class="goBtn" id="hudGo"></button></div>
  <div class="stagewrap" id="wrap"><div class="stage" id="stage"></div></div>
  <aside class="side" id="side" aria-live="polite"></aside>
</div>

<script>
(() => {
'use strict';
const TOUCH = window.matchMedia ? window.matchMedia('(pointer:coarse)').matches : false;

/* ============================================================
   COPY — every word on screen, 繁體中文 and English
   ============================================================ */
const T = {
  zh: {

/* ============================================================
   LAYOUT — choose landscape or portrait, scale the stage to fit
   ============================================================ */
function chooseLayout() {
  const w = innerWidth, h = innerHeight;
  return (w >= 900 && w >= h * 1.05) ? 'wide' : 'tall';
}
function applyLayout(keepPos) {
  const prev = L, name = chooseLayout();
  const game = $('game');
  game.classList.toggle('wide', name === 'wide'); game.classList.toggle('tall', name === 'tall');
  if (G && keepPos && prev !== LAYOUT[name]) {   // carry positions across layouts by station
    G.me.x = G.me.x / prev.W * LAYOUT[name].W; G.me.y = G.me.y / prev.H * LAYOUT[name].H;
    if (G.c) { G.c.x = G.c.x / prev.W * LAYOUT[name].W; G.c.y = G.c.y / prev.H * LAYOUT[name].H; }
    G.me.tx = null; G.me.follow = false;
  }
  layoutName = name; L = LAYOUT[name];
  const stage = $('stage');
  stage.style.width = L.W + 'px'; stage.style.height = L.H + 'px';
  stage.innerHTML = storeSvg() + entityHtml();
  if (G && G.me.carry) $('carry').classList.remove('hide');
  if (G && G.c) { $('eC').classList.remove('hide'); $('cFig').innerHTML = figure(G.c.color); $('cTag').textContent = t().cust[G.c.id].name; }
  fit();
  if (G) { G.c && G.c.dest && (G.c.tx = spot(G.c.dest)[0], G.c.ty = spot(G.c.dest)[1]); drawEntities(); updateMarker(); }
}
let idleH = 34;
function fit() {
  const wrap = $('wrap'), r = wrap.getBoundingClientRect(), side = $('side');
  let avH = r.height;
  if (layoutName === 'tall') {
    if (side.classList.contains('idle')) idleH = side.getBoundingClientRect().height || idleH;
    avH = Math.max(200, innerHeight - r.top - idleH);
  }
  scale = Math.min(r.width / L.W, avH / L.H);
  const ox = (r.width - L.W * scale) / 2;
  let oy = Math.max(0, (avH - L.H * scale) / 2);
  // phones: when the bottom sheet is up, slide the store so the action stays in view
  if (layoutName === 'tall' && G && G.panel) {
    const vis = side.getBoundingClientRect().top - r.top;
    const pts = [[G.me.x, G.me.y]]; if (G.c) pts.push([G.c.x, G.c.y]);
    const fy = pts.reduce((a, q) => a + q[1], 0) / pts.length - 30;
    if (vis < L.H * scale) oy = Math.min(0, Math.max(vis - L.H * scale, vis / 2 - fy * scale));
  }
  const st = $('stage');
  st.style.transform = `translate(${ox}px, ${oy}px) scale(${scale})`;
  st.dataset.ox = ox; st.dataset.oy = oy;
}
function spot(name) {
  if (name === 'browse' || name === 'door' || name === 'start') return L[name];
  const [x, y] = L[name], d = NEAR[name] || [0, 0];
  return [x + d[0], y + d[1]];
}

/* ============================================================
   THE DAY
   ============================================================ */
function openStore() {
  G = newDay(); view = 'game';
  render();
  G.me.x = L.start[0]; G.me.y = L.start[1];
  drawEntities();
  nextCustomer();
  loop();
}
function nextCustomer() {
  G.i++;
  if (G.i >= CUSTOMERS.length) { G.step = 'closed'; G.c = null; $('eC').classList.add('hide'); G.clock = 20 * 60; panel(); updateMarker(); return; }
  const c = CUSTOMERS[G.i];
  G.c = { id: c.id, color: c.color, x: L.door[0], y: L.door[1], dest: 'browse', tx: L.browse[0], ty: L.browse[1], def: c };
  G.clock = c.time; G.step = 'greet'; G.patience = PATIENCE; G.greeted = false; G.cur = { id: c.id, stars: [0, 0, 0], tries: 0, scanned: false, approach: null, pick: null, follow: null, left: false, know: c.known ? Object.assign({}, c.known) : null };
  $('eC').classList.remove('hide'); $('cFig').innerHTML = figure(c.color); $('cTag').textContent = t().cust[c.id].name;
  toast(t().arrive(t().cust[c.id].name));
  panel(); updateMarker(); drawEntities();
}
function objectivePos() {
  if (!G || !G.c) return null;
  if (G.step === 'greet') return [G.c.x, G.c.y];
  const st = { scan: 'scan', fetch: 'stock', try: 'bench', pay: 'pos' }[G.step];
  return st ? [L[st][0] + STAND[st][0], L[st][1] + STAND[st][1]] : null;
}
function objectiveText() {
  const X = t();
  if (!G) return '';
  if (G.step === 'closed') return X.closeH;
  if (!G.c) return X.objWait;
  const nm = X.cust[G.c.id].name, d = G.c.def;
  if (G.step === 'greet') return X.objGreet(nm);
  if (G.step === 'scan') return X.objScan(nm);
  if (G.step === 'fetch') { const k = G.cur.know; return X.objFetch(X.shoe[d.need.shoe], k ? k.size : '?'); }
  if (G.step === 'try') return X.objTry(nm);
  if (G.step === 'pay') return X.objPay(nm);
  return X.objWait;
}
function goTarget() {
  const p = objectivePos(); if (!p) return null;
  return G.step === 'greet' ? [p[0] + (p[0] > L.W / 2 ? -46 : 46), p[1] + 12] : p;
}
function startGo() { if (!G || G.panel) return; const p = goTarget(); if (p) { G.me.follow = true; G.me.tx = p[0]; G.me.ty = p[1]; keys.clear(); } }
function moveCustomerTo(dest) { G.c.dest = dest; const p = spot(dest); G.c.tx = p[0]; G.c.ty = p[1]; }
function setStep(step) {
  G.step = step; G.panel = null; G.clock += 10;
  if (step === 'scan') moveCustomerTo('scan');
  if (step === 'try') moveCustomerTo('bench');
  if (step === 'pay') moveCustomerTo('pos');
  panel(); updateMarker();
}
function arrive() {
  if (!G || G.panel || !G.c) return;
  const p = objectivePos(); if (!p) return;
  if (Math.hypot(G.me.x - p[0], G.me.y - p[1]) > REACH) return;
  // customers must have walked over too
  if (G.step !== 'greet' && G.step !== 'fetch' && Math.hypot(G.c.x - G.c.tx, G.c.y - G.c.ty) > 8) return;
  G.me.tx = null; G.me.follow = false; keys.clear();
  G.panel = G.step; panel(); updateMarker();
}

/* ---------- step actions ---------- */
function chooseApproach(k) {
  const c = G.c.def, cur = G.cur;
  if (cur.approach) return;
  cur.approach = k;
  const good = k === c.good;
  cur.stars[0] = good && G.patience > 0 ? 1 : 0;
  if (c.leaveOn.includes(k)) { cur.left = true; }
  else if (good && c.scanNeeded) { cur.nextStep = 'scan'; }
  else { cur.nextStep = 'fetch'; }
  panel(true);
}
function afterApproach() {
  const cur = G.cur;
  if (cur.left) { customerLeaves(); return; }
  setStep(cur.nextStep);
}
function doScan() {
  const c = G.c.def; G.cur.scanned = true; G.data++;
  G.cur.know = { size: c.scanned ? c.scanned.size : c.known.size, age: 0, arch: c.scanned ? c.scanned.arch : c.known.arch };
  G.panel = 'scanning'; panel();
  setTimeout(() => { if (G && G.panel === 'scanning') { G.panel = 'scanned'; panel(); } }, matchMedia('(prefers-reduced-motion:reduce)').matches ? 50 : 1300);
}
function pickBox(i) {
  const c = G.c.def; G.cur.pick = c.shelf[i]; G.me.carry = c.shelf[i]; G.cur.tries++;
  $('carry').classList.remove('hide');
  setStep('try');
}
function tryOn() {
  const c = G.c.def, p = G.cur.pick, ok = p[0] === c.need.shoe && p[1] === c.need.size;
  G.me.carry = null; $('carry').classList.add('hide');
  if (ok) { if (G.cur.tries === 1) G.cur.stars[1] = 1; G.cur.tryResult = 'ok'; }
  else if (c.scanNeeded && !G.cur.scanned) G.cur.tryResult = 'stale';
  else G.cur.tryResult = p[0] !== c.need.shoe ? 'model' : 'size';
  G.panel = 'tried'; panel();
}
function afterTry() {
  const r = G.cur.tryResult;
  if (r === 'ok') setStep('pay');
  else if (r === 'stale') setStep('scan');
  else setStep('fetch');
}
function chooseFollow(k) {
  const c = G.c.def, cur = G.cur;
  if (cur.follow) return;
  cur.follow = k; cur.stars[2] = k === c.best ? 1 : 0;
  const price = Math.round(PRICE[c.need.shoe] * (cur.approach === 'discount' ? 0.8 : 1));
  cur.price = price; G.sales += price;
  cur.after = segOf(0, c.f + 1, c.m + price);
  panel(true);
}
function customerLeaves() {
  const c = G.c.def, cur = G.cur;
  cur.after = cur.after || (cur.scanned ? segOf(0, c.f + 1, c.m) : c.seg);
  G.res.push(cur);
  moveCustomerTo('door');
  G.step = 'leaving'; G.panel = null; panel(); updateMarker();
}
function customerGone() {
  $('eC').classList.add('hide'); G.c = null; G.step = 'between';
  panel(); updateMarker();
  setTimeout(() => { if (G && view === 'game' && G.step === 'between') nextCustomer(); }, 900);
}

    const cur = G.cur;
    body = crmCard() + `<div class="say"><b>${cx.name}</b>${cx.say}</div>${G.patience <= 0 && !cur.approach ? `<div class="fb bad">${X.patienceGone}</div>` : ''}<p style="font-weight:800">${X.howGreet}</p>
      <div class="opts">${c.opts.map(k => `<button type="button" class="opt ${cur.approach === k ? 'picked ' + (k === c.good ? 'good' : 'bad') : ''}" data-act="appr" data-v="${k}" ${cur.approach ? 'disabled' : ''}>${cx.opts[k]}</button>`).join('')}</div>
      ${cur.approach ? `<div class="fb ${cur.approach === c.good ? 'good' : 'bad'}">${cx.fb[cur.approach]}</div><button type="button" class="btn" data-act="afterAppr">${cur.left ? X.bye : X.next}</button>` : ''}`;
  } else if (P === 'scan') {
    body = crmCard() + `<button type="button" class="btn" data-act="scan">${X.st.scan}</button>`;
    setTimeout(() => { if (G && G.panel === 'scan') doScan(); }, 10);
  } else if (P === 'scanning' || P === 'scanned') {
    const k = G.cur.know;
    body = `<div class="scanfx">${FOOT_SVG(k.arch)}<div><p style="font-weight:800">${P === 'scanning' ? X.scanH : X.scanDone(k.size, X.arch[k.arch])}</p>${P === 'scanned' ? `<p class="small" style="margin-top:6px">${cx.name}</p>` : ''}</div></div>
      ${P === 'scanned' ? `<button type="button" class="btn" data-act="toFetch">${X.contShelf}</button>` : ''}`;
  } else if (P === 'fetch') {
    const k = G.cur.know;
    body = `<h2 style="font-size:18px">${X.shelfH}</h2><div class="need">${X.needLine(X.shoe[c.need.shoe], k ? k.size : '?')}</div>
      <div class="shelf">${c.shelf.map((b, i) => `<button type="button" class="box" data-act="box" data-v="${i}"><b>${X.shoe[b[0]]}</b><span>${b[1]}</span></button>`).join('')}</div>`;
  } else if (P === 'try') {
    body = `<div class="say"><b>${cx.name}</b>…</div><button type="button" class="btn" data-act="tryon">${X.st.bench}</button>`;
    setTimeout(() => { if (G && G.panel === 'try') tryOn(); }, 10);
  } else if (P === 'tried') {
    const r = G.cur.tryResult;
    const msg = { ok: X.tryOk, size: X.tryBadSize, model: X.tryBadModel, stale: X.tryStale }[r];
    body = `<div class="fb ${r === 'ok' ? 'good' : 'bad'}">${msg}</div><button type="button" class="btn" data-act="afterTry">${r === 'ok' ? X.objPay(cx.name) : r === 'stale' ? X.rescan : X.refetch}</button>`;
  } else if (P === 'pay') {
    const cur = G.cur;
    const price = Math.round(PRICE[c.need.shoe] * (cur.approach === 'discount' ? 0.8 : 1));
    body = `<h2 style="font-size:18px">${X.payH(cx.name)}</h2><p style="font-variant-numeric:tabular-nums">${X.price(X.shoe[c.need.shoe], nf(price))}${cur.approach === 'discount' ? X.discountNote : ''}</p>
      <p style="font-weight:800">${X.followH}</p>
      <div class="opts">${FOLLOW.map(k => `<button type="button" class="opt ${cur.follow === k ? 'picked ' + (k === c.best ? 'good' : k === 'coupon' ? 'bad' : 'ok') : ''}" data-act="follow" data-v="${k}" ${cur.follow ? 'disabled' : ''}>${X.follow[k]}</button>`).join('')}</div>
      ${cur.follow ? `<div class="fb ${cur.follow === c.best ? 'good' : cur.follow === 'coupon' ? 'bad' : 'ok'}">${cur.follow === c.best ? cx.followWhy : cur.follow === 'coupon' ? X.followCoupon : X.followOk}</div>
        <div class="crm" style="display:flex;gap:12px;align-items:center">${mini(c.seg, cur.after)}<div><p style="font-size:14px">${X.crmUpd(nf(cur.price))}</p><p style="font-weight:800">${X.segMove(X.seg[c.seg], X.seg[cur.after])}</p></div></div>
        <button type="button" class="btn" data-act="bye">${X.bye}</button>` : ''}`;
  } else if (G.c && G.step === 'greet') {
    body = crmCard();
  } else if (G.c && G.step !== 'leaving') {
    body = crmCard();
  }
  const idle = !P && G.step !== 'closed';
  side.classList.toggle('idle', idle);
  side.innerHTML = `<div class="grab"></div><div class="objbox"><div class="obj">${esc(obj)}</div><p class="ctl-hint">${TOUCH ? X.hintTouch : X.hintMouse}</p><button type="button" class="goBtn" data-act="go" ${canGo ? '' : 'disabled'}>${X.goto}</button></div><div class="sidebody stack">${body}</div>`;
  if (toEnd) requestAnimationFrame(() => { const last = side.querySelector('.sidebody > :last-child'); if (last) last.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); });
  if (layoutName === 'tall') requestAnimationFrame(fit);
}
function toast(msg) {
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg; el.setAttribute('role', 'status');
  document.body.appendChild(el); setTimeout(() => el.remove(), 2200);
}

/* ============================================================
   MOVEMENT LOOP
   ============================================================ */
function drawEntities() {
  if (!G) return;
  const me = $('eMe'); if (me) me.style.transform = `translate(${G.me.x}px, ${G.me.y}px)`;
  const ce = $('eC'); if (ce && G.c) ce.style.transform = `translate(${G.c.x}px, ${G.c.y}px)`;
  const pat = $('pat');
  if (pat) {
    const show = G.c && G.step === 'greet' && !G.cur.approach;
    pat.classList.toggle('hide', !show);
    if (show) { const f = Math.max(0, G.patience / PATIENCE); pat.firstChild.style.width = (f * 100) + '%'; pat.classList.toggle('low', f < 0.35); }
  }
}
function updateMarker() {
  const mk = $('mk'); if (!mk) return;
  const p = objectivePos();
  if (!p || G.panel) { mk.classList.add('hide'); return; }
  mk.classList.remove('hide');
  mk.style.transform = `translate(${p[0]}px, ${p[1] - (G.step === 'greet' ? 40 : 30)}px)`;
}
function step(dt) {
  if (!G) return;
  // keyboard
  if (!G.panel && keys.size) {
    let vx = 0, vy = 0;
    if (keys.has('left')) vx -= 1; if (keys.has('right')) vx += 1; if (keys.has('up')) vy -= 1; if (keys.has('down')) vy += 1;
    const n = Math.hypot(vx, vy) || 1;
    G.me.x += vx / n * SPEED * dt; G.me.y += vy / n * SPEED * dt; G.me.tx = null;
  } else if (G.me.tx != null) {
    if (G.me.follow && !G.panel) { const p = goTarget(); if (p) { G.me.tx = p[0]; G.me.ty = p[1]; } }
    const dx = G.me.tx - G.me.x, dy = G.me.ty - G.me.y, d = Math.hypot(dx, dy);
    if (d < 4) { G.me.tx = null; } else { const s = Math.min(d, SPEED * dt); G.me.x += dx / d * s; G.me.y += dy / d * s; }
  }
  G.me.x = Math.max(24, Math.min(L.W - 24, G.me.x)); G.me.y = Math.max(70, Math.min(L.H - 14, G.me.y));
  // customer
  if (G.c && G.c.tx != null) {
    const dx = G.c.tx - G.c.x, dy = G.c.ty - G.c.y, d = Math.hypot(dx, dy);
    if (d > 2) { const s = Math.min(d, SPEED * 0.75 * dt); G.c.x += dx / d * s; G.c.y += dy / d * s; }
    else if (G.step === 'leaving') { customerGone(); }
  }
  if (G.c && G.step === 'greet' && !G.cur.approach && !G.panel) G.patience = Math.max(0, G.patience - dt);
  if (G.marker !== G.step) { G.marker = G.step; updateMarker(); }
  if (G.step === 'greet' && !G.panel) updateMarker();
  drawEntities();
  arrive();
}
function loop() {
  cancelAnimationFrame(raf);
  lastT = performance.now();
  const tick = now => { const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now; if (view === 'game') { step(dt); raf = requestAnimationFrame(tick); } };
  raf = requestAnimationFrame(tick);
}

/* ============================================================
   RENDER + INPUT
   ============================================================ */
function render() {
  const X = t();
  document.documentElement.lang = LANG === 'zh' ? 'zh-Hant' : 'en';
  document.title = X.app; $('appname').textContent = X.app;
  document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === LANG)));
  const inGame = view === 'game';
  $('game').classList.toggle('hide', !inGame); $('page').classList.toggle('hide', inGame); $('clock').classList.toggle('hide', !inGame);
  if (inGame) { applyLayout(true); panel(); }
  else {
    document.querySelectorAll('.toast').forEach(el => el.remove());
    $('page').innerHTML = view === 'intro' ? vIntro() : view === 'ctrl' ? vControls() : view === 'report' ? vReport() : vTalk();
    window.scrollTo(0, 0);
    const h = document.querySelector('#page h1, #page h2'); if (h) h.focus({ preventScroll: true });
  }
}
function summary() {
  const X = t(), k = totals();
  const lines = [`${X.app}`, `${X.kStars} ${X.starsOf(k.stars, k.max)} | ${X.kSales} NT$${nf(k.sales)} | ${X.kData} ${k.data} | ${X.kBook} ${k.booked}`];
  for (const x of G.res) { const c = CUSTOMERS.find(y => y.id === x.id); lines.push(`${X.cust[x.id].name}: ${'★'.repeat(x.stars.reduce((a, b) => a + b, 0))}${'☆'.repeat(3 - x.stars.reduce((a, b) => a + b, 0))} ${x.left ? X.leftEarly : X.segMove(X.seg[c.seg], X.seg[x.after])}`); }
  return lines.join('\n');
}
document.addEventListener('click', e => {
  const lb = e.target.closest('[data-lang]');
  if (lb) { LANG = lb.dataset.lang; try { localStorage.setItem('aso-store.lang', LANG); } catch (er) { /* no storage */ } render(); return; }
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const a = el.dataset.act, v = el.dataset.v;
  if (a === 'slide') { slide = +v; view = 'intro'; render(); return; }
  if (a === 'ctrl') { view = 'ctrl'; render(); return; }
  if (a === 'open') { openStore(); return; }
  if (a === 'report') { view = 'report'; render(); return; }
  if (a === 'talk') { view = 'talk'; render(); return; }
  if (a === 'again') { G = null; view = 'ctrl'; render(); return; }
  if (a === 'copy') { const m = $('copymsg'); (navigator.clipboard ? navigator.clipboard.writeText(summary()) : Promise.reject()).then(() => { m.textContent = t().copied; }, () => { m.textContent = summary(); }); return; }
  if (!G) return;
  if (a === 'go') { startGo(); return; }
  if (a === 'appr') return chooseApproach(v);
  if (a === 'afterAppr') return afterApproach();
  if (a === 'scan') return doScan();
  if (a === 'toFetch') return setStep('fetch');
  if (a === 'box') return pickBox(+v);
  if (a === 'tryon') return tryOn();
  if (a === 'afterTry') return afterTry();
  if (a === 'follow') return chooseFollow(v);
  if (a === 'bye') return customerLeaves();
});
$('hudGo').addEventListener('click', startGo);
// tap or click on the floor to walk there
$('wrap').addEventListener('pointerdown', e => {
  if (!G || G.panel || view !== 'game') return;
  const st = $('stage'), r = $('wrap').getBoundingClientRect();
  const x = (e.clientX - r.left - (+st.dataset.ox || 0)) / scale, y = (e.clientY - r.top - (+st.dataset.oy || 0)) / scale;
  if (x < 0 || y < 0 || x > L.W || y > L.H) return;
  G.me.tx = x; G.me.ty = y; G.me.follow = false;
  const dot = document.createElement('div'); dot.className = 'tapdot'; dot.style.left = (e.clientX - r.left) + 'px'; dot.style.top = (e.clientY - r.top) + 'px';
  $('wrap').appendChild(dot); setTimeout(() => dot.remove(), 520);
});
const KEYMAP = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down', a: 'left', d: 'right', w: 'up', s: 'down', A: 'left', D: 'right', W: 'up', S: 'down' };
addEventListener('keydown', e => {
  if (view !== 'game' || !G) return;
  if (e.target.closest && e.target.closest('input,textarea')) return;
  const k = KEYMAP[e.key];
  if (k && !G.panel) { keys.add(k); e.preventDefault(); }
  if (k) G.me.follow = false;
  if (e.key === 'e' || e.key === 'E') startGo();
});
addEventListener('keyup', e => { const k = KEYMAP[e.key]; if (k) keys.delete(k); });
addEventListener('blur', () => keys.clear());
let rz = 0;
addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (view === 'game') { applyLayout(true); panel(); } }, 120); });
render();
window.__store = { get G() { return G; }, get view() { return view; }, get layout() { return layoutName; }, CUSTOMERS, segOf };
})();
</script>
