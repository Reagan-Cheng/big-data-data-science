      <div class="opts two" role="radiogroup" aria-label="${esc(t('q1Title'))}">
        ${['M', 'F', 'R', 'X'].map(k => `<label class="opt"><input type="radio" name="q1" value="${k}" data-bind="q1.list"${S.q1.list === k ? ' checked' : ''}><strong>${o[k][0]}</strong><span>${o[k][1]}</span></label>`).join('')}
      </div>
      ${whyField('q1')}
      ${commit('lock:q1', t('lockQ', 1))}`;
  }
  function tiles(list) {
    return `<div class="tiles">${list.map(x => `<div class="tile"><div class="t-label">${x[0]}</div><div class="t-val">${x[1]}</div>${x[2] ? `<div class="t-sub">${x[2]}</div>` : ''}</div>`).join('')}</div>`;
  }
  function vQ1r() {
    const r = SIM.res[0];
    const p = Math.round(100 * r.redeemed / Math.max(1, r.coupons));
    return head(t('q1Period'), t('q1ResTitle')) + `<div style="margin-top:1.4rem">` + tiles([
      [t('tSent'), nf(r.coupons)], [t('tRedeemed'), nf(r.redeemed), p + '%'], [t('tRevenue'), money(r.revenue)],
      [t('tCampaign'), money(r.campaign)], [t('tProfit'), money(r.profit)]
    ]) + `</div><p class="callout">${t('q1Comment', p)}</p>${r.active < SIM.start.active ? `<p class="callout">${t('q1Active', nf(SIM.start.active - r.active))}</p>` : ''}` + gateBtn(t('toQ', 2));
  }

  /* ---------- RFM exercise ---------- */
  function person(i) {
    const p = PEOPLE[i];
    const days = Math.round((Date.parse(Q_START[1] + 'T00:00:00Z') - Date.parse(p.last + 'T00:00:00Z')) / dayMs);
    const R = E.rScore(days), F = E.fScore(p.orders), M = E.mScore(p.spend);
    return { i, name: T.people[L()][i], days, R, F, M, FM: Math.round((F + M) / 2), seg: E.segmentOf(R, F, M), p };
  }
  function vQ2x() {
    const ex = S.ex, ppl = PEOPLE.map((_, i) => person(i));
    const scRows = S.lang === 'zh' ? T.scRowsZh : T.scRows;
    const card = x => {
      const a = ex.ans[x.i] || '';
      const ok = a === x.seg;
      return `<div class="person">
        <h3>${x.name}</h3>
        <dl><dt>${t('pLast')}</dt><dd>${fmtDate(new Date(x.p.last + 'T00:00:00Z'))}<br><span class="small">${t('pDays', x.days)}</span></dd>
            <dt>${t('pOrders')}</dt><dd>${x.p.orders}</dd><dt>${t('pSpend')}</dt><dd>${money(x.p.spend)}</dd></dl>
        <div class="small">${t('pTimeline')}</div>
        <div class="tl" role="img" aria-label="${esc(t('pTimeline'))}: ${x.p.tl.join(', ')}">${x.p.tl.map(n => `<i class="${n ? 'on' : ''}">${n}</i>`).join('')}</div>
        <div class="tl-ax" aria-hidden="true">${TL_AXIS.map(a => `<span>${a[0]}<br>${a[1]}</span>`).join('')}</div>
        <select data-bind="ex.ans.${x.i}" aria-label="${esc(t('pSegLabel', x.name))}"${ex.checked ? ' disabled' : ''}>
          <option value="">${t('pChoose')}</option>${E.SEGS.map(s => `<option value="${s}"${a === s ? ' selected' : ''}>${segName(s)}</option>`).join('')}
        </select>
        ${ex.checked ? `<p class="fb ${ok ? 'ok' : 'no'}">${ok ? '✓' : '✗'} ${t('exFb', x.R, x.F, x.M, x.FM, segName(x.seg))}</p>` : ''}
      </div>`;
    };
    const nOk = ppl.filter(x => ex.ans[x.i] === x.seg).length;
    let odd = '';
    if (ex.checked) {
      odd = `<h2>${t('oddH')}</h2><p class="sub">${t('oddText')}</p>
        <div class="opts three" role="radiogroup" aria-label="${esc(t('oddH'))}">
          ${ppl.map(x => `<label class="opt${ex.oddDone ? ' locked' : ''}"><input type="radio" name="odd" value="${x.i}" data-bind="ex.odd"${ex.odd === x.i ? ' checked' : ''}${ex.oddDone ? ' disabled' : ''}><strong>${x.name}</strong><span>${segName(x.seg)}</span></label>`).join('')}
        </div>`;
      if (!ex.oddDone) odd += `<div class="commit"><button type="button" class="btn-ticket" data-act="lock:odd" data-label="${esc(t('oddLock'))}" data-arm="${esc(t('confirm'))}">${t('oddLock')}</button><button type="button" class="btn-ghost" data-act="next">${t('exNext')}</button><span class="msg" role="status" aria-live="polite">${esc(UI.msg)}</span></div>`;
      else odd += `<p class="verdict ${ex.odd === ODD_ANSWER ? '' : 'no'}">${ex.odd === ODD_ANSWER ? t('oddRight', E.seasonalCount(SIM.w)) : t('oddWrong')}</p>` + nextBtn(t('exNext'));
    }
    return head(t('q2Period'), t('exTitle'), t('exText')) + `
      <div class="cols" style="margin-top:.4rem">
        <section><h2>${t('scoreTableCap')}</h2><div class="block scroll"><table class="data">
          <thead><tr>${T.scHead[L()].map((h, i) => `<th${i ? '' : ' class="l"'}>${h}</th>`).join('')}</tr></thead>
          <tbody>${scRows.map(r => `<tr>${r.map((c, i) => i ? `<td>${c}</td>` : `<th>${c}</th>`).join('')}</tr>`).join('')}</tbody>
        </table><p class="tfoot">${t('fmNote')}</p></div></section>
        <section><h2>${t('segH')}</h2><dl class="defs">${E.SEGS.map(s => `<div><dt>${segName(s)}</dt><dd>${segDef(s)}</dd></div>`).join('')}</dl></section>
      </div>
      <h2>${t('exAsOf')}</h2>
      <div class="people">${ppl.map(card).join('')}</div>
      ${ex.checked ? `<p class="callout">${t('exScore', nOk)}</p>` : `<div class="commit"><button type="button" class="btn-plain" data-act="excheck">${t('exCheck')}</button></div>`}
      ${odd}`;
  }

  /* ---------- plan screens (Q2–Q4) ---------- */
  function planBlock(qn) {
    const d = S['q' + qn], tb = SIM.tabs[qn - 1], info = planInfo(qn);
    const maxN = Math.max(...E.SEGS.map(s => tb[s].n));
    const truth = hasTestInfo(qn);
    const stat = (b, i, cls, title) => `<div class="stat${cls ? ' ' + cls : ''}"${title ? ` title="${esc(title)}"` : ''}><b>${b}</b><i>${i}</i></div>`;
    const row = s => {
      const x = tb[s], locked = !!info.lock[s];
      const tac = (a, cost) => `<label><input type="radio" name="alloc-${s}" value="${a}" data-alloc="${s}"${d.alloc[s] === a ? ' checked' : ''}${locked ? ' disabled' : ''}><b>${tacName(a)}</b><small>${cost}</small></label>`;
      return `<div class="seg">
        <div class="seg-name"><strong>${segName(s)}</strong><span>${segDef(s)}</span></div>
        <div class="seg-stats">
          <div class="stat"><b>${nf(x.n)}</b><i>${t('sMembers')}</i><div class="bar" aria-hidden="true"><u style="width:${(100 * x.n / maxN).toFixed(1)}%"></u></div></div>
          ${stat(nf(x.days), t('sDays'))}
          ${stat(nf(x.m), t('sSpend'))}
          ${stat(pct(x.pCoupon), t('sRate'), 'hl', t('sRateTitle'))}
        </div>
        <div class="tactics${locked ? ' locked' : ''}" role="radiogroup" aria-label="${esc(segName(s))}">
          ${tac('none', t('free'))}${tac('perk', money(x.costPerk))}${tac('coupon', '≈ ' + money(x.costCoupon))}
        </div>
        ${locked ? `<div class="seg-note">${t('lockedRow')}</div>` : ''}
        ${truth ? `<div class="truth">
          ${stat(pct(x.pNone), t('trNone'))}
          ${stat(signed(x.incPerk * 100), t('trIncP'))}
          ${stat(signed(x.incCoupon * 100), t('trIncC'))}
          ${stat((x.valPerkPer < 0 ? '−' : '+') + 'NT$' + nf(Math.abs(x.valPerkPer)), t('trValP'))}
          ${stat((x.valCouponPer < 0 ? '−' : '+') + 'NT$' + nf(Math.abs(x.valCouponPer)), t('trValC'))}
        </div>` : ''}
      </div>`;
    };
    return `<h2>${t('planH')}</h2>
      ${truth ? `<p class="sub"><strong>${t('testH')}.</strong> ${t('testSub')}</p>` : ''}
      <div class="block">
        <div class="plan">${E.SEGS.map(row).join('')}</div>
        ${canTest(qn) ? `<label class="check"><input type="checkbox" data-test="q${qn}"${d.test ? ' checked' : ''}><div><strong>${t('testLabel')}</strong><span>${t('testDesc')}</span></div></label>` : ''}
        <div class="budget" id="budget">${budgetHtml(qn)}</div>
      </div>
      <p class="small" style="margin-top:.6rem;max-width:72ch">${t('costNote')}${SIM.w.filterSeasonal ? ' ' + t('filterNote', E.seasonalCount(SIM.w)) : ''}</p>`;
  }
  function budgetHtml(qn) {
    const i = planInfo(qn);
    const w = Math.min(100, 100 * i.total / i.budget);
    const fixed = [];
    if (i.fixedEvent) fixed.push(t('fixedLine', t('fixedEvent'), nf(i.fixedEvent)));
    if (i.fixedTest) fixed.push(t('fixedLine', t('fixedTest'), nf(i.fixedTest)));
    return `<div class="budget-row"><span>${t('budget')} <b>${money(i.budget)}</b></span><span>${t('planned')} <b>${money(i.total)}</b></span><span>${t('left')} <b>${money(i.budget - i.total)}</b></span></div>
      <div class="meter${i.over ? ' over' : ''}" role="img" aria-label="${esc(t('planned'))} ${nf(i.total)} / ${nf(i.budget)}"><u style="width:${w.toFixed(1)}%"></u></div>
      ${fixed.length ? `<p class="small" style="margin-top:.4rem">${fixed.join('　')}</p>` : ''}
      ${i.over ? `<p class="msg" style="margin-top:.4rem">${t('over', nf(i.total - i.budget))}</p>` : ''}`;
  }
  function moveBlock(qn) {
    const a = SIM.tabs[qn - 2], b = SIM.tabs[qn - 1];
    const m = E.migration(SIM.snaps[qn - 2], SIM.snaps[qn - 1]);
    const flows = [];
    for (const x of E.SEGS) for (const y of E.SEGS) if (x !== y && m[x][y] > 0) flows.push([m[x][y], x, y]);
    flows.sort((p, q) => q[0] - p[0]);
    const lines = flows.slice(0, 4).map(f => `<li>${t('moveLine', f[0], segName(f[1]), segName(f[2]))}</li>`);
    for (const y of E.SEGS) if (m.join[y] > 0) lines.push(`<li>${t('moveJoin', m.join[y], segName(y))}</li>`);
    return `<h2>${t('moveH')}</h2>
      <div class="cols">
        <div class="block scroll"><table class="data">
          <thead><tr><th>${t('cSeg')}</th><th>${t('mBefore')}</th><th>${t('mNow')}</th><th>${t('mChange')}</th></tr></thead>
          <tbody>${E.SEGS.map(s => `<tr><th>${segName(s)}</th><td>${nf(a[s].n)}</td><td>${nf(b[s].n)}</td><td>${signed(b[s].n - a[s].n)}</td></tr>`).join('')}</tbody>
        </table></div>
        <div><h3>${t('movesH')}</h3><ul class="plain">${lines.join('')}</ul></div>
      </div>`;
  }
  function q1Recap() {
    const r = SIM.res[0];
    return `<h2>${t('q1Recap')}</h2><p class="sub">${t('q1RecapSub')}</p>
      <div class="block scroll"><table class="data">
        <thead><tr><th>${t('cSeg')}</th><th>${t('rcSent')}</th><th>${t('rcRedeemed')}</th><th>${t('rcRate')}</th></tr></thead>
        <tbody>${E.SEGS.map(s => { const x = r.seg[s]; return `<tr><th>${segName(s)}</th><td>${nf(x.coupons)}</td><td>${nf(x.buyersT)}</td><td>${x.coupons ? pct(x.buyersT / x.coupons) : '–'}</td></tr>`; }).join('')}</tbody>
      </table></div>`;
  }
  function eventBlock() {
    const ev = SIM.event, x = T.events[L()][ev], tb = SIM.tabs[2];
    const meta = i => {
      const o = E.EVENTS[ev][i], parts = [];
      for (const s in o.lock) parts.push(o.lock[s] === 'none' ? t('setsNone', segName(s)) : t('setsTo', segName(s), tacName(o.lock[s]), nf(o.lock[s] === 'perk' ? tb[s].costPerk : tb[s].costCoupon)));
      if (o.fixed) parts.push(t(parts.length ? 'plusFixed' : 'usesFixed', nf(o.fixed)));
      if (!parts.length) parts.push(t('noCost'));
      return parts.join(' ');
    };
    return `<h2>${t('deskH')}</h2>
      <div class="event"><h3>${x.title}</h3><p>${x.story}</p></div>
      <h2>${t('respH')}</h2>
      <div class="opts three" role="radiogroup" aria-label="${esc(t('respH'))}">
        ${x.opts.map((o, i) => `<label class="opt"><input type="radio" name="ev" value="${i}" data-ev="${i}"${S.q3.ev === i ? ' checked' : ''}><strong>${o[0]}</strong><span>${o[1]}</span><em>${meta(i)}</em></label>`).join('')}
      </div>`;
  }
  function vPlan(qn) {
    if (qn === 2) return head(t('q2Period'), t('q2Title'), t('q2Text')) + q1Recap() + planBlock(2) + whyField('q2') + commit('lock:q2', t('lockQ', 2));
    if (qn === 3) return head(t('q3Period'), t('q3Title'), t('q3Text')) + moveBlock(3) + eventBlock() + planBlock(3) + whyField('q3') + commit('lock:q3', t('lockQ', 3));
    return head(t('q4Period'), t('q4Title'), t('q4Text')) + moveBlock(4) + planBlock(4) + whyField('q4') + commit('lock:q4', t('lockQ', 4));
  }

  /* ---------- results (Q2–Q4) ---------- */
  function vRes(qn) {
    const r = SIM.res[qn - 1];
    const period = t(['q1Period', 'q2Period', 'q3Period', 'q4Period'][qn - 1]);
    const notes = [];
    const pts = { unfair: -5, discountBrand: -3, recogChamp: 3, recogLoyal: 2 };
    if (qn === 3) { const tr = (E.EVENTS[SIM.event][S.q3.ev].mods || {}).trust; if (tr) notes.push([tr, T.notes[L()].event]); }
    for (const k of r.notes) notes.push([pts[k], T.notes[L()][k]]);
    const noteHtml = notes.length
      ? notes.map(n => `<li><b class="${n[0] > 0 ? 'up' : 'down'}">${signed(n[0])} ${t('trustPts')}</b><span>${n[1]}</span></li>`).join('')
      : `<li><b>0 ${t('trustPts')}</b><span>${T.notes[L()].none}</span></li>`;
    const line = (label, v, cls) => `<tr${cls ? ` class="${cls}"` : ''}><th>${label}</th><td>${v}</td></tr>`;
    return head(period, t('resTitle', qn)) + `
      <div class="cols">
        <section><h2>${t('pnlH')}</h2><div class="block scroll"><table class="data"><tbody>
          ${line(t('pRevenue'), money(r.revenue))}
          ${line(t('pMargin'), money(r.revenue * E.P.margin))}
          ${line(t('pDiscount', nf(r.redeemed)), money(-r.discount))}
          ${line(t('pPerk', nf(r.perks)), money(-r.perk))}
          ${line(t('pMsg'), money(-r.msg))}
          ${r.fixed ? line(t('pFixed'), money(-r.fixed)) : ''}
          ${line(t('pProfit'), money(r.profit), 'total')}
        </tbody></table></div></section>
        <section><h2>${t('noticedH')}</h2><div class="block"><ul class="notes">${noteHtml}</ul></div>
          <ul class="plain small" style="margin-top:.7rem">${qn === 3 ? `<li>${t('lnyNote')}</li>` : ''}<li>${t('joinNote', r.joiners)}</li></ul></section>
      </div>
      <h2>${t('segResH')}</h2>
      <div class="block scroll"><table class="data">
        <thead><tr><th>${t('cSeg')}</th><th class="l">${t('cOffer')}</th><th>${t('cMembers')}</th><th>${t('cTargeted')}</th><th>${t('cOrdered')}</th><th>${t('cRate')}</th><th>${t('cCost')}</th></tr></thead>
        <tbody>${E.SEGS.map(s => { const x = r.seg[s]; return `<tr><th>${segName(s)}</th><td class="l">${tacName(r.alloc[s])}</td><td>${nf(x.n)}</td><td>${nf(x.targeted)}</td><td>${nf(x.buyers)}</td><td>${x.n ? pct(x.buyers / x.n) : '–'}</td><td>${nf(x.cost)}</td></tr>`; }).join('')}</tbody>
      </table>${r.targeted && (SIM.w.filterSeasonal || r.test) ? `<p class="tfoot">${t('recvNote')}</p>` : ''}</div>
      ${gateBtn(qn < 4 ? t('toQ', qn + 1) : t('toEnd'))}`;
  }

  /* ---------- debrief ---------- */
  let REFS = null;
  function refs() {
    if (!REFS || REFS.key !== JSON.stringify([S.q1, S.q2, S.q3, S.q4, S.ex, S.seed])) {
      REFS = { key: JSON.stringify([S.q1, S.q2, S.q3, S.q4, S.ex, S.seed]), runs: {} };
      for (const k in REF_SPECS) REFS.runs[k] = autoPlay(REF_SPECS[k]);
    }
    return REFS.runs;
  }
  const zh = () => S.lang === 'zh';
  const stop = () => (zh() ? '。' : '. ');
  const colon = () => (zh() ? '：' : ': ');
  const planText = a => E.SEGS.filter(s => a[s] !== 'none').map(s => `${segName(s)}${colon()}${tacName(a[s])}`).join(zh() ? '；' : '; ');
  function pathItems() {
    const ev = T.events[L()][SIM.event];
    const q = T.qShort[L()];
    return [
      [q[0], t('pathQ1', T.q1Opts[L()][S.q1.list][0]), S.q1.why],
      ['', t('pathOdd', S.ex.oddDone && S.ex.odd === ODD_ANSWER), ''],
      [q[1], t('pathPlan', planText(S.q2.alloc)) + (S.q2.test ? stop() + t('pathTest') : ''), S.q2.why],
      [q[2], t('pathEvent', ev.title, ev.opts[S.q3.ev][0]) + stop() + t('pathPlan', planText(S.q3.alloc)) + (S.q3.test ? stop() + t('pathTest') : ''), S.q3.why],
      [q[3], t('pathPlan', planText(S.q4.alloc)), S.q4.why]
    ];
  }
  function vEnd() {
    const R = refs(), base = R.none, me = kpiOf(SIM.res);
    const fin = (label, v, d, f) => `<div class="final"><div class="f-label">${label}</div><div class="f-val">${v}</div><div class="f-delta"><span class="${d > 0 ? 'up' : d < 0 ? 'down' : ''}">${f(d)}</span> ${t('vsNone')}</div></div>`;
    const sgnMoney = d => (Math.round(d) > 0 ? '+' : Math.round(d) < 0 ? '−' : '') + 'NT$' + nf(Math.abs(d));
    // would-have-ordered-anyway
    const all = SIM.res, used = all.reduce((s, r) => s + r.buyersT, 0), any = all.reduce((s, r) => s + r.anywayT, 0), wasted = all.reduce((s, r) => s + r.wasted, 0);
    const segAgg = {}; for (const s of E.SEGS) segAgg[s] = { t: 0, b: 0, a: 0 };
    for (const r of all.slice(1)) for (const s of E.SEGS) { segAgg[s].t += r.seg[s].targeted; segAgg[s].b += r.seg[s].buyersT; segAgg[s].a += r.seg[s].anywayT; }
    const anyRow = (label, x) => `<tr><th>${label}</th><td>${nf(x.t)}</td><td>${nf(x.b)}</td><td>${nf(x.a)}</td><td>${nf(x.b - x.a)}</td></tr>`;
    const giftT = all.reduce((s, r) => s + r.seasonalTargeted, 0), giftC = all.reduce((s, r) => s + r.seasonalCost, 0);
    const spotted = S.ex.oddDone && S.ex.odd === ODD_ANSWER;
    // references table
    const order = ['you', 'none', 'best', 'back', 'nurture', 'greedy'];
    const k = { you: me }; for (const id in R) k[id] = R[id].kpi;
    const bestOf = key => Math.max(...order.map(id => k[id][key]));
    const cell = (id, key, f) => `<td class="${k[id][key] === bestOf(key) ? 'best' : ''}">${f(k[id][key])}</td>`;
    const refRows = order.map(id => `<tr class="${id === 'you' ? 'you' : ''}"><th>${id === 'you' ? esc(S.team) : T.refs[L()][id][0]}${T.refs[L()][id][1] ? `<br><span class="small" style="font-weight:400;white-space:normal">${T.refs[L()][id][1]}</span>` : ''}</th>${cell(id, 'profit', money)}${cell(id, 'active', nf)}${cell(id, 'equity', money)}${cell(id, 'trust', nf)}</tr>`).join('');
    const series = [
      ['chProfit', SIM.res.map(r => r.profit), base.res.map(r => r.profit), true],
      ['chActive', SIM.res.map(r => r.active), base.res.map(r => r.active), false],
      ['chEquity', SIM.res.map(r => r.equity), base.res.map(r => r.equity), true],
      ['chTrust', SIM.res.map(r => r.trust), base.res.map(r => r.trust), false]
    ];
    const tableTwin = `<div class="block scroll"><table class="data"><thead><tr><th></th>${T.qShort[L()].map(q => `<th>${q}</th>`).join('')}</tr></thead><tbody>
      ${series.map(s => `<tr><th>${t(s[0])}, ${t('legYou')}</th>${s[1].map(v => `<td>${nf(v)}</td>`).join('')}</tr><tr><th>${t(s[0])}, ${t('legRef')}</th>${s[2].map(v => `<td>${nf(v)}</td>`).join('')}</tr>`).join('')}
    </tbody></table></div>`;
    return head(t('endPeriod'), t('endTitle', esc(S.team)), t('endLead')) + `
      <div class="finals">
        ${fin(t('kProfit'), money(me.profit), me.profit - base.kpi.profit, sgnMoney)}
        ${fin(t('kActive'), nf(me.active), me.active - base.kpi.active, signed)}
        ${fin(t('kEquity'), money(me.equity), me.equity - base.kpi.equity, sgnMoney)}
        ${fin(t('kTrust'), nf(me.trust), me.trust - base.kpi.trust, signed)}
      </div>
      <h2>${t('chartsH')}</h2>
      <div class="legend"><span><i></i>${t('legYou')}</span><span><i class="ref"></i>${t('legRef')}</span></div>
      <div class="charts">${series.map((s, i) => `<div class="chart" id="chart${i}"><h3>${t(s[0])}</h3>${lineChart(s[1], s[2], i)}<div class="tip"></div></div>`).join('')}</div>
      <details><summary>${t('asTable')}</summary>${tableTwin}</details>
      <h2>${t('pathH')}</h2>
      <div class="block"><ol class="path">${pathItems().map(p => `<li><b>${p[0]}</b><div>${esc(p[1])}${p[2] ? `<q>${esc(p[2])}</q>` : ''}</div></li>`).join('')}</ol></div>
      <h2>${t('hiddenH')}</h2>
      <div class="insights">
        <div class="insight block pad"><h3>${t('anyH')}</h3><p>${used ? t('anyText', nf(used), nf(any), Math.round(100 * any / used), nf(wasted)) : t('anyNone')}</p>
          <div class="scroll" style="margin:.8rem -1.15rem -1rem"><table class="data"><thead><tr><th></th><th>${t('aSent')}</th><th>${t('aOrdered')}</th><th>${t('aAnyway')}</th><th>${t('aExtra')}</th></tr></thead><tbody>
            ${anyRow(t('aQ1Row'), { t: all[0].targeted, b: all[0].buyersT, a: all[0].anywayT })}
            ${E.SEGS.map(s => anyRow(t('aSegRow', segName(s)), segAgg[s])).join('')}
          </tbody></table></div></div>
        <div class="insight block pad"><h3>${t('giftH')}</h3><p>${t('giftText', E.seasonalCount(SIM.w), spotted, nf(giftT), nf(giftC))}</p></div>
        <div class="insight block pad"><h3>${t('depH')}</h3><p>${t('depText', E.dependents(SIM.w), E.dependents(base.w))}</p></div>
      </div>
      <h2>${t('refH')}</h2><p class="sub">${t('refSub')}</p>
      <div class="block scroll"><table class="data"><thead><tr><th>${t('refCol')}</th><th>${t('kProfit')}</th><th>${t('kActive')}</th><th>${t('kEquity')}</th><th>${t('kTrust')}</th></tr></thead><tbody>${refRows}</tbody></table></div>
      <h2>${t('qsH')}</h2>
      <ol class="qs">${T.qs[L()].map(q => `<li>${q}</li>`).join('')}</ol>
      ${classMode() ? `<div class="block pad answer"><h3>${t('ansH')}</h3>
        <label class="field"><span>${t('ansPick')}</span><select data-bind="end.q">${T.qs[L()].map((q, i) => `<option value="${i}"${S.end.q === i ? ' selected' : ''}>${i + 1}. ${q}</option>`).join('')}</select></label>
        <label class="field"><span>${t('ansLabel')}</span><textarea data-bind="end.a" maxlength="400">${esc(S.end.a)}</textarea></label>
        <div class="commit"><button type="button" class="btn-plain" data-act="sendend">${t('ansSend')}</button><span class="msg" role="status" aria-live="polite" style="color:var(--ink-2)">${S.end.sent ? t('ansSent') : ''}</span></div></div>` : ''}
      <div class="endbar"><button type="button" class="btn-plain" data-act="copy">${t('copy')}</button><span class="msg" role="status" aria-live="polite" style="color:var(--ink-2)"></span></div>
      <textarea id="sumtext" class="sr" aria-hidden="true" tabindex="-1" readonly></textarea>
      <details><summary>${t('teachH')}</summary><ul class="plain" style="max-width:74ch">${T.teach[L()].map(x => `<li>${x}</li>`).join('')}</ul></details>`;
  }
  function summaryText() {
    const R = refs(), me = kpiOf(SIM.res), b = R.none.kpi;
    const c = colon(), comma = zh() ? '、' : ', ';
    const lines = [`${t('title')} | ${t('sumTeam')}${c}${S.team}`];
    for (const p of pathItems()) lines.push(`${p[0] ? p[0] + c : '    '}${p[1]}${p[2] ? `\n    ${t('sumWhy')}${c}${p[2]}` : ''}`);
    lines.push(`${t('sumResult')}${c}` + [`${t('kProfit')} ${money(me.profit)} (${signed(me.profit - b.profit)})`, `${t('kActive')} ${nf(me.active)} (${signed(me.active - b.active)})`, `${t('kEquity')} ${money(me.equity)} (${signed(me.equity - b.equity)})`, `${t('kTrust')} ${nf(me.trust)} (${signed(me.trust - b.trust)})`].join(comma));
    lines.push(zh() ? `括號內為${t('vsNone')}的差距。` : `Figures in brackets are ${t('vsNone')}.`);
    return lines.join('\n');
  }

  /* ---------- line chart: your team vs no campaigns ---------- */
  const CH = { w: 380, h: 190, l: 50, r: 60, t: 12, b: 26 };
  function niceTicks(lo, hi) {
    if (lo === hi) { lo -= 1; hi += 1; }
    const span = hi - lo, raw = span / 3, mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw) || raw;
    const a = Math.floor(lo / step) * step, out = [];
    for (let v = a; v <= hi + step * 0.999; v += step) out.push(+v.toFixed(6));
    return out;
  }
  function lineChart(you, ref) {
    const ticks = niceTicks(Math.min(...you, ...ref), Math.max(...you, ...ref));
    const lo = ticks[0], hi = ticks[ticks.length - 1];
    const X = i => CH.l + i * (CH.w - CH.l - CH.r) / 3;
    const Y = v => CH.t + (hi - v) / (hi - lo) * (CH.h - CH.t - CH.b);
    const path = a => a.map((v, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join('');
    const dots = (a, c) => a.map((v, i) => `<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="4" fill="${c}" stroke="#fff" stroke-width="2"/>`).join('');
    const yl = Y(you[3]), rl = Y(ref[3]), apart = Math.abs(yl - rl) >= 13;
    const bw = (CH.w - CH.l - CH.r) / 3;
    return `<svg viewBox="0 0 ${CH.w} ${CH.h}" role="img">
      ${ticks.map(v => `<line x1="${CH.l}" x2="${CH.w - CH.r}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="#E6EBE4" stroke-width="1"/><text x="${CH.l - 8}" y="${(Y(v) + 4).toFixed(1)}" text-anchor="end">${fmtAxis(v)}</text>`).join('')}
      ${T.qShort[L()].map((q, i) => `<text x="${X(i).toFixed(1)}" y="${CH.h - 6}" text-anchor="middle">${q}</text>`).join('')}
      <line class="cross" x1="0" x2="0" y1="${CH.t}" y2="${CH.h - CH.b}" stroke="#6F7C75" stroke-width="1" visibility="hidden"/>
      <path d="${path(ref)}" fill="none" stroke="#8A918C" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      ${dots(ref, '#8A918C')}
      <path d="${path(you)}" fill="none" stroke="#2A78D6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      ${dots(you, '#2A78D6')}
      <text class="end" x="${X(3) + 9}" y="${(yl + 4).toFixed(1)}">${fmtAxis(you[3])}</text>
      ${apart ? `<text x="${X(3) + 9}" y="${(rl + 4).toFixed(1)}">${fmtAxis(ref[3])}</text>` : ''}
      ${you.map((v, i) => `<rect class="band" x="${(X(i) - bw / 2).toFixed(1)}" y="0" width="${bw.toFixed(1)}" height="${CH.h}" fill="transparent" tabindex="0" data-i="${i}" data-x="${X(i).toFixed(1)}" data-you="${nf(v)}" data-ref="${nf(ref[i])}" aria-label="${T.qShort[L()][i]}: ${t('legYou')} ${nf(v)}, ${t('legRef')} ${nf(ref[i])}"/>`).join('')}
    </svg>`;
  }
  function bindCharts() {
    app.querySelectorAll('.chart').forEach(ch => {
      const tip = ch.querySelector('.tip'), cross = ch.querySelector('.cross');
      const show = b => {
        const x = +b.dataset.x;
        cross.setAttribute('x1', x); cross.setAttribute('x2', x); cross.setAttribute('visibility', 'visible');
        tip.textContent = '';
        const head = document.createElement('div'); head.textContent = T.qShort[L()][+b.dataset.i]; tip.appendChild(head);
        [['', b.dataset.you, t('legYou')], ['ref', b.dataset.ref, t('legRef')]].forEach(r => {
          const row = document.createElement('div'), k = document.createElement('i'), v = document.createElement('b');
          if (r[0]) k.className = r[0]; v.textContent = r[1]; row.appendChild(k); row.appendChild(v); row.appendChild(document.createTextNode(' ' + r[2])); tip.appendChild(row);
        });
        tip.style.display = 'block';
      };
      const hide = () => { tip.style.display = 'none'; cross.setAttribute('visibility', 'hidden'); };
      ch.querySelectorAll('.band').forEach(b => {
        b.addEventListener('pointerenter', () => show(b)); b.addEventListener('focus', () => show(b));
        b.addEventListener('pointerleave', hide); b.addEventListener('blur', hide);
      });
    });
  }

  /* ---------- render ---------- */
  function stage() {
    switch (S.step) {
      case 'intro': return vIntro();
      case 'q1': return vQ1();
      case 'q1r': return vQ1r();
      case 'q2x': return vQ2x();
      case 'q2': return vPlan(2);
      case 'q2r': return vRes(2);
      case 'q3': return vPlan(3);
      case 'q3r': return vRes(3);
      case 'q4': return vPlan(4);
      case 'q4r': return vRes(4);
      default: return vEnd();
    }
  }
  function render(keepScroll) {
    const y = window.scrollY;
    SIM = simulate();
    document.documentElement.lang = S.lang === 'zh' ? 'zh-Hant' : 'en';
    document.title = `${t('pageTitle')} | ${t('brand')}`;
    app.innerHTML = top() + rail() + (S.step === 'intro' || S.step === 'end' ? '' : kpis()) + `<main>${stage()}</main><footer>${S.step === 'intro' ? '' : `<p>${t('fictional')}</p>`}<p><a href="../../index.html">${t('backChapter')}</a>　｜　<a href="../../../index.html">${t('backHome')}</a>　｜　<a href="teacher.html">${t('teacherPage')}</a></p></footer>`;
    UI.armed = null;
    if (S.step === 'end') bindCharts();
    clearTimeout(UI.timer);
    if (classMode()) { if (NEED[S.step] && !gateOpen()) checkGate().then(poll); else flush(); }
    if (keepScroll) window.scrollTo(0, y);
    else { window.scrollTo(0, 0); const h = app.querySelector('h1'); if (h && S.step !== 'intro') h.focus({ preventScroll: true }); }
  }
  function go(step) { S.step = step; UI.msg = ''; UI.bypass = false; UI.gateFails = 0; save(); render(false); }
  function setMsg(el, text) { UI.msg = text; const m = el.closest('.commit') && el.closest('.commit').querySelector('.msg'); if (m) m.textContent = text; }
  function disarm() {
    if (!UI.armed) return;
    const b = app.querySelector(`[data-act="${UI.armed}"]`);
    if (b) { b.classList.remove('armed'); b.textContent = b.dataset.label; }
    UI.armed = null;
  }
  // first press arms the button, second press commits
  function twoStep(btn, act) {
    if (UI.armed === act) { UI.armed = null; return true; }
    disarm(); UI.armed = act; btn.classList.add('armed'); btn.textContent = btn.dataset.arm; return false;
  }
  function setPath(path, value) {
    const k = path.split('.'); let o = S;
    for (let i = 0; i < k.length - 1; i++) o = o[k[i]];
    o[k[k.length - 1]] = value;
  }

  app.addEventListener('click', ev => {
    const btn = ev.target.closest('[data-act]');
    if (!btn) { if (!ev.target.closest('input,select,textarea,label')) disarm(); return; }
    const act = btn.dataset.act;
    if (act !== UI.armed) disarm();
    if (act === 'lang') { S.lang = btn.dataset.v; save(); render(true); return; }
    if (act === 'restart') { if (twoStep(btn, act)) { try { localStorage.removeItem(LS_KEY); } catch (e) { /* nothing saved */ } const lang = S.lang; S = fresh(); S.lang = lang; REFS = null; render(false); } return; }
    if (act === 'start') { if (!S.team.trim()) return setMsg(btn, t('needTeam')); S.team = S.team.trim(); return go('q1'); }
    if (act === 'sort') { UI.sort = btn.dataset.v; render(true); return; }
    if (act === 'next') { if (!gateOpen()) return; return go(STEPS[stepIdx(S.step) + 1]); }
    if (act === 'recheck') { checkGate().then(poll); return; }
    if (act === 'bypass') { UI.bypass = true; updateWait(); return; }
    if (act === 'sendend') {
      const msg = btn.parentElement.querySelector('.msg');
      if (!S.end.a.trim()) { msg.textContent = t('ansNeed'); return; }
      S.end.sent = true; save(); queue(payloadFor('end')); msg.textContent = t('ansSent'); return;
    }
    if (act === 'excheck') { S.ex.checked = true; save(); render(true); return; }
    if (act === 'copy') {
      const text = summaryText(), msg = btn.parentElement.querySelector('.msg');
      const done = () => { msg.textContent = t('copied'); };
      const fallback = () => { const ta = document.getElementById('sumtext'); ta.classList.remove('sr'); ta.removeAttribute('aria-hidden'); ta.style.cssText = 'display:block;width:100%;min-height:11rem;margin-top:.8rem'; ta.value = text; ta.select(); msg.textContent = t('copyFail'); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
      return;
    }
    if (act === 'lock:odd') {
      if (S.ex.odd == null) return setMsg(btn, t('needOdd'));
      if (twoStep(btn, act)) { S.ex.oddDone = true; UI.msg = ''; save(); render(true); }
      return;
    }
    if (act.startsWith('lock:q')) {
      const qn = +act.slice(6), d = S['q' + qn];
      if (qn === 1 && !d.list) return setMsg(btn, t('needChoice'));
      if (qn === 3 && d.ev == null) return setMsg(btn, t('needEvent'));
      if (qn > 1) { const i = planInfo(qn); if (i.over) return setMsg(btn, t('over', nf(i.total - i.budget))); }
      if (!d.why.trim()) return setMsg(btn, t('needWhy'));
      setMsg(btn, '');
      if (twoStep(btn, act)) { go('q' + qn + 'r'); queue(payloadFor('q' + qn)); }
    }
  });
  function onField(ev) {
    const el = ev.target;
    if (el.dataset.bind) {
      let v = el.value;
      if (el.dataset.bind === 'ex.odd' || el.dataset.bind === 'end.q') v = +v;
      setPath(el.dataset.bind, v); save();
      if (ev.type === 'change') disarm();
      return;
    }
    if (ev.type !== 'change') return;
    disarm();
    const qn = +S.step.slice(1);
    if (el.dataset.alloc) { S['q' + qn].alloc[el.dataset.alloc] = el.value; save(); refreshBudget(qn); return; }
    if (el.dataset.test) { S[el.dataset.test].test = el.checked; save(); refreshBudget(qn); return; }
    if (el.dataset.ev) {
      const d = S.q3, prev = d.ev != null ? E.EVENTS[SIM.event][d.ev].lock : {};
      for (const s in prev) d.alloc[s] = 'none';
      d.ev = +el.dataset.ev; Object.assign(d.alloc, E.EVENTS[SIM.event][d.ev].lock);
      save(); UI.msg = ''; render(true);
      const again = app.querySelector(`[data-ev="${d.ev}"]`); if (again) again.focus({ preventScroll: true });
    }
  }
  function refreshBudget(qn) {
    const b = document.getElementById('budget'); if (b) b.innerHTML = budgetHtml(qn);
    const m = app.querySelector('.commit .msg'); if (m) m.textContent = ''; UI.msg = '';
  }
  app.addEventListener('input', onField);
  app.addEventListener('change', onField);

  render(false);
  window.__game = { get state() { return S; }, get sim() { return SIM; }, get ui() { return UI; } };   // for the console and for tests
})();
</script>
</body>
</html>
