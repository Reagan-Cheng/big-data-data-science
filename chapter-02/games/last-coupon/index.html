<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Last Coupon 最後一張優惠券</title>
<meta name="description" content="A four-quarter RFM decision game for marketing classes. 四個季度的 RFM 團隊決策遊戲。">
<!-- ============================================================
     The Last Coupon · 最後一張優惠券
     A classroom simulation on RFM segmentation for team discussion.
     Single file, no build step, no server: open it or host it on
     GitHub Pages. Three script blocks below: ENGINE (the customer
     model), COPY (all text, English and 繁體中文), APP (the screens).
     ============================================================ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Instrument+Sans:wght@400..700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --paper:#F1F4EE;
  --surface:#FFFFFF;
  --ink:#16201B;
  --ink-2:#47544D;
  --ink-3:#6F7C75;
  --line:#D3DAD2;
  --line-2:#E6EBE4;
  --accent:#1E6B55;
  --accent-deep:#104435;
  --accent-wash:#E1EEE8;
  --stamp:#C4352B;
  --stamp-deep:#9C261E;
  --stamp-wash:#FBEAE7;
  --good:#0B7A0B;
  --bad:#B42B2B;
  --you:#2A78D6;
  --ref:#8A918C;
  --display:"Bricolage Grotesque","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --body:"Instrument Sans","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --wrap:68rem;
  --gutter:clamp(1rem,3.5vw,2.5rem);
}
*{box-sizing:border-box}
html{font-size:106.25%;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:1rem;line-height:1.55;-webkit-font-smoothing:antialiased}
html:lang(zh-Hant) body{line-height:1.75}
h1,h2,h3{font-family:var(--display);line-height:1.12;margin:0;font-weight:700;letter-spacing:-.01em}
html:lang(zh-Hant) h1,html:lang(zh-Hant) h2,html:lang(zh-Hant) h3{line-height:1.3;letter-spacing:0;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent-deep)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.num{font-variant-numeric:tabular-nums}
h1:focus{outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.7rem var(--gutter);border-bottom:1px solid var(--line);background:var(--surface)}
.brand{font-family:var(--display);font-weight:700;font-size:1.02rem;display:flex;align-items:baseline;gap:.6rem;min-width:0}
.brand{white-space:nowrap}
.brand small{font-family:var(--body);font-weight:400;font-size:.82rem;color:var(--ink-3);white-space:nowrap}
@media(max-width:520px){.brand small{display:none}}
.top-actions{display:flex;align-items:center;gap:.5rem;flex-shrink:0}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{border:0;background:transparent;padding:.28rem .8rem;font-size:.84rem;cursor:pointer;color:var(--ink-2)}
.lang button[aria-pressed="true"]{background:var(--ink);color:#fff}
.quiet{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.28rem .85rem;font-size:.84rem;cursor:pointer;color:var(--ink-2)}
.quiet:hover{border-color:var(--ink-3);color:var(--ink)}
.quiet.armed{border-color:var(--stamp);color:var(--stamp-deep);background:var(--stamp-wash)}

/* ---------- progress rail ---------- */
.rail{list-style:none;margin:0;padding:.75rem var(--gutter);display:flex;gap:.35rem;overflow-x:auto;background:var(--surface);border-bottom:1px solid var(--line)}
.rail li{flex:1 1 0;min-width:4.6rem;font-size:.8rem;color:var(--ink-3);padding-top:.45rem;border-top:3px solid var(--line-2);white-space:nowrap}
.rail li.done{border-top-color:var(--accent);color:var(--ink-2)}
.rail li.now{border-top-color:var(--ink);color:var(--ink);font-weight:600}

/* ---------- KPI strip ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:1px solid var(--line);background:var(--surface)}
.kpi{padding:.75rem var(--gutter) .8rem;border-left:1px solid var(--line-2);min-width:0}
.kpi:first-child{border-left:0}
.kpi .k-label{font-size:.8rem;color:var(--ink-2)}
.kpi .k-val{font-family:var(--body);font-weight:600;font-size:clamp(1.15rem,2.3vw,1.6rem);line-height:1.2;white-space:nowrap}
.kpi .k-delta{font-size:.8rem;color:var(--ink-3);white-space:nowrap}
.k-delta .up{color:var(--good)}
.k-delta .down{color:var(--bad)}
@media(max-width:700px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi{padding:.55rem 1rem}
  .kpi:nth-child(3){border-left:0}
  .kpi:nth-child(n+3){border-top:1px solid var(--line-2)}
}

/* ---------- stage ---------- */
main{max-width:var(--wrap);margin:0 auto;padding:clamp(1.5rem,4vw,3rem) var(--gutter) 5rem}
.period{font-size:.92rem;color:var(--accent-deep);font-weight:600;margin-bottom:.35rem}
.stage-title{font-size:clamp(1.9rem,4.4vw,3rem)}
.lede{max-width:64ch;margin-top:.9rem;font-size:1.06rem;color:var(--ink-2)}
h2{font-size:clamp(1.2rem,2.2vw,1.5rem);margin:2.3rem 0 .8rem}
h3{font-size:1.02rem;margin:0 0 .25rem}
.sub{color:var(--ink-2);max-width:66ch;margin:-.3rem 0 .9rem;font-size:.95rem}
.small{font-size:.86rem;color:var(--ink-3)}
.block{background:var(--surface);border:1px solid var(--line);border-radius:6px}
.pad{padding:1rem 1.15rem}

/* ---------- hero ticket (intro) ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:clamp(1.5rem,4vw,3.5rem);align-items:center}
@media(max-width:820px){.hero{grid-template-columns:minmax(0,1fr)}}
.ticket{
  --s:18px;
  position:relative;background:var(--stamp);color:#fff;display:grid;grid-template-columns:minmax(0,1fr) auto;
  -webkit-mask:
    radial-gradient(circle at left,transparent calc(var(--s)*.34),#000 calc(var(--s)*.36)) left/51% var(--s) repeat-y,
    radial-gradient(circle at right,transparent calc(var(--s)*.34),#000 calc(var(--s)*.36)) right/51% var(--s) repeat-y;
  mask:
    radial-gradient(circle at left,transparent calc(var(--s)*.34),#000 calc(var(--s)*.36)) left/51% var(--s) repeat-y,
    radial-gradient(circle at right,transparent calc(var(--s)*.34),#000 calc(var(--s)*.36)) right/51% var(--s) repeat-y;
}
.ticket-main{padding:clamp(1.4rem,3.2vw,2.4rem) clamp(1.5rem,3.4vw,2.6rem)}
.ticket-main h1{font-size:clamp(2.5rem,6.6vw,4.6rem);font-weight:800;line-height:.98;letter-spacing:-.025em}
html:lang(zh-Hant) .ticket-main h1{line-height:1.12;letter-spacing:0;font-size:clamp(2.2rem,5.6vw,3.9rem)}
.ticket-main p{margin-top:1rem;font-size:1.05rem;max-width:26ch;opacity:.94}
.ticket-stub{border-left:2px dashed rgba(255,255,255,.55);padding:1.2rem 1.5rem 1.2rem 1.2rem;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end;text-align:right;min-width:7.2rem}
.ticket-stub .amount{font-family:var(--display);font-weight:800;font-size:clamp(1.5rem,3.2vw,2.2rem);line-height:1}
.ticket-stub .amount small{display:block;font-family:var(--body);font-weight:500;font-size:.8rem;margin-bottom:.25rem;opacity:.9}
.ticket-stub .valid{font-size:.8rem;opacity:.9;max-width:9ch}
.hero-copy p{font-size:1.12rem;max-width:44ch}
.hero-copy .fict{margin-top:.9rem;font-size:.86rem;color:var(--ink-3)}

.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.9rem clamp(1.5rem,4vw,3.5rem)}
@media(max-width:820px){.cols{grid-template-columns:minmax(0,1fr)}}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:st}
ol.steps li{counter-increment:st;display:grid;grid-template-columns:2rem minmax(0,1fr);gap:.2rem;padding:.55rem 0;border-top:1px solid var(--line)}
ol.steps li:first-child{border-top:0}
ol.steps li::before{content:counter(st);font-family:var(--display);font-weight:700;color:var(--accent-deep)}
dl.defs{margin:0}
dl.defs div{padding:.55rem 0;border-top:1px solid var(--line);display:grid;grid-template-columns:9.5rem 1fr;gap:.8rem}
dl.defs div:first-child{border-top:0}
dl.defs dt{font-weight:600}
dl.defs dd{margin:0;color:var(--ink-2)}
@media(max-width:520px){dl.defs div{grid-template-columns:minmax(0,1fr);gap:0}}

.field{display:block;margin-top:1.4rem}
.field > span{display:block;font-weight:600;font-size:.95rem;margin-bottom:.3rem}
.field input[type=text],.field textarea,select{width:100%;border:1px solid var(--ink-3);border-radius:5px;padding:.6rem .7rem;background:var(--surface)}
.field textarea{min-height:3.4rem;resize:vertical}
.field input:focus,.field textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.narrow{max-width:26rem}

/* ---------- lock-in ticket button ---------- */
.commit{margin-top:1.4rem;display:flex;flex-wrap:wrap;align-items:center;gap:.9rem 1.2rem}
.btn-ticket{
  --s:12px;
  border:0;cursor:pointer;background:var(--stamp);color:#fff;font-family:var(--display);font-weight:700;font-size:1.05rem;
  padding:.85rem 2rem;
  -webkit-mask:
    radial-gradient(circle at left,transparent calc(var(--s)*.34),#000 calc(var(--s)*.38)) left/51% var(--s) repeat-y,
    radial-gradient(circle at right,transparent calc(var(--s)*.34),#000 calc(var(--s)*.38)) right/51% var(--s) repeat-y;
  mask:
    radial-gradient(circle at left,transparent calc(var(--s)*.34),#000 calc(var(--s)*.38)) left/51% var(--s) repeat-y,
    radial-gradient(circle at right,transparent calc(var(--s)*.34),#000 calc(var(--s)*.38)) right/51% var(--s) repeat-y;
  transition:background .15s, transform .15s;
}
html:lang(zh-Hant) .btn-ticket{font-weight:700}
.btn-ticket:hover{background:var(--stamp-deep)}
.btn-ticket:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.btn-ticket.armed{background:var(--ink)}
.btn-ticket[aria-disabled="true"]{background:#B9C0BA;cursor:not-allowed}
.btn-plain{border:0;cursor:pointer;background:var(--ink);color:#fff;font-family:var(--display);font-weight:700;font-size:1.02rem;padding:.8rem 1.6rem;border-radius:5px}
.btn-plain:hover{background:var(--accent-deep)}
.btn-ghost{border:1px solid var(--ink-3);cursor:pointer;background:transparent;font-weight:600;padding:.6rem 1.1rem;border-radius:5px}
.btn-ghost:hover{border-color:var(--ink);background:var(--surface)}
.msg{font-size:.92rem;color:var(--bad);font-weight:500}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* ---------- option cards (radio) ---------- */
.opts{display:grid;grid-template-columns:minmax(0,1fr);gap:.6rem;margin-top:1rem}
.opts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.opts.three{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:820px){.opts.two,.opts.three{grid-template-columns:minmax(0,1fr)}}
.opt{position:relative;display:block;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:.85rem 1rem .9rem 2.6rem;cursor:pointer}
.opt:hover{border-color:var(--ink-3)}
.opt input{position:absolute;left:.95rem;top:1.05rem;width:1.05rem;height:1.05rem;accent-color:var(--ink);margin:0}
.opt:has(input:checked){border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:var(--accent-wash)}
.opt strong{display:block;font-family:var(--display);font-size:1.04rem}
html:lang(zh-Hant) .opt strong{font-weight:700}
.opt span{display:block;color:var(--ink-2);font-size:.94rem}
.opt em{display:block;font-style:normal;font-size:.86rem;color:var(--ink-3);margin-top:.4rem}
.opt.locked{cursor:default;opacity:.92}

/* ---------- data tables ---------- */
.scroll{overflow-x:auto}
table.data{border-collapse:collapse;width:100%;font-size:.93rem}
table.data caption{text-align:left;padding:.8rem 1.15rem .2rem;font-weight:600}
table.data th,table.data td{padding:.5rem .75rem;text-align:right;border-top:1px solid var(--line-2);white-space:nowrap;font-variant-numeric:tabular-nums}
table.data thead th{border-top:0;font-weight:600;font-size:.84rem;color:var(--ink-2);vertical-align:bottom;white-space:normal;line-height:1.3}
html:lang(zh-Hant) table.data thead th{word-break:keep-all}
table.data th:first-child,table.data td:first-child{text-align:left;padding-left:1.15rem}
table.data td:last-child,table.data th:last-child{padding-right:1.15rem}
table.data tbody th{font-weight:600;text-align:left}
table.data tr.total td,table.data tr.total th{border-top:1px solid var(--ink-3);font-weight:700}
table.data td.l,table.data th.l{text-align:left}
table.data .best{font-weight:700}
table.data .best::after{content:"";display:inline-block;width:.45rem;height:.45rem;border-radius:50%;background:var(--accent);margin-left:.4rem;vertical-align:.08em}
table.data tr.you th,table.data tr.you td{background:var(--accent-wash)}
th button.sort{border:0;background:none;font:inherit;color:inherit;cursor:pointer;padding:0;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
th button.sort[aria-pressed="true"]{text-decoration-color:var(--ink);color:var(--ink)}
.tfoot{padding:.55rem 1.15rem .8rem;font-size:.86rem;color:var(--ink-3)}

/* ---------- segment plan ---------- */
.plan{display:grid;grid-template-columns:minmax(0,1fr);gap:0}
.seg{display:grid;grid-template-columns:minmax(12rem,1.25fr) minmax(0,1.5fr) minmax(16rem,1.6fr);gap:.4rem 1.2rem;padding:.9rem 1.15rem;border-top:1px solid var(--line-2);align-items:center}
.seg:first-child{border-top:0}
.seg-name strong{font-family:var(--display);font-size:1.05rem;display:block}
html:lang(zh-Hant) .seg-name strong{font-weight:700}
.seg-name span{font-size:.84rem;color:var(--ink-3);display:block;line-height:1.35}
.seg-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.3rem .8rem}
.seg-stats.more{grid-template-columns:repeat(4,minmax(0,1fr))}
.stat b{display:block;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat i{display:block;font-style:normal;font-size:.76rem;color:var(--ink-3);line-height:1.25}
.stat.hl b{color:var(--accent-deep)}
.bar{height:6px;background:var(--line-2);border-radius:0 3px 3px 0;margin-top:.25rem;overflow:hidden}
.bar u{display:block;height:100%;background:var(--accent);border-radius:0 3px 3px 0;text-decoration:none}
.tactics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--ink-3);border-radius:5px;overflow:hidden}
.tactics label{position:relative;text-align:center;padding:.4rem .3rem;cursor:pointer;border-left:1px solid var(--ink-3);font-size:.9rem;line-height:1.25;background:var(--surface)}
.tactics label:first-child{border-left:0}
.tactics input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.tactics b{display:block;font-weight:600}
.tactics small{display:block;font-size:.78rem;color:var(--ink-3);font-variant-numeric:tabular-nums}
.tactics label:has(input:checked){background:var(--ink);color:#fff}
.tactics label:has(input:checked) small{color:#D7DDD8}
.tactics label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:-2px}
.tactics.locked label{cursor:default}
.tactics.locked label:not(:has(input:checked)){background:var(--line-2);color:var(--ink-3)}
.seg-note{grid-column:1/-1;font-size:.84rem;color:var(--ink-3)}
@media(max-width:940px){
  .seg{grid-template-columns:minmax(0,1fr)}
}
.truth{grid-column:1/-1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.3rem .8rem;background:var(--accent-wash);border-radius:5px;padding:.55rem .8rem}
@media(max-width:700px){.truth{grid-template-columns:repeat(2,minmax(0,1fr))}.seg-stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

.budget{padding:1rem 1.15rem;border-top:1px solid var(--line)}
.budget-row{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;font-size:.95rem}
.budget-row b{font-variant-numeric:tabular-nums}
.meter{height:10px;background:var(--accent-wash);border-radius:5px;margin-top:.45rem;overflow:hidden}
.meter u{display:block;height:100%;background:var(--accent);border-radius:5px;text-decoration:none;transition:width .2s}
.meter.over{background:var(--stamp-wash)}
.meter.over u{background:var(--stamp)}
.check{display:grid;grid-template-columns:1.4rem minmax(0,1fr);gap:.2rem .5rem;padding:1rem 1.15rem;border-top:1px solid var(--line);cursor:pointer}
.check input{width:1.05rem;height:1.05rem;margin:.28rem 0 0;accent-color:var(--ink)}
.check strong{display:block}
.check span{color:var(--ink-2);font-size:.93rem}

/* ---------- RFM exercise ---------- */
.people{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.7rem}
@media(max-width:900px){.people{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.people{grid-template-columns:minmax(0,1fr)}}
.person{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:.9rem 1rem}
.person h3{font-size:1.1rem}
.person dl{margin:.5rem 0 .6rem;display:grid;grid-template-columns:auto 1fr;gap:.1rem .8rem;font-size:.92rem}
.person dt{color:var(--ink-3)}
.person dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.tl{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;margin:.2rem 0 .1rem}
.tl i{font-style:normal;text-align:center;font-size:.8rem;padding:.18rem 0;background:var(--line-2);color:var(--ink-3);font-variant-numeric:tabular-nums}
.tl i.on{background:var(--accent);color:#fff;font-weight:600}
.tl-ax{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;font-size:.66rem;color:var(--ink-3);text-align:center;margin-bottom:.7rem;line-height:1.2}
.person .fb{margin-top:.5rem;font-size:.88rem}
.fb.ok{color:var(--good)}
.fb.no{color:var(--bad)}
.verdict{margin-top:1rem;padding:.9rem 1.1rem;border-left:4px solid var(--accent);background:var(--surface);max-width:70ch}
.verdict.no{border-left-color:var(--ink-3)}

/* ---------- results ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5rem,1fr));gap:0;border:1px solid var(--line);border-radius:6px;background:var(--surface);overflow:hidden}
.tile{padding:.8rem 1rem;border-left:1px solid var(--line-2);margin-left:-1px}
.tile .t-label{font-size:.82rem;color:var(--ink-2)}
.tile .t-val{font-weight:600;font-size:1.35rem;line-height:1.25;white-space:nowrap}
.tile .t-sub{font-size:.8rem;color:var(--ink-3)}
ul.notes{margin:0;padding:0;list-style:none}
ul.notes li{padding:.7rem 1.15rem;border-top:1px solid var(--line-2);display:grid;grid-template-columns:4.6rem minmax(0,1fr);gap:.8rem;align-items:baseline}
ul.notes li:first-child{border-top:0}
ul.notes b{font-variant-numeric:tabular-nums;white-space:nowrap}
ul.notes b.up{color:var(--good)}
ul.notes b.down{color:var(--bad)}
ul.plain{margin:.3rem 0 0;padding-left:1.1rem}
ul.plain li{margin:.25rem 0}
.callout{margin-top:1.2rem;padding:1rem 1.15rem;border-left:4px solid var(--ink);background:var(--surface);max-width:72ch}
.event{background:var(--ink);color:#fff;border-radius:6px;padding:clamp(1.1rem,3vw,1.8rem) clamp(1.1rem,3vw,2rem)}
.event h3{font-size:clamp(1.4rem,3vw,2rem);margin-bottom:.6rem}
.event p{max-width:62ch;color:#E3E8E4;font-size:1.04rem}

/* ---------- charts ---------- */
.legend{display:flex;gap:1.2rem;flex-wrap:wrap;font-size:.88rem;color:var(--ink-2);margin:.2rem 0 .7rem}
.legend span{display:inline-flex;align-items:center;gap:.4rem}
.legend i{display:inline-block;width:1.3rem;height:0;border-top:2px solid var(--you)}
.legend i.ref{border-top-color:var(--ref)}
.charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.7rem}
@media(max-width:760px){.charts{grid-template-columns:minmax(0,1fr)}}
.chart{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:.8rem 1rem .5rem}
.chart h3{font-family:var(--body);font-weight:600;font-size:.92rem}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--body);fill:var(--ink-3);font-size:11px;font-variant-numeric:tabular-nums}
.chart text.end{fill:var(--ink);font-weight:600}
.tip{position:absolute;right:.7rem;top:.55rem;pointer-events:none;background:var(--ink);color:#fff;border-radius:5px;padding:.35rem .6rem;font-size:.8rem;line-height:1.4;white-space:nowrap;z-index:5;display:none}
.tip b{font-variant-numeric:tabular-nums}
.tip i{display:inline-block;width:.9rem;border-top:2px solid var(--you);vertical-align:middle;margin-right:.35rem}
.tip i.ref{border-top-color:#C5CBC6}
details{margin-top:.8rem}
summary{cursor:pointer;font-weight:600;color:var(--accent-deep)}
details .block{margin-top:.6rem}
.finals{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:6px;background:var(--surface);overflow:hidden;margin-top:1.4rem}
.final{padding:1rem 1.15rem;border-left:1px solid var(--line-2)}
.final:first-child{border-left:0}
.final .f-label{font-size:.86rem;color:var(--ink-2)}
.final .f-val{font-weight:600;font-size:clamp(1.3rem,2.6vw,1.9rem);line-height:1.2;white-space:nowrap}
.final .f-delta{font-size:.86rem;color:var(--ink-3)}
.f-delta .up{color:var(--good);font-weight:600}
.f-delta .down{color:var(--bad);font-weight:600}
@media(max-width:760px){.finals{grid-template-columns:repeat(2,minmax(0,1fr))}.final:nth-child(3){border-left:0}.final:nth-child(n+3){border-top:1px solid var(--line-2)}}
.path{margin:0;padding:0;list-style:none}
.path li{padding:.8rem 1.15rem;border-top:1px solid var(--line-2);display:grid;grid-template-columns:3.6rem minmax(0,1fr);gap:.8rem}
.path li:first-child{border-top:0}
.path b{font-family:var(--display)}
.path q{display:block;color:var(--ink-2);font-size:.93rem;quotes:"“" "”";margin-top:.15rem}
html:lang(zh-Hant) .path q{quotes:"「" "」"}
.insights{display:grid;grid-template-columns:minmax(0,1fr);gap:.7rem}
.insight h3{font-size:1.1rem;margin-bottom:.35rem}
.insight p{max-width:72ch;color:var(--ink-2)}
ol.qs{margin:0;padding-left:1.3rem;max-width:72ch}
ol.qs li{margin:.5rem 0}
.endbar{margin-top:2.2rem;display:flex;gap:.8rem;flex-wrap:wrap;align-items:center}
footer{max-width:var(--wrap);margin:0 auto;padding:0 var(--gutter) 2.5rem;font-size:.82rem;color:var(--ink-3)}
footer p{margin:.3rem 0}

/* ---------- class mode ---------- */
.sync{font-size:.8rem;color:var(--ink-2);white-space:nowrap;margin-right:.3rem}
.sync.err{color:var(--bad)}
@media(max-width:620px){.sync{display:none}}
.wait{margin-top:1.4rem;padding:1rem 1.15rem;border:1px dashed var(--ink-3);border-radius:6px;background:var(--surface);max-width:46rem}
.wait strong{display:block;font-family:var(--display);font-size:1.1rem}
.wait span{display:block;color:var(--ink-2);margin-top:.2rem}
.wait .commit{margin-top:.8rem}
.answer{margin-top:1.2rem;max-width:74ch}
.answer .field:first-of-type{margin-top:.6rem}
</style>
</head>
<body>
<div id="app"></div>
<noscript><p style="padding:2rem;font-family:sans-serif">This game needs JavaScript. 這個遊戲需要啟用 JavaScript。</p></noscript>
<!-- Class mode is switched on in config.js. Without it the game runs on its own. -->
<script src="config.js"></script>
<script>
/* ============================================================
   ENGINE — The Last Coupon (RFM simulation)
   Pure, deterministic customer-level simulation. No DOM access.
   Same seed + same decisions => same outcome on every device.
   ============================================================ */
const Engine = (() => {
  'use strict';

  const P = {
    seed: 20261,
    baseN: 1000,          // members at the start of Q1
    joinPerQ: 45,         // organic sign-ups per game quarter
    qDays: 90,
    margin: 0.55,         // gross margin on list-price sales
    coupon: 200,          // NT$ off one order
    perkCost: 150,         // NT$ per perk recipient (gift is mailed whether or not they order)
    msg: 15,              // NT$ per member targeted
    betaC: 0.95,          // logit lift from a coupon
    betaP: 0.30,          // logit lift from a perk
    gamma: 1.2,           // logit penalty per unit of discount dependence
    decay: 0.55,          // pull toward the member's resting level after a quarter with no order
    floor: 0.15,          // resting level as a share of the member's ceiling          // engagement decay after a quarter with no order
    habit: 0.60,          // engagement gain after an organic / perk order
    habitCoupon: 0.50,    // ... after a coupon order by an engaged member
    habitReact: 0.25,     // ... after a coupon order by a lapsed member
    perkBond: 0.15,       // engagement gain from simply receiving a perk
    shock: 0.03,          // quarterly chance a member drifts to a rival
    depUp: 0.30, depDown: 0.12,
    trust0: 70,
    trustLogit: 0.2,      // logit shift per 100 trust points
    q1Coupons: 300,
    budgets: [0, 50000, 50000, 35000],
    testCost: 6000,
    holdout: 0.10,
    lnyQuarter: 2         // game quarter index (0-based) containing Lunar New Year
  };

  const SEGS = ['champ', 'loyal', 'new', 'risk', 'hib'];
  const TACTICS = ['none', 'perk', 'coupon'];

  /* ---------- deterministic uniform(0,1) from (seed, id, quarter, stream) ---------- */
  function u(id, t, s) {
    let h = P.seed | 0;
    h = Math.imul(h ^ (id + 0x9e3779b9), 0x85ebca6b); h ^= h >>> 13;
    h = Math.imul(h ^ ((t + 64) * 0x27d4eb2f), 0xc2b2ae35); h ^= h >>> 16;
    h = Math.imul(h ^ ((s + 1) * 0x165667b1), 0x9e3779b1); h ^= h >>> 15;
    h = Math.imul(h, 0x85ebca6b); h ^= h >>> 13;
    h = Math.imul(h, 0xc2b2ae35); h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  }
  const lerp = (a, b, x) => a + (b - a) * x;
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  const logit = p => Math.log(p / (1 - p));
  const sigm = x => 1 / (1 + Math.exp(-x));
  // is quarter t (0 = game Q1 = Jul–Sep) a Lunar New Year quarter (Jan–Mar)?
  const isLNY = t => (((t - P.lnyQuarter) % 4) + 4) % 4 === 0;

  /* ---------- population ---------- */
  function makeCustomer(id, joinT, forceType) {
    const a = u(id, -99, 1);
    let type;
    if (forceType) type = forceType;
    else if (joinT < 0) {
      type = a < 0.20 ? 'enth' : a < 0.50 ? 'reg' : a < 0.78 ? 'occ' : a < 0.965 ? 'deal' : 'gift';
    } else {
      type = a < 0.14 ? 'enth' : a < 0.38 ? 'reg' : a < 0.73 ? 'occ' : 'deal';
    }
    const b = u(id, -99, 2), c = u(id, -99, 3), d = u(id, -99, 4);
    let cap, k, aov;
    if (type === 'enth')      { cap = lerp(0.93, 0.985, b); k = 3 + Math.floor(c * 3);  aov = lerp(900, 1500, d); }
    else if (type === 'reg')  { cap = lerp(0.70, 0.88, b); k = 2 + Math.floor(c * 2);  aov = lerp(700, 1150, d); }
    else if (type === 'occ')  { cap = lerp(0.28, 0.52, b); k = 1 + Math.floor(c * 2);  aov = lerp(600, 1000, d); }
    else if (type === 'deal') { cap = lerp(0.06, 0.20, b); k = 1;                       aov = lerp(450, 800, d); }
    else                      { cap = 0.9;                 k = 1 + Math.floor(c * 2);  aov = lerp(3000, 6000, d); }
    return {
      id, type, joinT, cap, k, aov: Math.round(aov / 10) * 10,
      e: 0, dep: 0, miss: 0, seasonal: type === 'gift',
      hist: {}          // t -> {n, spend, gap, tactic, coupon}
    };
  }

  function baseJoinQuarter(id, type) {
    const x = u(id, -99, 5);
    if (type === 'gift') return x < 0.7 ? -6 : -2;                 // first bought at a Lunar New Year
    if (type === 'deal') return x < 0.30 ? -5 : x < 0.62 ? -2 : x < 0.86 ? -1 : -8 + Math.floor(u(id, -99, 6) * 7);
    if (x < 0.12) return -1;                                       // recent acquisition push
    return -8 + Math.floor(u(id, -99, 6) * 7);                     // -8 .. -2
  }

  function newWorld(opts) {
    if (opts && opts.seed != null) P.seed = opts.seed | 0;
    const cs = [];
    for (let i = 0; i < P.baseN; i++) {
      const tmp = makeCustomer(i, -1);
      const c = makeCustomer(i, baseJoinQuarter(i, tmp.type));
      cs.push(c);
    }
    let id = P.baseN;
    for (let t = 0; t < 4; t++) for (let j = 0; j < P.joinPerQ; j++) cs.push(makeCustomer(id++, t));
    const w = { t: -8, trust: P.trust0, customers: cs, nextId: id, log: [], filterSeasonal: false, hasTest: false };
    for (let t = -8; t < 0; t++) { stepCore(w, t, null, { history: true }); }
    w.t = 0;
    return w;
  }

  /* ---------- purchase probability under a tactic ---------- */
  // long-silent members read fewer of our messages, so campaigns reach them less
  const REACH = [1, 1, 1, 0.85, 0.45, 0.3];
  const reach = c => REACH[Math.min(c.miss || 0, REACH.length - 1)];
  function prob(c, t, tactic, trust) {
    if (c.seasonal) return isLNY(t) ? 0.88 : 0.02;
    const rho = reach(c);
    const base = logit(clamp(c.e, 0.004, 0.996)) + (trust - P.trust0) / 100 * P.trustLogit;
    let L;
    if (tactic === 'coupon') L = base + P.betaC * rho;
    else if (tactic === 'perk') L = base + P.betaP * rho - P.gamma * c.dep * 0.5;
    else L = base - P.gamma * c.dep;
    return sigm(L);
  }

  function orderGap(c, t, n) {
    if (c.seasonal) return 45 + Math.floor(u(c.id, t, 12) * 25);        // late Jan – mid Feb
    return Math.floor(P.qDays * (1 - Math.pow(1 - u(c.id, t, 12), 1 / n)));
  }

  /* ---------- one quarter ----------
     plan: Map id -> 'perk' | 'coupon' (absent = none); returns per-customer outcome list */
  function stepCore(w, t, plan, o) {
    o = o || {};
    const trust = w.trust;
    const out = [];
    for (const c of w.customers) {
      if (c.joinT > t) continue;
      if (c.joinT === t) {                                  // first order
        const spend = Math.round(c.aov * lerp(0.9, 1.15, u(c.id, t, 11)));
        c.hist[t] = { n: 1, spend, gap: orderGap(c, t, 1), tactic: 'join' };
        c.e = c.seasonal ? 0 : 0.6 * c.cap + 0.12;
        out.push({ c, joined: true, bought: true, spend, tactic: 'join', pNone: 1 });
        continue;
      }
      const tactic = (plan && plan.get(c.id)) || 'none';
      const p = prob(c, t, tactic, trust);
      const pNone = tactic === 'none' ? p : prob(c, t, 'none', trust);
      const draw = u(c.id, t, 10);
      const bought = draw < p;
      const anyway = draw < pNone;
      const ePre = c.e;
      let spend = 0, n = 0;
      if (bought) {
        n = c.k;
        spend = Math.round(n * c.aov * lerp(0.85, 1.15, u(c.id, t, 11)));
        c.hist[t] = { n, spend, gap: orderGap(c, t, n), tactic };
      }
      c.miss = bought ? 0 : c.miss + 1;
      // would-have-been spend if untreated (same draw, for exact counterfactuals)
      const spendAnyway = anyway ? Math.round(c.k * c.aov * lerp(0.85, 1.15, u(c.id, t, 11))) : 0;
      if (!c.seasonal) {
        if (bought) {
          const h = tactic === 'coupon' ? (ePre < 0.3 ? P.habitReact : P.habitCoupon) : P.habit;
          c.e = c.e + h * (c.cap - c.e);
        } else {
          const fl = P.floor * c.cap;
          c.e = Math.max(0.01, fl + (c.e - fl) * P.decay);
        }
        if (tactic === 'perk') c.e = c.e + P.perkBond * (c.cap - c.e);
        // discount dependence
        if (tactic === 'coupon' && bought && ePre >= 0.5) c.dep = Math.min(1, c.dep + P.depUp);
        else if (tactic !== 'coupon') c.dep = Math.max(0, c.dep - P.depDown);
        // drift to a rival; a perk halves the risk
        const sp = P.shock * (tactic === 'perk' ? 0.5 : 1);
        const rival = o.history && t === -3 && (c.type === 'enth' || c.type === 'reg') && u(c.id, t, 14) < 0.34;
        if (rival || u(c.id, t, 13) < sp) { c.e *= 0.2; c.cap *= 0.5; }
      }
      out.push({ c, bought, anyway, spend, spendAnyway, n, tactic, pNone, p });
    }
    w.t = t + 1;
    return out;
  }

  /* ---------- RFM as of the start of quarter t (24-month window) ---------- */
  const rScore = d => d <= 30 ? 5 : d <= 60 ? 4 : d <= 120 ? 3 : d <= 270 ? 2 : 1;
  const fScore = f => f >= 16 ? 5 : f >= 10 ? 4 : f >= 5 ? 3 : f >= 2 ? 2 : 1;
  const mScore = m => m >= 18000 ? 5 : m >= 10000 ? 4 : m >= 5000 ? 3 : m >= 2000 ? 2 : 1;
  function segmentOf(R, F, M) {
    const FM = Math.round((F + M) / 2);
    if (R >= 3) { if (FM >= 3) return (R >= 4 && FM >= 4) ? 'champ' : 'loyal'; return 'new'; }
    return FM >= 3 ? 'risk' : 'hib';
  }
  function rfm(c, t) {
    let f = 0, m = 0, last = null;
    for (let q = t - 8; q < t; q++) {
      const h = c.hist[q];
      if (h) { f += h.n; m += h.spend; last = q; }
    }
    let days;
    if (last === null) {                                   // nothing in 24 months
      let q = t - 9; while (q >= -8 && !c.hist[q]) q--;
      days = q >= -8 ? (t - 1 - q) * P.qDays + c.hist[q].gap : 999;
    } else days = (t - 1 - last) * P.qDays + c.hist[last].gap;
    const R = rScore(days), F = fScore(f), M = mScore(m);
    return { days, f, m, R, F, M, seg: segmentOf(R, F, M) };
  }
  function snapshot(w) {
    const t = w.t, rows = [];
    for (const c of w.customers) if (c.joinT < t) rows.push(Object.assign({ c }, rfm(c, t)));
    return rows;
  }

  /* ---------- segment table shown to the team ---------- */
  function segTable(w, snap) {
    snap = snap || snapshot(w);
    const tb = {};
    for (const s of SEGS) tb[s] = { seg: s, n: 0, days: 0, f: 0, m: 0, pNone: 0, pPerk: 0, pCoupon: 0, nT: 0,
      costPerk: 0, costCoupon: 0, incPerk: 0, incCoupon: 0, valPerk: 0, valCoupon: 0, seasonal: 0 };
    for (const r of snap) {
      const x = tb[r.seg], c = r.c;
      x.n++; x.days += r.days; x.f += r.f; x.m += r.m;
      if (c.seasonal) x.seasonal++;
      if (c.seasonal && w.filterSeasonal) continue;        // filtered members are never targeted
      const p0 = prob(c, w.t, 'none', w.trust), p1 = prob(c, w.t, 'perk', w.trust), p2 = prob(c, w.t, 'coupon', w.trust);
      const q = c.k * c.aov * P.margin;
      x.nT++; x.pNone += p0; x.pPerk += p1; x.pCoupon += p2;
      x.costPerk += P.perkCost;
      x.costCoupon += P.msg + p2 * P.coupon;
      x.incPerk += p1 - p0; x.incCoupon += p2 - p0;
      x.valPerk += (p1 - p0) * q - P.perkCost;
      x.valCoupon += (p2 - p0) * q - p2 * P.coupon - P.msg;
    }
    for (const s of SEGS) {
      const x = tb[s], n = x.n || 1, nt = x.nT || 1;
      x.days /= n; x.f /= n; x.m /= n;
      x.pNone /= nt; x.pPerk /= nt; x.pCoupon /= nt;
      x.incPerk /= nt; x.incCoupon /= nt;
      x.unitPerk = x.costPerk / nt; x.unitCoupon = x.costCoupon / nt;
      x.valPerkPer = x.valPerk / nt; x.valCouponPer = x.valCoupon / nt;
    }
    return tb;
  }
  function planCost(tb, alloc, withTest) {
    let cost = 0;
    for (const s of SEGS) {
      const a = alloc[s];
      if (a === 'perk') cost += tb[s].costPerk; else if (a === 'coupon') cost += tb[s].costCoupon;
    }
    if (withTest) cost = cost * (1 - P.holdout);
    return Math.round(cost);
  }

  /* ---------- equity: gross margin the current base would bring in the next
     four quarters with no campaigns at all ---------- */
  function equity(w) {
    const save = w.customers.map(c => ({ e: c.e, cap: c.cap, dep: c.dep, miss: c.miss }));
    const t0 = w.t; let total = 0;
    const tmp = { t: t0, trust: w.trust, customers: w.customers.filter(c => c.joinT < t0) };
    for (let t = t0; t < t0 + 4; t++) {
      const out = stepCore(tmp, t, null);
      for (const r of out) { total += r.spend * P.margin; delete r.c.hist[t]; }
    }
    w.customers.forEach((c, i) => { c.e = save[i].e; c.cap = save[i].cap; c.dep = save[i].dep; c.miss = save[i].miss; });
    return Math.round(total);
  }
  function activeCount(w) {
    let n = 0;
    for (const c of w.customers) if (c.joinT < w.t && (c.hist[w.t - 1] || c.hist[w.t - 2])) n++;
    return n;
  }

  /* ---------- play one quarter and book it ----------
     d = { list:'M'|'F'|'R'|'X' }                        (Q1)
       | { alloc:{seg:tactic}, test:bool, fixed:NT$, mods:{...} } (Q2–Q4) */
  function play(w, d) {
    const t = w.t, snap = snapshot(w), tb = segTable(w, snap);
    const segOf = new Map(snap.map(r => [r.c.id, r.seg]));
    const plan = new Map(); const held = new Set();
    if (d.list) {
      const key = { M: r => -r.m, F: r => -r.f, R: r => r.days, X: r => u(r.c.id, -50, 1), '0': r => 0 }[d.list];
      const tie = r => u(r.c.id, -50, 2);
      snap.slice().sort((a, b) => key(a) - key(b) || tie(a) - tie(b)).slice(0, d.list === '0' ? 0 : P.q1Coupons)
        .forEach(r => plan.set(r.c.id, 'coupon'));
    } else {
      for (const r of snap) {
        const a = d.alloc[r.seg];
        if (!a || a === 'none') continue;
        if (r.c.seasonal && w.filterSeasonal) continue;
        if (d.test && u(r.c.id, t, 20) < P.holdout) { held.add(r.c.id); continue; }
        plan.set(r.c.id, a);
      }
    }
    // one-off modifiers decided before the quarter (event responses)
    const mods = d.mods || {};
    if (mods.eMult) for (const r of snap) { const m = mods.eMult[r.seg]; if (m && !r.c.seasonal) r.c.e = clamp(r.c.e * m, 0.01, 0.99); }
    if (mods.dep) for (const r of snap) { const m = mods.dep[r.seg]; if (m) r.c.dep = clamp(r.c.dep + m, 0, 1); }
    if (mods.trust) w.trust = clamp(w.trust + mods.trust, 0, 100);
    if (mods.joiners) for (let j = 0; j < mods.joiners; j++) {
      const id = w.nextId++; const a = u(id, -99, 1);
      w.customers.push(makeCustomer(id, t, a < 0.8 ? 'deal' : a < 0.96 ? 'occ' : 'reg'));
    }

    const out = stepCore(w, t, plan);

    const res = { t, seg: {}, tb, list: d.list || null, alloc: d.alloc || null, test: !!d.test, fixed: d.fixed || 0,
      revenue: 0, baseRev: 0, discount: 0, perk: 0, msg: 0, joinRev: 0, joiners: 0,
      targeted: 0, buyersT: 0, anywayT: 0, wasted: 0, incRevenue: 0, seasonalHit: 0, seasonalCost: 0, seasonalTargeted: 0, coupons: 0, perks: 0, redeemed: 0 };
    for (const s of SEGS) res.seg[s] = { n: 0, targeted: 0, buyers: 0, buyersT: 0, anywayT: 0, revenue: 0, cost: 0, incRev: 0, tactic: d.alloc ? d.alloc[s] : null, coupons: 0 };
    for (const r of out) {
      res.revenue += r.spend;
      if (r.joined) { res.joiners++; res.joinRev += r.spend; res.baseRev += r.spend; continue; }
      const s = res.seg[segOf.get(r.c.id)];
      s.n++; if (r.bought) { s.buyers++; s.revenue += r.spend; }
      res.baseRev += r.spendAnyway;
      if (r.tactic !== 'none') {
        s.targeted++; res.targeted++;
        if (r.c.seasonal) res.seasonalTargeted++;
        if (r.tactic === 'coupon') {
          s.coupons++; res.coupons++; res.msg += P.msg; s.cost += P.msg;
          if (r.bought) { res.redeemed++; res.discount += P.coupon; s.cost += P.coupon; if (r.anyway) res.wasted += P.coupon; if (r.c.seasonal) res.seasonalCost += P.coupon; }
        } else {
          res.perks++; res.perk += P.perkCost; s.cost += P.perkCost;
          if (r.c.seasonal) res.seasonalCost += P.perkCost;
        }
        if (r.bought) {
          s.buyersT++; res.buyersT++;
          if (r.anyway) { s.anywayT++; res.anywayT++; }
          if (r.c.seasonal) res.seasonalHit++;
        }
        s.incRev += r.spend - r.spendAnyway;
        res.incRevenue += r.spend - r.spendAnyway;
      }
    }
    res.campaign = res.discount + res.perk + res.msg + res.fixed;
    res.profit = Math.round(res.revenue * P.margin - res.campaign);
    res.baseProfit = Math.round(res.baseRev * P.margin);   // same quarter, same members, no campaign

    // trust & fairness consequences (carry into the next quarter)
    let dTrust = 0; const notes = [];
    if (d.alloc) {
      const a = d.alloc;
      const winback = a.risk === 'coupon' || a.hib === 'coupon';
      if (winback && a.champ === 'none') {
        dTrust -= 5; notes.push('unfair');
      }
      let nCoupon = 0; for (const s of SEGS) if (a[s] === 'coupon') nCoupon += tb[s].n;
      if (nCoupon / snap.length > 0.5) { dTrust -= 3; notes.push('discountBrand'); }
      if (a.champ === 'perk') { dTrust += 3; notes.push('recogChamp'); }
      if (a.loyal === 'perk') { dTrust += 2; notes.push('recogLoyal'); }
    }
    w.trust = clamp(w.trust + dTrust, 0, 100);
    res.dTrust = dTrust + (mods.trust || 0); res.notes = notes;
    if (d.test) w.hasTest = true;

    res.trust = w.trust;
    res.active = activeCount(w);
    res.equity = equity(w);
    res.members = w.customers.filter(c => c.joinT < w.t).length;
    w.log.push(res);
    return res;
  }

  /* ---------- Q3 event, decided by what the team did in Q2 ---------- */
  function eventFor(alloc) {
    if ((alloc.risk === 'coupon' || alloc.hib === 'coupon') && alloc.champ === 'none') return 'FAIR';
    if (alloc.champ === 'coupon') return 'DEP';
    if (alloc.new === 'none') return 'NEGLECT';
    return 'RIVAL';
  }
  const EVENTS = {
    FAIR: [
      { lock: { champ: 'coupon' }, mods: { trust: 7 } },
      { lock: { champ: 'perk' },   mods: { trust: 4 } },
      { lock: {},                  mods: { trust: -6 } }
    ],
    DEP: [
      { lock: { champ: 'coupon' }, mods: {} },
      { lock: { champ: 'none' },   mods: { trust: -2, dep: { champ: -0.2, loyal: -0.2 } } },
      { lock: { champ: 'perk' },   mods: { trust: 3, dep: { champ: -0.15 } }, fixed: 12000 }
    ],
    NEGLECT: [
      { lock: { new: 'perk' },     mods: {} },
      { lock: {},                  mods: { joiners: 60 }, fixed: 36000 },
      { lock: {},                  mods: {} }
    ],
    RIVAL: [
      { lock: { champ: 'coupon' }, mods: { eMult: { loyal: 0.98 } } },
      { lock: { champ: 'perk' },   mods: { trust: 2, eMult: { loyal: 0.98 } }, fixed: 15000 },
      { lock: {},                  mods: { eMult: { champ: 0.96, loyal: 0.97 } } }
    ]
  };

  /* ---------- segment-to-segment movement between two snapshots ---------- */
  function migration(before, after) {
    const prev = new Map(before.map(r => [r.c.id, r.seg]));
    const m = {}; for (const a of SEGS.concat(['join'])) { m[a] = {}; for (const b of SEGS) m[a][b] = 0; }
    for (const r of after) m[prev.get(r.c.id) || 'join'][r.seg]++;
    return m;
  }

  // members who now hold back full-price orders while waiting for a code
  function dependents(w) { let n = 0; for (const c of w.customers) if (c.joinT < w.t && c.dep >= 0.3) n++; return n; }
  function seasonalCount(w) { let n = 0; for (const c of w.customers) if (c.joinT < w.t && c.seasonal) n++; return n; }
  function startKpi(w) { return { active: activeCount(w), equity: equity(w), trust: w.trust, members: w.customers.filter(c => c.joinT < w.t).length }; }

  return { P, SEGS, TACTICS, newWorld, dependents, seasonalCount, startKpi, snapshot, segTable, planCost, play, eventFor, EVENTS, migration,
           rfm, equity, activeCount, prob, rScore, fScore, mScore, segmentOf, isLNY };

    '第三季的事件取決於第二季的方案：發挽回券但冠軍客什麼都沒有，出現「忠誠的懲罰」；發券給冠軍客，出現「被養成的習慣」；新客什麼都沒有，出現「第二單的懸崖」；其他情況則是「對手進場」。',
    '約有 35 位會員只在農曆年前下單，而農曆年落在第三季。',
    '相同的決定一定得到相同的結果，方便各組互相比較。在網址後面加上 ?seed=7 可以換一批會員，加上 ?lang=en 或 ?lang=zh 可以指定語言。',
    '建議時間：任務說明 5 分鐘、第一季 5、第二季 12、第三季 10、第四季 6、結算 10。',
    '班級模式：在教師頁自訂班級代碼，取得學生用的網址。之後每一季各組的決定、回答和數字都會出現在教師頁，各組要等您開放才能進入下一季。班級模式下不顯示「重新開始」；如果某一組必須重來，請在網址後面加上 ?reset=1。'
  ]],
  sumTeam: ['Team', '隊名'],
  sumDecisions: ['Decisions', '決定'],
  sumResult: ['Result', '結果'],
  sumWhy: ['Why', '理由']
};
</script>
<script>
/* ============================================================
   APP — screens, state, and the glue between Engine and the page.
   The saved state holds only the team's decisions; every number
   on screen is recomputed from them, so a refresh loses nothing.
   ============================================================ */
(() => {
  'use strict';
  const E = Engine;
  const app = document.getElementById('app');
  const STEPS = ['intro', 'q1', 'q1r', 'q2x', 'q2', 'q2r', 'q3', 'q3r', 'q4', 'q4r', 'end'];
  const RAIL_OF = { intro: 0, q1: 1, q1r: 1, q2x: 2, q2: 2, q2r: 2, q3: 3, q3r: 3, q4: 4, q4r: 4, end: 5 };
  const LS_KEY = 'lastcoupon.v1';
  const qs = new URLSearchParams(location.search);
  const SEED = qs.has('seed') && /^\d+$/.test(qs.get('seed')) ? parseInt(qs.get('seed'), 10) : E.P.seed;
  const ODD_ANSWER = 2;                                   // Mrs. Lin
  // Class mode: config.js holds the address of the instructor's Google Sheet backend,
  // and the link students open carries ?class=CODE. Without both, the game runs on its own.
  const CFG = window.LAST_COUPON_CONFIG || {};
  const SYNC_URL = /^https?:\/\//.test(CFG.syncUrl || '') ? CFG.syncUrl : '';
  const normClass = v => String(v || '').toUpperCase().replace(/[^A-Z0-9_-]/g, '').slice(0, 20);
  const URL_CLASS = SYNC_URL ? normClass(qs.get('class')) : '';
  const NEED = { q1r: 2, q2r: 3, q3r: 4, q4r: 5 };        // stage the instructor must open before leaving each results page
  const POLL_MS = +CFG.pollMs || 6000;
  const Q_START = ['2026-07-01', '2026-10-01', '2027-01-01', '2027-04-01'];
  const PEOPLE = [
    { last: '2026-09-22', orders: 22, spend: 21400, tl: [2, 3, 3, 2, 3, 3, 3, 3] },
    { last: '2025-11-23', orders: 14, spend: 26800, tl: [4, 4, 3, 2, 1, 0, 0, 0] },
    { last: '2026-02-06', orders: 2, spend: 23600, tl: [0, 1, 0, 0, 0, 1, 0, 0] },
    { last: '2026-09-10', orders: 1, spend: 780, tl: [0, 0, 0, 0, 0, 0, 0, 1] },
    { last: '2026-07-18', orders: 8, spend: 7900, tl: [1, 1, 1, 1, 1, 1, 1, 1] },
    { last: '2025-08-26', orders: 1, spend: 650, tl: [0, 0, 0, 1, 0, 0, 0, 0] }
  ];
  const TL_AXIS = [['Q4', '2024'], ['Q1', '2025'], ['Q2', ''], ['Q3', ''], ['Q4', ''], ['Q1', '2026'], ['Q2', ''], ['Q3', '']];
  const REF_SPECS = {
    none:    { q1: '0', prio: [], ev: { FAIR: 2, DEP: 1, NEGLECT: 2, RIVAL: 2 } },
    best:    { q1: 'M', prio: [['champ', 'coupon'], ['loyal', 'coupon'], ['new', 'coupon']], ev: { FAIR: 0, DEP: 0, NEGLECT: 2, RIVAL: 0 } },
    back:    { q1: 'M', prio: [['risk', 'coupon'], ['hib', 'coupon'], ['new', 'coupon']], ev: { FAIR: 2, DEP: 1, NEGLECT: 2, RIVAL: 2 } },
    nurture: { q1: 'R', prio: [['champ', 'perk'], ['loyal', 'perk'], ['new', 'perk']], ev: { FAIR: 1, DEP: 2, NEGLECT: 0, RIVAL: 1 } },
    greedy:  { q1: 'X', greedy: true, prio: [], ev: { FAIR: 2, DEP: 1, NEGLECT: 2, RIVAL: 2 } }
  };

  /* ---------- state ---------- */
  const noneAlloc = () => ({ champ: 'none', loyal: 'none', new: 'none', risk: 'none', hib: 'none' });
  function initialLang() {
    const q = qs.get('lang');
    if (q === 'en' || q === 'zh') return q;
    return /^zh/i.test(navigator.language || '') ? 'zh' : 'en';
  }
  // One id per device, so a team that starts over replaces its own rows in the instructor's sheet
  function deviceId() {
    const make = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
    try { let id = localStorage.getItem(LS_KEY + '.tid'); if (!id) { id = make(); localStorage.setItem(LS_KEY + '.tid', id); } return id; }
    catch (e) { return make(); }
  }
  function fresh() {
    return {
      v: 1, seed: SEED, lang: initialLang(), team: '', step: 'intro',
      cls: URL_CLASS, tid: deviceId(), out: [],
      end: { q: 0, a: '', sent: false },
      q1: { list: null, why: '' },
      ex: { ans: {}, checked: false, odd: null, oddDone: false },
      q2: { alloc: noneAlloc(), test: false, why: '' },
      q3: { ev: null, alloc: noneAlloc(), test: false, why: '' },
      q4: { alloc: noneAlloc(), why: '' }
    };
  }
  function load() {
    try {
      if (qs.has('reset')) { localStorage.removeItem(LS_KEY); return null; }
      const s = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
      if (!s || s.v !== 1 || s.seed !== SEED || !STEPS.includes(s.step)) return null;
      if (URL_CLASS && s.cls !== URL_CLASS) return null;           // a class link always starts that class's game
      return Object.assign(fresh(), s);
    } catch (e) { return null; }
  }
  function save() { try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) { /* private mode: play on without saving */ } }
  let S = load() || fresh();
  let SIM = null;
  const UI = { sort: 'm', armed: null, msg: '', gate: null, gateFails: 0, bypass: false, nextLabel: '', timer: null, syncErr: false };
  const classMode = () => !!(SYNC_URL && S.cls);

  /* ---------- formatting ---------- */
  const L = () => (S.lang === 'zh' ? 1 : 0);
  function t(key, ...a) { const v = T[key][L()]; return typeof v === 'function' ? v(...a) : v; }
  const nf = n => Math.round(n).toLocaleString('en-US');
  const money = n => (n < 0 ? '−' : '') + 'NT$' + nf(Math.abs(n));
  const signed = n => (Math.round(n) > 0 ? '+' : Math.round(n) < 0 ? '−' : '') + nf(Math.abs(n));
  const pct = x => Math.round(x * 100) + '%';
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  function fmtDate(d) {
    return S.lang === 'zh' ? `${d.getUTCFullYear()}/${d.getUTCMonth() + 1}/${d.getUTCDate()}` : `${d.getUTCDate()} ${MON[d.getUTCMonth()]} ${d.getUTCFullYear()}`;
  }
  const dayMs = 864e5;
  const dateBefore = (iso, days) => new Date(Date.parse(iso + 'T00:00:00Z') - days * dayMs);
  const segName = s => T.seg[L()][s][0];
  const segDef = s => T.seg[L()][s][1];
  const tacName = a => t(a === 'perk' ? 'tPerk' : a === 'coupon' ? 'tCoupon' : 'tNone');
  const stepIdx = s => STEPS.indexOf(s);
  const past = s => stepIdx(S.step) > stepIdx(s);
  function fmtAxis(n) {
    const a = Math.abs(n);
    if (S.lang === 'zh') return a >= 1e4 ? (+(n / 1e4).toFixed(1)) + ' 萬' : nf(n);
    return a >= 1e6 ? (+(n / 1e6).toFixed(2)) + 'M' : a >= 1e4 ? (+(n / 1e3).toFixed(0)) + 'K' : nf(n);
  }

  /* ---------- simulation from the saved decisions ---------- */
  function simulate() {
    const w = E.newWorld({ seed: S.seed });
    const sim = { w, start: E.startKpi(w), res: [], snaps: [], tabs: [], event: null };
    sim.snaps[0] = E.snapshot(w); sim.tabs[0] = E.segTable(w, sim.snaps[0]);
    if (past('q1')) {
      sim.res[0] = E.play(w, { list: S.q1.list });
      w.filterSeasonal = !!(S.ex.oddDone && S.ex.odd === ODD_ANSWER);
      sim.snaps[1] = E.snapshot(w); sim.tabs[1] = E.segTable(w, sim.snaps[1]);
    }
    if (past('q2')) {
      sim.res[1] = E.play(w, { alloc: S.q2.alloc, test: S.q2.test, fixed: S.q2.test ? E.P.testCost : 0 });
      sim.event = E.eventFor(S.q2.alloc);
      sim.snaps[2] = E.snapshot(w); sim.tabs[2] = E.segTable(w, sim.snaps[2]);
    }
    if (past('q3')) {
      const opt = E.EVENTS[sim.event][S.q3.ev];
      sim.res[2] = E.play(w, { alloc: S.q3.alloc, test: S.q3.test, mods: opt.mods, fixed: (opt.fixed || 0) + (S.q3.test ? E.P.testCost : 0) });
      sim.snaps[3] = E.snapshot(w); sim.tabs[3] = E.segTable(w, sim.snaps[3]);
    }
    if (past('q4')) sim.res[3] = E.play(w, { alloc: S.q4.alloc });
    return sim;
  }
  function autoPlay(spec) {
    const w = E.newWorld({ seed: S.seed }); const res = [];
    const fit = (budget, lock) => {
      const tb = E.segTable(w); const a = Object.assign(noneAlloc(), lock || {});
      let prio = spec.prio;
      if (spec.greedy) {            // whatever shows a profit per member this quarter, biggest total gain first
        prio = E.SEGS.map(s => tb[s].valCoupon >= tb[s].valPerk ? [s, 'coupon', tb[s].valCoupon] : [s, 'perk', tb[s].valPerk])
          .filter(x => x[2] > 0).sort((x, y) => y[2] - x[2]);
      }
      for (const [s, tac] of prio) {
        if (lock && lock[s]) continue;
        const trial = Object.assign({}, a, { [s]: tac });
        if (E.planCost(tb, trial, false) <= budget) a[s] = tac;
      }
      return a;
    };
    res.push(E.play(w, { list: spec.q1 }));
    const a2 = fit(E.P.budgets[1]); res.push(E.play(w, { alloc: a2 }));
    const opt = E.EVENTS[E.eventFor(a2)][spec.ev[E.eventFor(a2)]];
    res.push(E.play(w, { alloc: fit(E.P.budgets[2] - (opt.fixed || 0), opt.lock), mods: opt.mods, fixed: opt.fixed || 0 }));
    res.push(E.play(w, { alloc: fit(E.P.budgets[3]) }));
    return { res, w, kpi: kpiOf(res) };
  }
  const kpiOf = res => ({ profit: res.reduce((s, r) => s + r.profit, 0), active: res[res.length - 1].active, equity: res[res.length - 1].equity, trust: res[res.length - 1].trust });

  function planInfo(qn) {
    const d = S['q' + qn], tb = SIM.tabs[qn - 1];
    let fixedEvent = 0, lock = {};
    if (qn === 3 && d.ev != null) { const o = E.EVENTS[SIM.event][d.ev]; fixedEvent = o.fixed || 0; lock = o.lock; }
    const test = qn < 4 && !!d.test;
    const fixedTest = test ? E.P.testCost : 0;
    const cost = E.planCost(tb, d.alloc, test);
    const budget = E.P.budgets[qn - 1];
    const total = cost + fixedEvent + fixedTest;
    const onlyLocked = E.SEGS.every(s => lock[s] || d.alloc[s] === 'none') && !test;
    return { cost, fixedEvent, fixedTest, total, budget, over: total > budget && !onlyLocked, lock, test };
  }
  const hasTestInfo = qn => (qn === 3 && S.q2.test) || (qn === 4 && (S.q2.test || S.q3.test));
  const canTest = qn => qn === 2 || (qn === 3 && !S.q2.test);

  /* ---------- class mode: send decisions, wait for the instructor ---------- */
  async function api(method, payload) {
    let r;
    if (method === 'GET') r = await fetch(SYNC_URL + '?' + new URLSearchParams(payload), { cache: 'no-store' });
    else r = await fetch(SYNC_URL, { method: 'POST', body: JSON.stringify(payload) });   // sent as text/plain, which Apps Script accepts without a preflight
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'refused');
    return j;
  }
  let flushing = false;
  async function flush() {
    if (!classMode() || flushing || !S.out.length) return;
    flushing = true;
    try {
      while (S.out.length) {
        const j = await api('POST', S.out[0]);
        S.out.shift(); save();
        if (j.open != null) setGate(j.open);
      }
      UI.syncErr = false;
    } catch (e) { UI.syncErr = true; }
    flushing = false; updateSync();
  }
  function queue(p) {
    if (!classMode()) return;
    S.out = S.out.filter(x => x.stage !== p.stage); S.out.push(p); save(); updateSync(); flush();
  }
  function setGate(n) { if (n !== UI.gate) { UI.gate = n; updateWait(); } }
  async function checkGate() {
    if (!classMode()) return;
    try { const j = await api('GET', { action: 'gate', cls: S.cls }); UI.gateFails = 0; setGate(j.open); }
    catch (e) { UI.gateFails++; }
    updateWait(); flush();
  }
  const gateOpen = () => { const need = NEED[S.step]; return !classMode() || !need || UI.bypass || (UI.gate != null && UI.gate >= need); };
  function poll() {
    clearTimeout(UI.timer);
    if (!classMode() || !NEED[S.step] || gateOpen()) return;
    UI.timer = setTimeout(async () => { await checkGate(); poll(); }, POLL_MS + Math.random() * 1500);
  }
  function syncText() {
    if (!classMode()) return '';
    return `${t('clsLabel')} ${S.cls}` + (S.out.length ? `, ${t(UI.syncErr ? 'syncRetry' : 'syncPending')}` : '');
  }
  function updateSync() { const el = document.getElementById('sync'); if (el) { el.textContent = syncText(); el.classList.toggle('err', UI.syncErr && S.out.length > 0); } }
  function gateHtml() {
    if (gateOpen()) return nextBtn(UI.nextLabel);
    const need = NEED[S.step], off = UI.gateFails >= 3;
    return `<div class="wait" role="status" aria-live="polite"><strong>${t('waitTitle', need)}</strong><span>${t(off ? 'waitOffline' : 'waitText')}</span>
      <div class="commit"><button type="button" class="btn-ghost" data-act="recheck">${t('recheck')}</button>${off ? `<button type="button" class="btn-ghost" data-act="bypass">${t('bypass')}</button>` : ''}</div></div>`;
  }
  function gateBtn(label) { UI.nextLabel = label; return `<div id="gatebox">${gateHtml()}</div>`; }
  function updateWait() { const box = document.getElementById('gatebox'); if (box) box.innerHTML = gateHtml(); if (gateOpen()) clearTimeout(UI.timer); }
  // What the instructor's sheet receives. Always written in Chinese so the sheet reads the same whatever language a team plays in.
  const zh1 = (key, ...a) => { const v = T[key][1]; return typeof v === 'function' ? v(...a) : v; };
  const planZh = al => E.SEGS.filter(s => al[s] !== 'none').map(s => `${T.seg[1][s][0]}：${zh1(al[s] === 'perk' ? 'tPerk' : 'tCoupon')}`).join('；') || '沒有對任何人發優惠';
  function payloadFor(stage) {
    const base = { action: 'submit', cls: S.cls, team: S.team, tid: S.tid, stage, lang: S.lang };
    if (stage === 'end') {
      const k = kpiOf(SIM.res);
      return Object.assign(base, { text: T.qs[1][S.end.q], why: S.end.a, pc: k.profit, active: k.active, equity: k.equity, trust: k.trust, d: JSON.stringify({ q: S.end.q }) });
    }
    const qn = +stage.slice(1), r = SIM.res[qn - 1], d = S['q' + qn];
    let text, code;
    if (qn === 1) { text = '折價券發給：' + T.q1Opts[1][d.list][0]; code = { list: d.list }; }
    else {
      text = planZh(d.alloc) + (d.test ? '。做了對照組測試' : ''); code = { alloc: d.alloc, test: !!d.test };
      if (qn === 2) {
        const right = PEOPLE.filter((_, i) => S.ex.ans[i] === person(i).seg).length, spotted = S.ex.oddDone && S.ex.odd === ODD_ANSWER;
        text += `。親手分群答對 ${right}／6；${spotted ? '看出' : '沒看出'}年節送禮型會員`; code.ex = { right, spotted };
      }
      if (qn === 3) { const ev = T.events[1][SIM.event]; text = `事件「${ev.title}」：${ev.opts[d.ev][0]}。` + text; code.ev = SIM.event; code.opt = d.ev; }
    }
    return Object.assign(base, { text, why: d.why, pq: r.profit, pc: SIM.res.slice(0, qn).reduce((s, x) => s + x.profit, 0), active: r.active, equity: r.equity, trust: r.trust, d: JSON.stringify(code) });
  }

  /* ---------- chrome ---------- */
  function top() {
    return `<header class="top">
      <div class="brand">${t('brand')}<small>${t('desk')}</small></div>
      <div class="top-actions">
        ${classMode() ? `<span class="sync${UI.syncErr && S.out.length ? ' err' : ''}" id="sync">${esc(syncText())}</span>` : ''}
        <div class="lang" role="group" aria-label="Language / 語言">
          <button type="button" data-act="lang" data-v="en" aria-pressed="${S.lang === 'en'}">EN</button>
          <button type="button" data-act="lang" data-v="zh" aria-pressed="${S.lang === 'zh'}">中文</button>
        </div>
        ${S.step !== 'intro' && !classMode() ? `<button type="button" class="quiet" data-act="restart" data-label="${esc(t('restart'))}" data-arm="${esc(t('restartArm'))}">${t('restart')}</button>` : ''}
      </div>
    </header>`;
  }
  function rail() {
    const now = RAIL_OF[S.step];
    return `<ol class="rail" aria-label="Progress">${T.rail[L()].map((x, i) =>
      `<li class="${i < now ? 'done' : i === now ? 'now' : ''}"${i === now ? ' aria-current="step"' : ''}>${x}</li>`).join('')}</ol>`;
  }
  function kpis() {
    const r = SIM.res, n = r.length, last = r[n - 1], prev = n > 1 ? r[n - 2] : SIM.start;
    const cum = r.reduce((s, x) => s + x.profit, 0);
    const cur = last || SIM.start;
    const d = (a, b, f) => { const x = a - b; return `<span class="${x > 0 ? 'up' : x < 0 ? 'down' : ''}">${f(x)}</span> ${t('kVsLast')}`; };
    const tile = (label, val, delta) => `<div class="kpi"><div class="k-label">${label}</div><div class="k-val">${val}</div><div class="k-delta">${delta}</div></div>`;
    return `<section class="kpis" aria-label="Scoreboard">
      ${tile(t('kProfit'), money(cum), n ? `${signed(last.profit)} ${t('kThisQ')}` : t('kStart'))}
      ${tile(t('kActive'), nf(cur.active), n ? d(cur.active, prev.active, signed) : t('kStart'))}
      ${tile(t('kEquity'), money(cur.equity), n ? d(cur.equity, prev.equity, signed) : t('kStart'))}
      ${tile(t('kTrust'), nf(cur.trust), n ? d(cur.trust, prev.trust, signed) : t('kStart'))}
    </section>`;
  }
  const head = (period, title, text) => `<p class="period">${period}</p><h1 class="stage-title" tabindex="-1">${title}</h1>${text ? `<p class="lede">${text}</p>` : ''}`;
  const whyField = key => `<label class="field"><span>${T.whyQ[L()][+key.slice(1) - 1]}</span><textarea data-bind="${key}.why" maxlength="240" placeholder="${esc(t('whyPh'))}">${esc(S[key].why)}</textarea></label>`;
  const commit = (act, label) => `<div class="commit"><button type="button" class="btn-ticket" data-act="${act}" data-label="${esc(label)}" data-arm="${esc(t('confirm'))}">${label}</button><span class="msg" role="status" aria-live="polite">${esc(UI.msg)}</span></div>`;
  const nextBtn = (label) => `<div class="commit"><button type="button" class="btn-plain" data-act="next">${label}</button></div>`;

  /* ---------- intro ---------- */
  function vIntro() {
    const dl = rows => `<dl class="defs">${rows.map(r => `<div><dt>${r[0]}</dt><dd>${r[1]}</dd></div>`).join('')}</dl>`;
    return `<div class="hero">
        <div class="ticket">
          <div class="ticket-main"><h1>${t('title')}</h1><p>${t('tagline')}</p></div>
          <div class="ticket-stub"><div class="amount"><small>${t('stubSmall')}</small>NT$200</div><div class="valid">${t('stubValid')}</div></div>
        </div>
        <div class="hero-copy"><p>${t('introLead')}</p><p class="fict">${t('fictional')}</p></div>
      </div>
      <div class="cols">
        <section><h2>${t('howH')}</h2><ol class="steps">${T.how[L()].map(x => `<li><span>${x}</span></li>`).join('')}</ol></section>
        <section><h2>${t('rolesH')}</h2>${dl(T.roles[L()])}<p class="small" style="margin-top:.5rem">${t('rolesNote')}</p></section>
        <section><h2>${t('scoreH')}</h2>${dl(T.score[L()])}</section>
        <section><h2>${t('toolsH')}</h2>${dl(T.tools[L()])}</section>
      </div>
      ${classMode() ? `<p class="callout">${t('clsNotice', esc(S.cls))}</p>` : ''}
      <label class="field narrow"><span>${t('teamLabel')}</span><input type="text" data-bind="team" maxlength="40" value="${esc(S.team)}" placeholder="${esc(t('teamPh'))}" autocomplete="off"></label>
      <div class="commit"><button type="button" class="btn-plain" data-act="start">${t('start')}</button><span class="msg" role="status" aria-live="polite">${esc(UI.msg)}</span></div>`;
  }

  /* ---------- Q1 ---------- */
  function vQ1() {
    const rows = SIM.snaps[0].slice();
    const key = { m: r => -r.m, f: r => -r.f, r: r => r.days }[UI.sort];
    rows.sort((a, b) => key(a) - key(b) || a.c.id - b.c.id);
    const sortBtn = (k, label) => `<button type="button" class="sort" data-act="sort" data-v="${k}" aria-pressed="${UI.sort === k}">${label}</button>`;
    const o = T.q1Opts[L()];
    return head(t('q1Period'), t('q1Title'), t('q1Text')) + `
      <h2>${t('q1Cap')}</h2>
      <div class="block scroll"><table class="data">
        <thead><tr><th>${t('colMember')}</th><th>${sortBtn('f', t('colOrders'))}</th><th>${sortBtn('m', t('colSpend'))}</th><th>${sortBtn('r', t('colLast'))}</th></tr></thead>
        <tbody>${rows.slice(0, 12).map(r => `<tr><td>M-${String(r.c.id + 1).padStart(4, '0')}</td><td>${r.f}</td><td>${nf(r.m)}</td><td>${fmtDate(dateBefore(Q_START[0], r.days))}</td></tr>`).join('')}</tbody>
